services:
  - type: web
    name: ekikyo-api
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false        # ダッシュボードで手動設定
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DAILY_LIMIT
        value: "1"
