    { bits: [0,0,1], k: '艮', reading: 'ごん', e: '山', gloss: '静止と、たくわえ', verb: '山のようにいったん止まり' },
    { bits: [0,0,0], k: '坤', reading: 'こん', e: '地', gloss: '受容と育み', verb: '地のように受けとめ' },
  ];
  // KW[lowerIdx][upperIdx], trigram order 乾兌離震巽坎艮坤
  KW = [
    [1,43,14,34,9,5,26,11],
    [10,58,38,54,61,60,41,19],
    [13,49,30,55,37,63,22,36],
    [25,17,21,51,42,3,27,24],
    [44,28,50,32,57,48,18,46],
    [6,47,64,40,59,29,4,7],
    [33,31,56,62,53,39,52,15],
    [12,45,35,16,20,8,23,2],
  ];
  NAMES = [null,'乾為天','坤為地','水雷屯','山水蒙','水天需','天水訟','地水師','水地比','風天小畜','天澤履','地天泰','天地否','天火同人','火天大有','地山謙','雷地豫','澤雷随','山風蠱','地澤臨','風地観','火雷噬嗑','山火賁','山地剝','地雷復','天雷无妄','山天大畜','山雷頤','澤風大過','坎為水','離為火','澤山咸','雷風恒','天山遯','雷天大壮','火地晋','地火明夷','風火家人','火澤睽','水山蹇','雷水解','山澤損','風雷益','澤天夬','天風姤','澤地萃','地風升','澤水困','水風井','澤火革','火風鼎','震為雷','艮為山','風山漸','雷澤帰妹','雷火豊','火山旅','巽為風','兌為澤','風水渙','水澤節','風澤中孚','雷山小過','水火既済','火水未済'];

  triIdx(bits) {
    for (let i = 0; i < 8; i++) {
      const t = this.TRI[i].bits;
      if (t[0] === bits[0] && t[1] === bits[1] && t[2] === bits[2]) return i;
    }
    return 0;
  }
  hexFromLines(vals) {
    const lo = this.triIdx(vals.slice(0, 3));
    const up = this.triIdx(vals.slice(3, 6));
    const num = this.KW[lo][up];
    return { num, name: this.NAMES[num], lower: this.TRI[lo], upper: this.TRI[up], lines: vals.slice() };
  }
  hexToRgba(hex, a) {
    const h = hex.replace('#', '');
    const r = parseInt(h.substring(0, 2), 16), g = parseInt(h.substring(2, 4), 16), b = parseInt(h.substring(4, 6), 16);
    return `rgba(${r},${g},${b},${a})`;
  }

  accent() { return CONFIG.ACCENT; }

  // ---- history store (localStorage, newest-first) ----
  loadHistory() { try { return JSON.parse(localStorage.getItem('kz_history') || '[]') || []; } catch (e) { return []; } }
  saveHistory(arr) { try { localStorage.setItem('kz_history', JSON.stringify(arr)); } catch (e) {} }
  newId() { return 'r' + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36); }

  sessionFields = ['screen','question','casts','rot','rotZ','everTossed','pastLines','focusIndex','detailNum','refQuery','viewing','aiRevealed','aiResult','aiError'];
  loadSession() {
    try {
      const saved = JSON.parse(sessionStorage.getItem('kz_session') || 'null');
      if (!saved || !['ask','cast','result','about','history','reference','detail'].includes(saved.screen)) return null;
      if ((saved.screen === 'cast' || saved.screen === 'result') && !Array.isArray(saved.casts)) return null;
      return saved;
    } catch (_) { return null; }
  }
  saveSession() {
    try {
      const saved = {};
      this.sessionFields.forEach((key) => { saved[key] = this.state[key]; });
      sessionStorage.setItem('kz_session', JSON.stringify(saved));
    } catch (_) {}
  }
  viewUrl(screen, detailNum) { return '#' + screen + (screen === 'detail' && detailNum ? '-' + detailNum : ''); }
  replaceBrowserView(screen, detailNum) {
    try { history.replaceState({ kz: true, screen, detailNum: detailNum || null }, '', this.viewUrl(screen, detailNum)); } catch (_) {}
  }
  pushBrowserView(screen, detailNum) {
    try { history.pushState({ kz: true, screen, detailNum: detailNum || null }, '', this.viewUrl(screen, detailNum)); } catch (_) {}
  }
  hasCastInProgress() { return this.state.screen === 'cast' && this.state.casts.length > 0; }
  confirmDiscardCast() { return !this.hasCastInProgress() || window.confirm('途中まで立てた卦を閉じますか？\n投げた石の結果は失われます。'); }

  _onPopState = (ev) => {
    if (this._restoringCancelledBack) { this._restoringCancelledBack = false; return; }
    if (!this.confirmDiscardCast()) {
      this._restoringCancelledBack = true;
      try { history.forward(); } catch (_) {}
      return;
    }
    const view = ev.state && ev.state.kz ? ev.state : { screen: 'ask', detailNum: null };
    this.setState((s) => ({
      screen: view.screen || 'ask', detailNum: view.detailNum || null,
      navStack: s.navStack.length ? s.navStack.slice(0, -1) : [],
      menuOpen: false, glossTerm: null, aiConsentOpen: false, shareOpen: false, confirmClearOpen: false,
    }));
  };

  componentDidMount() {
    this.water = window.__kzWater || { ok: false, drop(){}, calm(){}, setIntensity(){}, poke(){}, destroy(){} };
    document.addEventListener('pointerdown', this._waterPointer, { passive: true });
    this._syncWaterIntensity();
    window.addEventListener('popstate', this._onPopState);
    // migrate a legacy single kz_prev into the history array
    try {
      if (!localStorage.getItem('kz_history')) {
        const raw = localStorage.getItem('kz_prev');
        if (raw) {
          const p = JSON.parse(raw);
          if (p && p.lines && p.lines.length === 6) {
            const present = this.hexFromLines(p.lines);
            this.saveHistory([{
              id: this.newId(), ts: Date.now(), date: new Date().toISOString().slice(0, 10),
              question: '', lines: p.lines, changing: [false,false,false,false,false,false],
              present: { num: present.num, name: present.name },
              future: { num: present.num, name: present.name }, pastLines: null, migrated: true,
            }]);
          }
        }
      }
    } catch (e) {}
    const restored = this.loadSession();
    if (restored) this.setState({ ...restored, navStack: restored.screen === 'ask' ? [] : [{ screen: 'ask', detailNum: null }] }, () => {
      if (this.state.screen === 'ask') this.replaceBrowserView('ask');
      else {
        this.replaceBrowserView('ask');
        this.pushBrowserView(this.state.screen, this.state.detailNum);
      }
    });
    else this.replaceBrowserView(this.state.screen, this.state.detailNum);
  }

  componentDidUpdate(prevProps, prevState) {
    this._syncWaterIntensity();
    this.saveSession();
    const wasSheet = prevState.menuOpen || prevState.glossTerm || prevState.aiConsentOpen || prevState.shareOpen || prevState.confirmClearOpen;
    const isSheet = this.state.menuOpen || this.state.glossTerm || this.state.aiConsentOpen || this.state.shareOpen || this.state.confirmClearOpen;
    if (!wasSheet && isSheet) {
      this._focusBeforeSheet = document.activeElement;
      setTimeout(() => {
        const first = this._sheetNode && this._sheetNode.querySelector('button, input, [href], [tabindex]:not([tabindex="-1"])');
        if (first) first.focus(); else if (this._sheetNode) this._sheetNode.focus();
      }, 0);
    } else if (wasSheet && !isSheet && this._focusBeforeSheet && this._focusBeforeSheet.focus) {
      this._focusBeforeSheet.focus();
      this._focusBeforeSheet = null;
    }
  }

  componentWillUnmount() {
    window.removeEventListener('popstate', this._onPopState);
    document.removeEventListener('pointerdown', this._waterPointer);
    if (this._aiAbort) this._aiAbort.abort();
    if (this.water && this.water.destroy) this.water.destroy();
  }

  // raise a ripple on taps that are NOT on interactive UI (buttons/inputs/links/role=button)
  _waterPointer = (ev) => {
    if (!this.water || !this.water.ok) return;
    if (ev.pointerType === 'mouse' && ev.button !== 0) return;
    var t = ev.target;
    if (t && t.closest && t.closest('button, a, input, textarea, select, [role="button"], [tabindex], .kz-coin')) {
      this.water.poke();
      return; // let the control handle it; no ripple over UI chrome
    }
    this.water.drop(ev.clientX, ev.clientY, 0.7);
  };

  _screenToWaterMode(screen) {
    if (screen === 'cast') return 'cast';
    if (screen === 'result') return 'result';
    return 'ask'; // ask/about/history/reference/detail → quiet shimmer
  }
  _syncWaterIntensity() {
    if (!this.water) return;
    var mode = this._screenToWaterMode(this.state.screen);
    if (this._waterMode !== mode) { this._waterMode = mode; this.water.setIntensity(mode); }
  }

  // ---- actions ----
  setQuestion = (e) => this.setState({ question: e.target.value });

  _resetAuto() {
    this._held = false;
    if (this._autoT) { clearTimeout(this._autoT); this._autoT = null; }
  }

  startCast = () => {
    this._resetAuto();
    this._warmBackend(); // begin warming the backend as the user starts casting
    this.setState((s) => ({
      screen: 'cast', casts: [], rot: [0,0,0], rotZ: [0,0,0], everTossed: false, tossing: false,
      aiRevealed: false, aiResult: null, aiError: '', aiLoading: false,
      navStack: s.navStack.concat([{ screen: 'ask', detailNum: null }]), menuOpen: false, autoCasting: false,
    }), () => this.pushBrowserView('cast'));
  };

  toss = () => {
    if (this.state.tossing || this.state.casts.length >= 6) return;
    const style = CONFIG.COIN_STYLE;
    const newRot = this.state.rot.slice();
    const newRotZ = this.state.rotZ.slice();
    const faces = []; // true = 表(head/陽面), false = 裏(tail)
    let y = 0;
    for (let i = 0; i < 3; i++) {
      const head = Math.random() < 0.5;
      faces.push(head);
      if (head) y += 1;
      // spin a few turns, then land rotateX on the matching face: 表→0°, 裏→180° (mod 360)
      const spins = (style === 'ripple' ? 1 : 2) + Math.floor(Math.random() * 2);
      const base = newRot[i] + spins * 360;
      const want = head ? 0 : 180;
      newRot[i] = base + (((want - (base % 360)) + 360) % 360);
      if (style === 'lift') newRotZ[i] += (Math.random() < 0.5 ? -1 : 1) * (160 + Math.floor(Math.random() * 3) * 360);
    }
    const value = (y % 2 === 1) ? 1 : 0;
    const changing = (y === 0 || y === 3);
    this.setState({ rot: newRot, rotZ: newRotZ, tossing: true, everTossed: true, tossSeq: this.state.tossSeq + 1, lastThrow: null });
    const dur = style === 'lift' ? 1100 : (style === 'ripple' ? 760 : 900);
    setTimeout(() => {
      this.setState((s) => ({
        casts: s.casts.concat([{ value, changing }]),
        tossing: false,
        lastThrow: { faces, value, changing, y },
        waterFlash: { seq: s.tossSeq, value: value },
      }), () => {
        this._splashStones(faces);
        var count = this.state.casts.length;
        if (count >= 6 && this.water) this.water.calm();      // sixth line: still the pond
        // press-and-hold: while held, keep tossing until 6; else stop
        if (this._held && this.state.casts.length < 6) {
          this._autoT = setTimeout(() => this.pumpToss(), 90);
        } else if (this.state.autoCasting && (!this._held || this.state.casts.length >= 6)) {
          this.setState({ autoCasting: false });
        }
      });
    }, dur + 160);
  };

  // drop three interfering ripples at the three coins' on-screen centers
  _splashStones(faces) {
    if (!this.water || !this.water.ok) return;
    var btn = this._coinBtnRef;
    if (!btn) return;
    var coins = btn.querySelectorAll('.kz-coin');
    for (var i = 0; i < coins.length; i++) {
      var r = coins[i].getBoundingClientRect();
      var cx = r.left + r.width / 2;
      var cy = r.top + r.height / 2;
      // a head (表/陽) hits a touch harder than a tail for a little variation
      var strength = (faces && faces[i]) ? 1.1 : 0.85;
      // stagger the three splashes slightly so the interference reads
      (function (self, x, y, s, delay) {
        setTimeout(function () { self.water.drop(x, y, s); }, delay);
      })(this, cx, cy, strength, i * 70);
    }
  }

  // ---- press and hold: keep throwing the stones while held, stop on release ----
  pumpToss() { if (this._held && !this.state.tossing && this.state.casts.length < 6) this.toss(); }
  onCoinDown = (ev) => {
    if (this.state.casts.length >= 6) return;
    try { ev.currentTarget.setPointerCapture(ev.pointerId); } catch (_) {}
    this._held = true;
    if (!this.state.autoCasting) this.setState({ autoCasting: true });
    this.pumpToss();
  };
  releaseCoin = () => {
    if (!this._held) return;
    this._held = false;
    if (this._autoT) { clearTimeout(this._autoT); this._autoT = null; }
    if (this.state.autoCasting) this.setState({ autoCasting: false });
  };
  onCoinKey = (ev) => {
    if (ev.key === 'Enter' || ev.key === ' ' || ev.key === 'Spacebar') {
      ev.preventDefault();
      if (!ev.repeat) this.toss(); // keyboard: one line per press
    }
  };

  goResult = () => {
    if (this.state.casts.length < 6) return;
    let used = false;
    let pastLines = null;
    const hist = this.loadHistory();
    try {
      used = localStorage.getItem('kz_ai_date') === this._jstDate();
    } catch (e) {}
    pastLines = (hist.length && hist[0].lines && hist[0].lines.length === 6) ? hist[0].lines : null;
    // 今日すでにAIを使っていれば「完了」状態にする。解釈テキストは占いごとに固有なので、
    // 別の占いには復元しない（aiResult は null のまま、render側で「受け取り済み」を表示）。
    this.setState({ screen: 'result', aiRevealed: used, aiResult: null, aiError: '', aiLoading: false, pastLines, focusIndex: pastLines ? 1 : 0, dragDX: 0, dragging: false, viewing: false }, () => this.replaceBrowserView('result'));
    // record this reading at the head of history
    try {
      const present = this.hexFromLines(this.state.casts.map(c => c.value));
      const changing = this.state.casts.map(c => !!c.changing);
      const futureLines = this.state.casts.map(c => c.changing ? (1 - c.value) : c.value);
      const future = this.hexFromLines(futureLines);
      const rec = {
        id: this.newId(), ts: Date.now(), date: this._jstDate(),
        question: this.state.question, lines: present.lines, changing,
        present: { num: present.num, name: present.name },
        future: { num: future.num, name: future.name }, pastLines,
      };
      this.saveHistory([rec].concat(hist).slice(0, 200));
    } catch (e) {}
  };

  // ---- history actions ----
  viewReading = (rec) => {
    const casts = rec.lines.map((v, i) => ({ value: v, changing: !!(rec.changing && rec.changing[i]) }));
    this.go('result', {
      casts, question: rec.question || '', pastLines: rec.pastLines || null,
      focusIndex: rec.pastLines ? 1 : 0, dragDX: 0, dragging: false, aiRevealed: false, aiResult: null, aiError: '', aiLoading: false, viewing: true,
    });
  };
  deleteReading = (id) => {
    const hist = this.loadHistory();
    const index = hist.findIndex((r) => r.id === id);
    if (index < 0) return;
    const rec = hist[index];
    this.saveHistory(hist.filter((r) => r.id !== id));
    this.setState({ deletedReading: { rec, index }, toast: '記録を削除しました' });
    this._clearToast(5000, true);
  };
  undoDeleteReading = () => {
    const deleted = this.state.deletedReading;
    if (!deleted) return;
    const hist = this.loadHistory();
    const next = hist.slice();
    next.splice(Math.min(deleted.index, next.length), 0, deleted.rec);
    this.saveHistory(next.slice(0, 200));
    this.setState({ deletedReading: null, toast: '記録を元に戻しました' });
    this._clearToast();
  };
  clearHistory = () => this.setState({ confirmClearOpen: true });
  confirmClearHistory = () => {
    this.saveHistory([]);
    this.setState({ confirmClearOpen: false, deletedReading: null, toast: '履歴をすべて削除しました' });
    this._clearToast();
  };

  again = () => {
    if (!this.confirmDiscardCast()) return;
    this.setState({ screen: 'ask', question: '', casts: [], rot: [0,0,0], rotZ: [0,0,0], aiRevealed: false, aiResult: null, aiError: '', aiLoading: false, focusIndex: 0, dragDX: 0, dragging: false, navStack: [], menuOpen: false, viewing: false, glossTerm: null, aiConsentOpen: false, shareOpen: false }, () => this.replaceBrowserView('ask'));
  };
  goHome = () => {
    if (this.state.screen === 'ask') return;
    this.go('ask');
  };

  // ---- navigation (state-based router with a back stack) ----
  go = (screen, extra) => this.setState((s) => ({
    navStack: s.navStack.concat([{ screen: s.screen, detailNum: s.detailNum }]),
    screen, menuOpen: false, glossTerm: null, ...(extra || {}),
  }), () => this.pushBrowserView(screen, extra && extra.detailNum));
  back = () => {
    if (!this.confirmDiscardCast()) return;
    if (this.state.navStack.length) { try { history.back(); return; } catch (_) {} }
    this.setState({ screen: 'ask', menuOpen: false, glossTerm: null }, () => this.replaceBrowserView('ask'));
  };
  onBack = () => {
    this.back();
  };
  toggleMenu = () => this.setState((s) => ({ menuOpen: !s.menuOpen }));
  closeMenu = () => this.setState({ menuOpen: false });

  // フロントの日次ゲートはサーバ(Asia/Tokyo)に合わせ、JSTの日付で判定する。
  _jstDate() { return new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 10); }

  // Render free tier spins down after ~15min idle (cold start ~30-60s). Wake it
  // ahead of need (page load / casting) so the wait hides behind the coin ritual.
  _warmBackend() {
    const now = Date.now();
    if (this._lastWarm && now - this._lastWarm < 10 * 60 * 1000) return;
    this._lastWarm = now;
    try {
      const u = (CONFIG.AI_ENDPOINT || '').replace(/\/api\/divine\/?$/, '/health');
      if (u) fetch(u, { mode: 'no-cors', cache: 'no-store' }).catch(() => {});
    } catch (e) {}
  }

  // The AI reading seam, now wired to the real backend. `this._aiPayload` is
  // built in renderVals (where the hexagrams are in scope). Cookie-based 1/day
  // lives server-side; localStorage(kz_ai_date) is the practical first-party gate.
  requestAI = () => {
    let consented = false;
    try { consented = localStorage.getItem('kz_ai_consent_v1') === '1'; } catch (_) {}
    if (!consented) { this.setState({ aiConsentOpen: true }); return; }
    this.runAI();
  };
  confirmAIConsent = () => {
    try { localStorage.setItem('kz_ai_consent_v1', '1'); } catch (_) {}
    this.setState({ aiConsentOpen: false }, this.runAI);
  };
  cancelAI = () => {
    if (this._aiAbort) this._aiAbort.abort();
    clearTimeout(this._slowT);
    this.setState({ aiLoading: false, aiSlow: false, aiError: '読み解きを中止しました。もう一度お試しいただけます。' });
  };
  runAI = async () => {
    if (this.state.aiLoading) return;
    this.setState({ aiLoading: true, aiError: '', aiSlow: false });
    // if it's taking a while (cold start), reassure rather than look stuck
    clearTimeout(this._slowT);
    this._slowT = setTimeout(() => { if (this.state.aiLoading) this.setState({ aiSlow: true }); }, 7000);
    const stampToday = () => { try { localStorage.setItem('kz_ai_date', this._jstDate()); } catch (e) {} };
    try {
      this._aiAbort = new AbortController();
      const r = await fetch(CONFIG.AI_ENDPOINT, {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(this._aiPayload || {}),
        signal: this._aiAbort.signal,
      });
      if (r.status === 429) {
        const j = await r.json().catch(() => ({}));
        clearTimeout(this._slowT);
        stampToday();
        this.setState({ aiLoading: false, aiSlow: false, aiRevealed: true, aiError: j.message || '今日はもう一度、同じ問いと向き合ってみてください。明日また占えます。' });
        return;
      }
      if (!r.ok) throw new Error('status ' + r.status);
      const data = await r.json();
      clearTimeout(this._slowT);
      stampToday();
      this.setState({ aiLoading: false, aiSlow: false, aiRevealed: true, aiError: '', aiResult: data });
    } catch (e) {
      clearTimeout(this._slowT);
      if (e && e.name === 'AbortError') return;
      this.setState({ aiLoading: false, aiSlow: false, aiError: '解釈の生成に失敗しました。通信環境をご確認のうえ、もう一度お試しください。' });
    } finally {
      this._aiAbort = null;
    }
  };

  // ---- share / image ----
  _clearToast(delay, keepDeleted) {
    if (this._toastT) clearTimeout(this._toastT);
    this._toastT = setTimeout(() => this.setState({ toast: '', deletedReading: keepDeleted ? null : this.state.deletedReading }), delay || 2200);
  }
  _present() { return this.hexFromLines(this.state.casts.map((c) => c.value)); }

  composeShareText(present, includeQuestion) {
    const h = this.hexContent(present.num);
    const q = (includeQuestion && this.state.question && this.state.question.trim()) ? '問い：' + this.state.question.trim() + '\n' : '';
    return q + '今回の卦は『' + present.name + '』（第' + present.num + '卦）。' + (h.summary || '') + '\n\n#易経 #兆kizashi';
  }

  // build the PNG File synchronously (no await) so navigator.share keeps the tap's
  // user-activation on iOS Safari — toDataURL + atob are sync, unlike canvas.toBlob.
  _makeShareFileSync(present, includeQuestion) {
    const canvas = this.drawShareCanvas(present, includeQuestion);
    const dataUrl = canvas.toDataURL('image/png');
    const bin = atob(dataUrl.slice(dataUrl.indexOf(',') + 1));
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new File([arr], 'kizashi-' + present.num + '-' + present.name + '.png', { type: 'image/png' });
  }

  openShareOptions = (mode) => this.setState({ shareOpen: true, shareMode: mode, shareIncludeQuestion: false });
  confirmShareOptions = () => {
    const mode = this.state.shareMode;
    const includeQuestion = this.state.shareIncludeQuestion;
    this.setState({ shareOpen: false }, () => {
      if (mode === 'save') this.saveImage(includeQuestion);
      else this.shareReading(includeQuestion);
    });
  };

  shareReading = async (includeQuestion) => {
    if (this.state.casts.length < 6) return;
    const present = this._present();
    const text = this.composeShareText(present, includeQuestion);
    const url = location.origin + location.pathname;
    let file = null;
    try { file = this._makeShareFileSync(present, includeQuestion); } catch (_) {}

    // 1) mobile/touch: native share sheet with the image attached (best for the X app / LINE).
    //    Gate on a coarse primary pointer (finger) so desktop (mouse) skips this and falls
    //    through to X's web intent below — the desktop OS share sheet usually lacks X and
    //    can't pre-fill a tweet, so on PC it can't reliably post to X.
    const coarsePointer = typeof matchMedia === 'function' && matchMedia('(pointer: coarse)').matches;
    if (coarsePointer && file && navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], text: text + '\n' + url, title: '兆 kizashi' });
        return;
      } catch (e) {
        if (e && e.name === 'AbortError') return; // user dismissed the share sheet
        // otherwise fall through to the manual fallback
      }
    }
    // 2) fallback (desktop / no file-share): open X's web intent, and also
    //    save the image + copy the text so the reading image can be attached by hand.
    //    (X's web intent can't attach images itself — but the URL renders the OG card.)
    try {
      // open the X composer first, while the tap's user-activation is still fresh.
      // NOTE: do NOT pass 'noopener'/'noreferrer' here — either one forces window.open()
      // to return null (spec), which would break the opened/blocked detection in `win` below.
      const intent = 'https://twitter.com/intent/tweet?text=' +
        encodeURIComponent(text) + '&url=' + encodeURIComponent(url);
      const win = window.open(intent, '_blank');
      if (file) {
        const u = URL.createObjectURL(file);
        const a = document.createElement('a'); a.href = u; a.download = file.name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => { try { URL.revokeObjectURL(u); } catch (_) {} }, 2000);
      }
      let copied = false;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        try { await navigator.clipboard.writeText(text + '\n' + url); copied = true; } catch (_) {}
      }
      const msg = win
        ? (file ? 'Xの投稿画面を開きました。画像も保存したので、必要なら添付してください' : 'Xの投稿画面を開きました')
        : (file ? (copied ? '画像を保存し、本文をコピーしました' : '画像を保存しました') : (copied ? 'コピーしました' : '共有に対応していません'));
      this.setState({ toast: msg });
      this._clearToast();
    } catch (e) {
      this.setState({ toast: '共有に失敗しました' }); this._clearToast();
    }
  };

  saveImage = async (includeQuestion) => {
    if (this.state.casts.length < 6) return;
    try {
      this.setState({ toast: '画像を作成中…' });
      if (typeof document !== 'undefined' && document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (_) {} }
      const present = this._present();
      const canvas = this.drawShareCanvas(present, includeQuestion);
      const fname = 'kizashi-' + present.num + '-' + present.name + '.png';
      const blob = await new Promise((res) => canvas.toBlob(res, 'image/png'));
      if (!blob) { this.setState({ toast: '画像の作成に失敗しました' }); this._clearToast(); return; }
      let shared = false;
      try {
        const file = new File([blob], fname, { type: 'image/png' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: '兆 kizashi' });
          shared = true;
        }
      } catch (_) {}
      if (!shared) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = fname;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => { try { URL.revokeObjectURL(url); } catch (_) {} }, 2000);
        this.setState({ toast: '画像を保存しました' }); this._clearToast();
      } else {
        this.setState({ toast: '' });
      }
    } catch (e) {
      this.setState({ toast: '画像の作成に失敗しました' }); this._clearToast();
    }
  };

  // Render the share image with the Canvas 2D API — reliable everywhere, unlike
  // html-to-image's foreignObject path which can come out blank on Safari / off-screen nodes.
  drawShareCanvas(present, includeQuestion) {
    const h = this.hexContent(present.num);
    const accent = CONFIG.ACCENT;
    const W = 540; // logical width (scaled by DPR below)
    const MINCHO = "'Shippori Mincho', serif";
    const GOTHIC = "'Zen Kaku Gothic New', sans-serif";
    const cardX = 26, cardPad = 34;
    const contentW = W - 2 * cardX - 2 * cardPad;
    const cx = W / 2;
    const date = new Date().toISOString().slice(0, 10);
    const question = (includeQuestion && this.state.question && this.state.question.trim()) ? this.state.question.trim() : '';

    // measuring pass (logical px, char-wrap for Japanese)
    const meas = document.createElement('canvas').getContext('2d');
    const wrap = (text, font, maxW) => {
      meas.font = font;
      const out = []; let line = '';
      for (const ch of text) {
        if (ch === '\n') { out.push(line); line = ''; continue; }
        const t = line + ch;
        if (meas.measureText(t).width > maxW && line) { out.push(line); line = ch; }
        else line = t;
      }
      if (line) out.push(line);
      return out;
    };
    const qLines = question ? wrap('「' + question + '」', '15px ' + MINCHO, contentW) : [];
    const jLines = h.judgment ? wrap(h.judgment, '15px ' + MINCHO, contentW - 20) : [];

    const hexW = 150, f = hexW / 104, barH = 13 * f, gap = 11 * f, yinGap = 18 * f;
    const hexH = 6 * barH + 5 * gap;
    const blocks = [{ t: 'mark', h: 34 }, { gap: 30 }];
    if (qLines.length) { blocks.push({ t: 'q', h: qLines.length * 24, lines: qLines }, { gap: 26 }); }
    blocks.push({ t: 'hex', h: hexH }, { gap: 28 }, { t: 'name', h: 32 }, { gap: 10 }, { t: 'reading', h: 16 }, { gap: 6 }, { t: 'num', h: 16 });
    if (jLines.length) { blocks.push({ gap: 28 }, { t: 'judg', h: jLines.length * 26, lines: jLines }); }
    blocks.push({ gap: 30 }, { t: 'foot', h: 14 });
    const contentH = blocks.reduce((s, b) => s + (b.h || b.gap || 0), 0);
    const LH = Math.round(cardX * 2 + cardPad * 2 + contentH);

    const DPR = 2;
    const canvas = document.createElement('canvas');
    canvas.width = W * DPR; canvas.height = LH * DPR;
    const ctx = canvas.getContext('2d');
    ctx.scale(DPR, DPR);
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    const rr = (x, y, w, hh, r) => { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + hh, r); ctx.arcTo(x + w, y + hh, x, y + hh, r); ctx.arcTo(x, y + hh, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); };

    ctx.fillStyle = '#e6e3dd'; ctx.fillRect(0, 0, W, LH);
    rr(cardX, cardX, W - 2 * cardX, LH - 2 * cardX, 26); ctx.fillStyle = '#ffffff'; ctx.fill();

    let y = cardX + cardPad;
    for (const b of blocks) {
      if (b.gap) { y += b.gap; continue; }
      if (b.t === 'mark') {
        ctx.font = '500 26px ' + MINCHO; const mw = ctx.measureText('兆').width;
        ctx.font = '11px ' + GOTHIC; const kw = ctx.measureText('K I Z A S H I').width;
        const startX = cx - (mw + 12 + kw) / 2;
        ctx.textAlign = 'left';
        ctx.fillStyle = '#2b2823'; ctx.font = '500 26px ' + MINCHO; ctx.fillText('兆', startX, y + 25);
        ctx.fillStyle = '#706b63'; ctx.font = '11px ' + GOTHIC; ctx.fillText('K I Z A S H I', startX + mw + 12, y + 21);
        ctx.textAlign = 'center';
      } else if (b.t === 'q') {
        ctx.fillStyle = '#706b63'; ctx.font = '15px ' + MINCHO;
        b.lines.forEach((ln, i) => ctx.fillText(ln, cx, y + 18 + i * 24));
      } else if (b.t === 'hex') {
        const rows = present.lines.slice().reverse(); let hy = y; ctx.fillStyle = accent;
        for (const v of rows) {
          if (v === 1) { rr(cx - hexW / 2, hy, hexW, barH, barH / 2); ctx.fill(); }
          else { const sw = (hexW - yinGap) / 2; rr(cx - hexW / 2, hy, sw, barH, barH / 2); ctx.fill(); rr(cx + hexW / 2 - sw, hy, sw, barH, barH / 2); ctx.fill(); }
          hy += barH + gap;
        }
      } else if (b.t === 'name') {
        ctx.fillStyle = '#2b2823'; ctx.font = '500 30px ' + MINCHO; ctx.fillText(present.name, cx, y + 28);
      } else if (b.t === 'reading') {
        if (h.reading) { ctx.fillStyle = '#706b63'; ctx.font = '13px ' + GOTHIC; ctx.fillText(h.reading, cx, y + 13); }
      } else if (b.t === 'num') {
        ctx.fillStyle = '#706b63'; ctx.font = '13px ' + GOTHIC; ctx.fillText('第' + present.num + '卦', cx, y + 13);
      } else if (b.t === 'judg') {
        ctx.fillStyle = '#4a4640'; ctx.font = '15px ' + MINCHO;
        b.lines.forEach((ln, i) => ctx.fillText(ln, cx, y + 18 + i * 26));
      } else if (b.t === 'foot') {
        ctx.fillStyle = '#706b63'; ctx.font = '12px ' + GOTHIC; ctx.fillText(date + '  ·  兆 kizashi', cx, y + 12);
      }
      y += b.h;
    }
    return canvas;
  }

  // ---- hexagram rendering ----
  renderHexagram(lines, opts) {
    const accent = this.accent();
    const style = opts.style || 'bars';
    const w = opts.w;
    const faded = !!opts.faded;
    const showChanging = !!opts.showChanging;
    const f = w / 104;
    let barH, gap, radius, yinGap;
    if (style === 'blocks') { barH = 20 * f; gap = 8 * f; radius = 6 * f; yinGap = 14 * f; }
    else if (style === 'thread') { barH = Math.max(2.5, 3 * f); gap = 17 * f; radius = 2; yinGap = 22 * f; }
    else { barH = 13 * f; gap = 11 * f; radius = 999; yinGap = 18 * f; }
    const col = faded ? this.hexToRgba(accent, 0.32) : accent;
    const blockBg = faded ? this.hexToRgba(accent, 0.13) : this.hexToRgba(accent, 0.9);
    const fill = style === 'blocks' ? blockBg : col;
    const rows = lines.slice().reverse();
    return e('div', { style: { display: 'flex', flexDirection: 'column', gap: gap + 'px', width: w + 'px' } },
      rows.map((ln, i) => {
        if (ln == null) {
          return e('div', { key: i, style: { height: barH + 'px', width: '100%', borderRadius: radius + 'px', background: this.hexToRgba(accent, 0.06) } });
        }
        const seg = (extra) => Object.assign({ height: barH + 'px', borderRadius: radius + 'px', background: fill }, extra);
        let bar;
        if (ln.v === 1) {
          bar = e('div', { style: seg({ width: '100%' }) });
        } else {
          const sw = `calc((100% - ${yinGap}px) / 2)`;
          bar = e('div', { style: { display: 'flex', width: '100%', height: barH + 'px', animation: opts.animate ? 'kz-line-in .5s ease both' : 'none' } },
            e('div', { style: seg({ width: sw }) }),
            e('div', { style: { width: yinGap + 'px' } }),
            e('div', { style: seg({ width: sw }) }));
        }
        const inner = e('div', { style: { width: '100%', animation: opts.animate ? 'kz-line-in .5s ease both' : 'none' } }, bar);
        if (showChanging && ln.changing) {
          const ms = Math.max(10, barH * 1.5);
          const ring = e('div', { key: 'r', style: { position: 'absolute', left: '50%', top: '50%', transform: 'translate(-50%,-50%)', width: ms + 'px', height: ms + 'px', borderRadius: '50%', border: `2px solid ${accent}`, background: '#ffffff', boxSizing: 'border-box' } });
          return e('div', { key: i, style: { position: 'relative', display: 'flex', alignItems: 'center' } }, inner, ring);
        }
        return inner;
      })
    );
  }

  hexCard(label, hex, main, hstyle) {
    const mincho = "'Shippori Mincho', serif";
    const w = main ? 104 : 58;
    const hexEl = this.renderHexagram(
      hex.lines.map((v, i) => ({ v, changing: main && this.changing && this.changing[i] })),
      { style: hstyle, w, faded: !main, showChanging: main }
    );
    return e('div', { style: { display: 'flex', flexDirection: 'column', alignItems: 'center', textAlign: 'center', flex: 'none', opacity: main ? 1 : 0.62 } },
      e('div', { style: { fontSize: '10px', letterSpacing: '0.18em', color: main ? '#2f3a6e' : '#706b63', marginBottom: '14px', whiteSpace: 'nowrap' } }, label),
      e('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'center', minHeight: main ? '150px' : '92px' } }, hexEl),
      e('div', { style: { fontFamily: mincho, fontSize: main ? '20px' : '14px', color: main ? '#2b2823' : '#706b63', marginTop: '16px', letterSpacing: '0.05em', lineHeight: 1.4 } }, hex.name),
      e('div', { style: { fontSize: main ? '11px' : '10px', color: '#706b63', marginTop: '5px', letterSpacing: '0.08em' } }, '第' + hex.num + '卦')
    );
  }

  buildCarousel(cells, fi, dragDX, dragging) {
    const accent = this.accent();
    const layout = CONFIG.RESULT_LAYOUT;
    const hstyle = CONFIG.HEX_STYLE;
    const C = 200;
    const W = this.state.stageW || 356;
    let peekScale, peekOpacity, showLine;
    if (layout === 'focus') { peekScale = 0.34; peekOpacity = 0; showLine = false; }
    else if (layout === 'rail') { peekScale = 0.5; peekOpacity = 0.32; showLine = true; }
    else { peekScale = 0.62; peekOpacity = 0.42; showLine = false; }
    const baseX = W / 2 - (fi * C + C / 2) + (dragDX || 0);

    const track = e('div', {
      style: {
        display: 'flex', width: (C * cells.length) + 'px',
        transform: `translateX(${baseX}px)`,
        transition: dragging ? 'none' : 'transform .42s cubic-bezier(.2,.7,.2,1)',
      }
    }, cells.map((c, i) => {
      const focused = i === fi;
      const hexEl = this.renderHexagram(
        c.hex.lines.map((v, k) => ({ v, changing: c.role === 'present' && this.changing && this.changing[k] })),
        { style: hstyle, w: 104, faded: !focused, showChanging: c.role === 'present' }
      );
      return e('div', {
        key: i,
        onClick: focused ? undefined : (() => { if (this._moved) { this._moved = false; return; } this.setFocus(i); }),
        style: {
          width: C + 'px', flex: 'none', display: 'flex', flexDirection: 'column', alignItems: 'center', textAlign: 'center',
          transform: `scale(${focused ? 1 : peekScale})`,
          opacity: focused ? 1 : peekOpacity,
          transition: 'transform .42s cubic-bezier(.2,.7,.2,1), opacity .42s ease',
          cursor: focused ? 'default' : 'pointer',
        }
      },
        e('div', { style: { fontSize: '10px', letterSpacing: '0.18em', color: focused ? '#2f3a6e' : '#706b63', marginBottom: '14px', whiteSpace: 'nowrap' } }, c.label),
        e('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'center', minHeight: '150px' } }, hexEl),
        e('div', { style: { fontFamily: "'Shippori Mincho', serif", fontSize: '20px', color: focused ? '#2b2823' : '#706b63', marginTop: '16px', letterSpacing: '0.05em' } }, c.hex.name),
        e('div', { style: { fontSize: '10.5px', color: focused ? '#706b63' : '#706b63', marginTop: '5px', letterSpacing: '0.12em' } }, this.hexContent(c.hex.num).reading || ''),
        e('div', { style: { fontSize: '11px', color: '#706b63', marginTop: '3px', letterSpacing: '0.08em' } }, '第' + c.hex.num + '卦')
      );
    }));

    const stage = e('div', {
      ref: this.stageRef,
      tabIndex: 0, role: 'group', 'aria-roledescription': 'カルーセル', 'aria-label': cells.map((c) => c.label).join('・') + '（左右キーで切替）',
      onKeyDown: this.onStageKey,
      onPointerDown: this.onDragStart, onPointerMove: this.onDragMove, onPointerUp: this.onDragEnd, onPointerLeave: this.onDragEnd, onPointerCancel: this.onDragEnd,
      style: { position: 'relative', width: '100%', overflow: 'hidden', touchAction: 'pan-y pinch-zoom', cursor: dragging ? 'grabbing' : 'grab', userSelect: 'none', outlineOffset: '4px' }
    },
      showLine ? e('div', { style: { position: 'absolute', left: 0, right: 0, top: '96px', height: '1px', background: '#ece9e3', pointerEvents: 'none' } }) : null,
      track
    );

    const dots = e('div', { role: 'tablist', 'aria-label': '見立てを切り替える', style: { display: 'flex', alignItems: 'stretch', justifyContent: 'center', gap: '6px', marginTop: '22px', padding: '4px', background: '#f4f2ec', borderRadius: '14px' } },
      cells.map((c, i) => e('button', {
        key: i, onClick: () => this.setFocus(i),
        role: 'tab', 'aria-label': c.label + 'へ', 'aria-selected': i === fi ? 'true' : 'false',
        style: { minWidth: '72px', minHeight: '40px', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', border: 'none', borderRadius: '10px', background: i === fi ? '#ffffff' : 'transparent', padding: '8px 12px', boxShadow: i === fi ? '0 1px 5px rgba(50,44,36,.08)' : 'none' }
      },
        e('div', { style: { fontSize: '11px', letterSpacing: '0.1em', color: i === fi ? accent : '#706b63' } }, c.cap)
      ))
    );

    const hint = e('div', { style: { textAlign: 'center', marginTop: '13px', fontSize: '11px', letterSpacing: '0.1em', color: '#706b63' } }, 'タブ、または左右スワイプで見比べられます');

    const SR = { position: 'absolute', width: '1px', height: '1px', padding: 0, margin: '-1px', overflow: 'hidden', clip: 'rect(0 0 0 0)', whiteSpace: 'nowrap', border: 0 };
    const live = e('div', { 'aria-live': 'polite', style: SR }, cells[fi] ? (cells[fi].label + '、' + cells[fi].hex.name + '、第' + cells[fi].hex.num + '卦') : '');

    return e('div', null, stage, dots, hint, live);
  }

  hexContent(num) { return (typeof HEX !== 'undefined' && HEX[num]) ? HEX[num] : {}; }

  // 爻の呼び名を、位置(下=0…上=5)と陰陽(1=陽→九／0=陰→六)から組み立てる。
  // 初・上は接頭、中四爻は陰陽を先に置く（初九 / 九二 / 上六 …）。
  yaoName(i, val) {
    const yy = (val === 1) ? '九' : '六';
    if (i === 0) return '初' + yy;
    if (i === 5) return '上' + yy;
    return yy + ['二','三','四','五'][i - 1];
  }

  // 結果画面：動いた爻（変爻）の爻辞だけを出す。爻辞データを持たない卦では何も描かない
  // （64卦すべて整備済みだが、未整備でも安全）。全6爻が動くときは考変占に従い、用九/用六
  // （乾・坤）のみ出し、それ以外は之卦で読むため何も出さない（カルーセルが之卦を見せている）。
  renderYaoSection(present) {
    if (!present) return null;
    const h = this.hexContent(present.num);
    const data = h.lines;
    if (!data) return null;                       // 爻辞データ未整備の卦 → 非表示
    const accent = CONFIG.ACCENT;
    const changing = this.changing || [];
    const allMove = changing.length === 6 && changing.every(Boolean);

    const row = (name, yao) => e('div', { key: name, style: { marginBottom: '20px' } },
      e('div', { style: { display: 'flex', alignItems: 'baseline', gap: '10px', marginBottom: '8px' } },
        e('span', { style: { fontFamily: "'Shippori Mincho', serif", fontSize: '12.5px', color: '#ffffff', background: accent, borderRadius: '999px', padding: '4px 13px', letterSpacing: '0.06em', flex: 'none', alignSelf: 'center' } }, name),
        e('span', { style: { fontFamily: "'Shippori Mincho', serif", fontSize: '15px', color: '#2b2823', letterSpacing: '0.03em', lineHeight: 1.7 } }, yao.text)
      ),
      yao.meaning ? e('p', { style: { fontSize: '13.5px', lineHeight: 1.95, color: '#4a4640', margin: '0 0 6px', textWrap: 'pretty' } }, yao.meaning) : null,
      yao.advice ? e('p', { style: { fontSize: '13px', lineHeight: 1.9, color: '#706b63', margin: 0, textWrap: 'pretty' } }, yao.advice) : null
    );

    const rows = [];
    if (allMove) {
      // 全爻動：乾坤は用九/用六を出す。それ以外は個々の爻辞でなく之卦で読むため行を出さない。
      if (h.yong) rows.push(row(h.yong.name || (present.lines.every((v) => v === 1) ? '用九' : '用六'), h.yong));
    } else {
      for (let i = 0; i < 6; i++) {
        if (changing[i] && data[i]) rows.push(row(this.yaoName(i, present.lines[i]), data[i]));
      }
    }
    if (!rows.length) return null;                // 変爻なし／全爻動(非乾坤) → 爻辞は読まない（之卦で見る）

    return e('div', { style: { marginTop: '30px', borderTop: '1px solid #f1efe9', paddingTop: '26px' } },
      e('h3', { style: { fontFamily: "'Shippori Mincho', serif", fontWeight: 500, fontSize: '19px', color: '#2b2823', margin: '0 0 6px', letterSpacing: '0.03em' } }, '動いた爻'),
      e('p', { style: { fontSize: '12px', lineHeight: 1.85, color: '#706b63', margin: '0 0 20px' } }, '変化している線に添えられた言葉です。いまの段階を、より細かく映します。'),
      rows
    );
  }

  // Annotate classical text: glossary terms get furigana (ruby) + are tappable for a definition.
  annotateClassical(text) {
    if (!text) return [];
    if (typeof GLOSSARY === 'undefined') return [text];
    const accent = CONFIG.ACCENT;
    const nodes = []; let buf = ''; let i = 0; let k = 0;
    const flush = () => { if (buf) { nodes.push(buf); buf = ''; } };
    while (i < text.length) {
      let term = null;
      for (let j = 0; j < GLOSSARY_KEYS.length; j++) { if (text.startsWith(GLOSSARY_KEYS[j], i)) { term = GLOSSARY_KEYS[j]; break; } }
      if (term) {
        flush();
        const g = GLOSSARY[term];
        const open = (ev) => { ev.stopPropagation(); this.setState({ glossTerm: term }); };
        nodes.push(e('ruby', {
          key: 'g' + (k++), onClick: open, role: 'button', tabIndex: 0,
          'aria-label': term + '（' + g.yomi + '）の意味',
          onKeyDown: (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); open(ev); } },
          style: { cursor: 'pointer', borderBottom: '1px dotted ' + this.hexToRgba(accent, 0.55) },
        }, term, e('rt', { style: { fontSize: '0.5em', color: '#676d82', fontWeight: 400, letterSpacing: 0 } }, g.yomi)));
        i += term.length;
      } else { buf += text[i]; i++; }
    }
    flush();
    return nodes;
  }

  // Local synthesis, kept only as an offline fallback. The live AI reading is now
  // produced by requestAI() (POST CONFIG.AI_ENDPOINT) and rendered as honka/shika/
  // advice; this method is no longer wired into renderVals.
  aiStub(ctx) {
    const hex = ctx.present, f = ctx.future, cc = ctx.changingCount;
    const lo = hex.lower, up = hex.upper;
    const h = this.hexContent(hex.num);
    const q = (ctx.question && ctx.question.trim()) ? `「${ctx.question.trim()}」という問いを` : 'あなたの問いを';
    const core = h.summary || `${lo.gloss}を土台に、${up.gloss}が上に立つ形`;
    const move = h.advice || `${up.gloss}の方へ半歩だけ重心を移してみること`;
    if (cc > 0) {
      return `${q}『${hex.name}』として見ると、${core} いま動いている線は、${f.name}という次の景色を準備しています。${move} 急いで結論を出すより、その一歩が、見えるものを変えていきます。変化は外から来るのではなく、すでにあなたの内側で始まっています。`;
    }
    return `${q}『${hex.name}』として見ると、${core} 動く線がないのは、いまが「整えるとき」だという合図です。${move} 新しい一手より、足元をていねいに保つこと。その落ち着きが、次の問いへ進む土台になります。`;
  }

  // One labelled section of the AI reading (本卦 / 之卦 / 捉え方).
  renderAiPart(label, title, bodyText) {
    if (!bodyText) return null;
    return e('div', { key: 'aip-' + label, style: { marginBottom: '16px' } },
      e('div', { style: { fontSize: '11px', letterSpacing: '0.18em', color: '#2f3a6e', marginBottom: '7px' } }, label + (title ? '　' + title : '')),
      e('p', { style: { fontSize: '14px', lineHeight: 2.0, color: '#3c4356', margin: 0, textWrap: 'pretty' } }, bodyText)
    );
  }

  buildInterpFor(hex, role, ctx) {
    const p = ctx.present, f = ctx.future, cc = ctx.changingCount;
    const lo = hex.lower, up = hex.upper;
    const h = this.hexContent(hex.num);
    const judg = h.judgment ? `——「${h.judgment}」` : '';
    const meaning = h.summary || `下に${lo.e}（${lo.gloss}）、上に${up.e}（${up.gloss}）が重なる形です。`;
    const guide = h.advice || `${lo.verb}、その上で${up.verb}——そんな構えが、この問いには合っているのかもしれません。`;
    if (role === 'present') {
      const para1 = judg
        ? `いま現れているのは『${hex.name}』${judg}${meaning}`
        : `いま現れているのは『${hex.name}』。${meaning}`;
      const para2 = guide;
      let transitionText, closing;
      if (cc > 0) {
        transitionText = `${cc}つの動く線が、状況を『${f.name}』へと連れていこうとしています。${hex.name}から${f.name}へ。${f.upper.e}が示すのは、${f.upper.gloss}に向かう流れです。いまの形に、すでに次の兆しがふくまれています。`;
        closing = '易経は「当てるもの」ではなく、見方をひとつ増やすための鏡です。どう動くかを決めるのは、あなた自身。';
      } else {
        transitionText = `動く線はありません。いまは形を変えず、『${hex.name}』のままに置いておくとき。焦って次へ進めるより、この状態を静かに保つことに意味があります。`;
        closing = '易経は「当てるもの」ではなく、見方をひとつ増やすための鏡です。今日はこの一卦を、そっと胸に置いておいてください。';
      }
      return { para1, para2, transitionText, closing };
    }
    if (role === 'past') {
      return {
        para1: `前回、あなたに現れていたのは『${hex.name}』。${meaning}`,
        para2: `${lo.verb}、${up.verb}——そんな時期を、あなたは通ってきました。`,
        transitionText: `過去は変えられませんが、読み直すことはできます。『${hex.name}』のころに見えていたものが、いまの『${p.name}』の背景になっています。`,
        closing: '前回の卦は、いまを映す鏡のひとつ。重ねて見ると、流れがほのかに見えてきます。',
      };
    }
    return {
      para1: `次に進もうとしているのは『${hex.name}』。${meaning}`,
      para2: `${lo.verb}、その上で${up.verb}——そんな景色へ、いまの問いはひらかれようとしています。`,
      transitionText: cc > 0
        ? `『${p.name}』の動く線が、この『${hex.name}』を呼んでいます。まだ確定した未来ではなく、いまの構えがつくる「ありうる次」です。`
        : `いまは動く線がないため、当面は『${p.name}』のまま。もし次へ進むとすれば、『${hex.name}』のような形が考えられます。`,
      closing: `未来は決まっていません。『${hex.name}』は、向かいうる方向のひとつ。選ぶのは、あなたです。`,
    };
  }

  renderVals() {
    const s = this.state;
    const accent = this.accent();
    const hstyle = CONFIG.HEX_STYLE;
    const coinStyle = CONFIG.COIN_STYLE;

    // stones
    const dur = coinStyle === 'lift' ? 1100 : (coinStyle === 'ripple' ? 760 : 900);
    const ease = coinStyle === 'lift' ? 'cubic-bezier(.34,1.42,.5,1)' : (coinStyle === 'ripple' ? 'cubic-bezier(.2,.8,.2,1)' : 'cubic-bezier(.2,.72,.2,1)');
    // two-faced go-stones: 表 = white stone (陽), 裏 = black stone (陰)
    const coinFace = (front) => {
      const face = front ? {
        background: 'radial-gradient(circle at 36% 30%, #ffffff 0%, #f4f1ea 48%, #dcd6c9 100%)',
        border: '1px solid rgba(150,140,125,.30)',
        boxShadow: 'inset 0 2px 5px rgba(255,255,255,.95), inset 0 -8px 15px rgba(120,108,92,.22), 0 11px 22px rgba(60,50,40,.20)',
        transform: 'none',
      } : {
        background: 'radial-gradient(circle at 36% 30%, #5b554d 0%, #2c2823 52%, #121110 100%)',
        border: '1px solid rgba(10,8,6,.5)',
        boxShadow: 'inset 0 2px 6px rgba(255,255,255,.22), inset 0 -8px 15px rgba(0,0,0,.55), 0 11px 22px rgba(20,16,12,.32)',
        transform: 'rotateX(180deg)',
      };
      return e('div', {
        style: Object.assign({
          position: 'absolute', inset: 0, borderRadius: '50%',
          backfaceVisibility: 'hidden', WebkitBackfaceVisibility: 'hidden',
        }, face)
      },
        // polished-stone specular highlight
        e('div', { style: {
          position: 'absolute', top: '12%', left: '18%', width: '46%', height: '32%', borderRadius: '50%',
          background: 'radial-gradient(closest-side, rgba(255,255,255,' + (front ? '0.9' : '0.55') + '), rgba(255,255,255,0))',
          pointerEvents: 'none',
        } })
      );
    };
    const coins = [0, 1, 2].map((i) => e('div', {
      key: i, className: 'kz-coin',
      style: {
        position: 'relative', width: '72px', height: '72px', flex: 'none',
        transformStyle: 'preserve-3d', WebkitTransformStyle: 'preserve-3d',
        transition: `transform ${dur}ms ${ease} ${i * 70}ms`,
        transform: `rotateX(${s.rot[i]}deg) rotateZ(${s.rotZ[i]}deg)`,
      }
    }, coinFace(true), coinFace(false)));
    const lt = s.lastThrow;
    const throwReadout = (s.screen === 'cast' && lt && !s.tossing)
      ? e('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '9px' } },
          lt.faces.map((f, i) => e('span', { key: i, style: { fontFamily: "'Shippori Mincho', serif", fontSize: '13px', letterSpacing: '0.06em', color: f ? '#2f3a6e' : '#706b63' } }, f ? '表' : '裏')),
          e('span', { style: { color: '#d8d3c8', fontSize: '12px' } }, '→'),
          e('span', { style: { fontFamily: "'Shippori Mincho', serif", fontSize: '15px', color: '#2b2823', letterSpacing: '0.04em' } }, (lt.value === 1 ? '陽' : '陰') + (lt.changing ? ' · 動爻' : ''))
        )
      : null;
    const ripple = (coinStyle === 'ripple' && s.tossing)
      ? e('div', { key: s.tossSeq, style: { position: 'absolute', left: '50%', top: '50%', width: '160px', height: '160px', borderRadius: '50%', border: `1.5px solid ${this.hexToRgba(accent, 0.6)}`, pointerEvents: 'none', animation: 'kz-ripple .9s ease-out both' } })
      : null;

    // building hexagram (cast screen): 6 slots, fill from bottom
    const buildLines = [];
    for (let i = 0; i < 6; i++) {
      buildLines.push(i < s.casts.length ? { v: s.casts[i].value, changing: false } : null);
    }
    const buildingHex = this.renderHexagram(buildLines, { style: hstyle, w: 116, faded: false, showChanging: false, animate: true });

    const out = {
      isAsk: s.screen === 'ask',
      isCast: s.screen === 'cast',
      isResult: s.screen === 'result',
      isAbout: s.screen === 'about',
      isHistory: s.screen === 'history',
      isReference: s.screen === 'reference',
      isDetail: s.screen === 'detail',
      detailNum: s.detailNum,
      menuOpen: s.menuOpen,
      toast: s.toast,
      viewing: s.viewing,
      notAsk: s.screen !== 'ask',
      question: s.question,
      hasQuestion: s.screen === 'result' && s.question.trim().length > 0,
      coins,
      ripple,
      waterFlash: s.waterFlash,
      buildingHex,
      throwReadout,
      counter: s.casts.length >= 6 ? '六本そろいました' : `あと ${6 - s.casts.length} 回`,
      castDone: s.casts.length >= 6,
      showTapHint: s.screen === 'cast' && !s.everTossed,
      autoCasting: s.autoCasting,
      // result defaults
      resultTriple: null,
      kicker: '今回の見立て',
      para1: '', para2: '', transitionText: '', closing: '',
      isPresentFocus: false, showFocusNote: false,
      aiResult: null, aiLoading: false, aiSlow: false, aiError: '', aiRevealed: false, aiButton: false, aiChip: '', aiButtonLabel: '',
      present: null,
    };

    if (s.screen === 'result' && s.casts.length === 6) {
      const present = this.hexFromLines(s.casts.map(c => c.value));
      const futureLines = s.casts.map(c => c.changing ? (1 - c.value) : c.value);
      const future = this.hexFromLines(futureLines);
      const past = (s.pastLines && s.pastLines.length === 6) ? this.hexFromLines(s.pastLines) : present;
      this.changing = s.casts.map(c => c.changing);
      const changingCount = this.changing.filter(Boolean).length;
      const ctx = { present, future, past, changingCount, question: s.question };
      const cells = [];
      if (s.pastLines && s.pastLines.length === 6) cells.push({ role: 'past', label: '前回の占い', kicker: '前回の見立て', cap: '前回', hex: past, interp: this.buildInterpFor(past, 'past', ctx) });
      cells.push(
        { role: 'present', label: '今回の卦', kicker: '今回の見立て', cap: '今回', hex: present, interp: this.buildInterpFor(present, 'present', ctx) },
        { role: 'future', label: '変化した先', kicker: '変化の見立て', cap: '変化後', hex: future, interp: this.buildInterpFor(future, 'future', ctx) },
      );
      this._carouselCount = cells.length;
      const fi = Math.max(0, Math.min(cells.length - 1, s.focusIndex));
      out.resultTriple = this.buildCarousel(cells, fi, s.dragDX, s.dragging);
      const cur = cells[fi];
      out.kicker = cur.kicker;
      out.para1 = cur.interp.para1;
      out.para2 = cur.interp.para2;
      out.transitionText = cur.interp.transitionText;
      out.closing = cur.interp.closing;
      out.isPresentFocus = cur.role === 'present';
      out.showFocusNote = cur.role !== 'present';
      // AI解釈リクエストの payload を退避（requestAI が使う）。本卦/之卦は卦名＋八卦の漢字。
      this._aiPayload = {
        question: (s.question || '').slice(0, 200),
        hexagram: { name: present.name, lower: present.lower.k, upper: present.upper.k },
        changing_lines: this.changing.map((c, i) => c ? i + 1 : 0).filter(Boolean),
        future_hexagram: changingCount > 0 ? { name: future.name, lower: future.lower.k, upper: future.upper.k } : null,
      };
      out.aiResult = s.aiResult;
      out.aiLoading = s.aiLoading;
      out.aiSlow = s.aiSlow;
      out.aiError = s.aiError;
      out.aiRevealed = s.aiRevealed;
      out.aiButton = !s.aiRevealed && !s.aiLoading;
      out.aiChip = s.aiRevealed ? '今日のぶん · 完了' : '本日あと1回';
      out.aiButtonLabel = s.aiError ? 'もう一度、AI に読み解いてもらう' : 'この見立てを、AI に読み解いてもらう';
      out.present = present;
    }

    return out;
  }

  // ---- screens (was the <x-dc> template) ----
  renderAsk(out) {
    return e('div', { key: 'ask', style: { padding: '38px 30px 44px', animation: 'kz-fade-up .6s ease both' } },
      e('div', { style: { fontSize: '11px', letterSpacing: '0.3em', color: '#2f3a6e', textTransform: 'uppercase', marginBottom: '22px' } }, '問いを立てる'),
      e('h1', { style: { fontFamily: "'Shippori Mincho', serif", fontWeight: 500, fontSize: '29px', lineHeight: 1.62, color: '#2b2823', margin: '0 0 18px', letterSpacing: '0.01em' } }, 'ひとつの問いを、', e('br'), '心に想ってください。'),
      e('p', { style: { fontSize: '14.5px', lineHeight: 1.95, color: '#6f6a62', margin: '0 0 34px', textWrap: 'pretty' } }, '答えを急がなくていい。いま、気にかかっていることを、ただ一つだけ。形にならなくても、胸のうちにあれば十分です。'),
      e('label', { htmlFor: 'kz-question', style: { display: 'block', fontSize: '12px', letterSpacing: '0.12em', color: '#706b63', marginBottom: '10px' } }, '書きとめておく（任意）'),
      e('textarea', {
        id: 'kz-question',
        className: 'kz-ta',
        value: out.question, onChange: this.setQuestion,
        maxLength: 200,
        placeholder: 'たとえば「この仕事を続けるべきか迷っている」',
        style: { width: '100%', minHeight: '116px', border: '1px solid #ece9e3', borderRadius: '18px', padding: '16px 17px', fontFamily: "'Zen Kaku Gothic New', sans-serif", fontSize: '14.5px', lineHeight: 1.8, color: '#2b2823', background: '#fcfbf9', resize: 'none', outline: 'none' }
      }),
      e('div', { style: { display: 'flex', justifyContent: 'space-between', gap: '12px', margin: '9px 2px 0' } },
        e('p', { style: { fontSize: '11.5px', lineHeight: 1.7, color: '#6f6a62', margin: 0 } }, '書かなくても占えます。入力した問いと履歴は、この端末に保存されます。'),
        e('span', { 'aria-label': '入力文字数', style: { flex: 'none', fontSize: '11px', color: '#706b63' } }, out.question.length + '/200')
      ),
      e('button', { onClick: this.startCast, className: 'kz-cta', style: { width: '100%', marginTop: '26px', padding: '17px', border: 'none', borderRadius: '18px', background: '#2f3a6e', color: '#ffffff', fontFamily: "'Zen Kaku Gothic New', sans-serif", fontSize: '15.5px', fontWeight: 500, letterSpacing: '0.12em', cursor: 'pointer' } }, '卦を立てる'),
      e('div', { style: { marginTop: '30px', paddingTop: '22px', borderTop: '1px solid #f1efe9', display: 'flex', gap: '12px' } },
        e('span', { style: { fontFamily: "'Shippori Mincho', serif", color: '#706b63', fontSize: '16px', flex: 'none', lineHeight: 1.4 } }, '作法'),
        e('p', { style: { fontSize: '12.5px', lineHeight: 1.9, color: '#706b63', margin: 0 } }, '易経では、同じ問いを何度もは占いません。一度、静かに向き合うための作法です。')
      ),
      e('div', { style: { marginTop: '20px', display: 'flex', justifyContent: 'center', gap: '22px' } },
        e('button', { onClick: () => this.go('about'), style: { border: 'none', background: 'none', color: '#676d82', fontSize: '12.5px', letterSpacing: '0.12em', cursor: 'pointer', padding: '4px' } }, 'はじめに'),
        e('button', { onClick: () => this.go('reference'), style: { border: 'none', background: 'none', color: '#676d82', fontSize: '12.5px', letterSpacing: '0.12em', cursor: 'pointer', padding: '4px' } }, '64卦をみる')
      )
    );
  }

  renderCast(out) {
    return e('div', { key: 'cast', style: { padding: '30px 30px 40px', animation: 'kz-fade-up .6s ease both', display: 'flex', flexDirection: 'column', alignItems: 'center' } },
      e('div', { style: { width: '100%', display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginBottom: '4px' } },
        e('div', { style: { fontSize: '11px', letterSpacing: '0.3em', color: '#2f3a6e', textTransform: 'uppercase' } }, '卦を立てる'),
        e('div', { role: 'status', 'aria-live': 'polite', style: { fontFamily: "'Shippori Mincho', serif", fontSize: '14px', color: '#706b63', letterSpacing: '0.1em' } }, out.counter)
      ),
      e('h2', { style: { fontFamily: "'Shippori Mincho', serif", fontWeight: 500, fontSize: '22px', lineHeight: 1.6, color: '#2b2823', margin: '14px 0 8px', textAlign: 'center' } }, '三つの石を、六度。'),
      e('p', { style: { fontSize: '13.5px', lineHeight: 1.9, color: '#6f6a62', margin: '0 0 26px', textAlign: 'center', maxWidth: '290px' } }, '問いを想いながら、石にふれてください。タップで一度、長押しで続けて投げます。'),
      e('div', { style: { minHeight: '188px', display: 'flex', alignItems: 'flex-end', justifyContent: 'center', marginBottom: '30px' } }, out.buildingHex),
      e('button', { type: 'button', 'aria-label': '石を投げる（押している間つづけて立てます）',
        ref: (n) => { this._coinBtnRef = n; },
        onPointerDown: this.onCoinDown, onPointerUp: this.releaseCoin, onPointerCancel: this.releaseCoin, onLostPointerCapture: this.releaseCoin, onKeyDown: this.onCoinKey,
        style: { position: 'relative', display: 'flex', gap: '18px', alignItems: 'center', justifyContent: 'center', padding: '18px 8px', cursor: 'pointer', perspective: '700px', touchAction: 'none', border: 'none', background: 'none', font: 'inherit', outlineOffset: '6px', WebkitUserSelect: 'none', userSelect: 'none', WebkitTouchCallout: 'none' } },
        out.coins,
        out.ripple,
        out.waterFlash ? e('div', {
          key: 'yf-' + out.waterFlash.seq,
          'aria-hidden': 'true',
          style: {
            position: 'absolute', left: '50%', top: '46%', pointerEvents: 'none',
            width: out.waterFlash.value === 1 ? '120px' : '120px',
            height: out.waterFlash.value === 1 ? '3px' : '3px',
            borderRadius: '3px',
            background: out.waterFlash.value === 1
              ? 'linear-gradient(90deg, rgba(47,58,110,0) 0%, rgba(47,58,110,.9) 50%, rgba(47,58,110,0) 100%)'
              : 'linear-gradient(90deg, rgba(47,58,110,0) 0%, rgba(47,58,110,.9) 35%, rgba(47,58,110,0) 50%, rgba(47,58,110,.9) 65%, rgba(47,58,110,0) 100%)',
            animation: 'kz-yao-rise 1s cubic-bezier(.2,.7,.2,1) both',
          }
        }) : null
      ),
      e('div', { style: { height: '26px', marginTop: '8px', display: 'flex', alignItems: 'center', justifyContent: 'center' } }, out.throwReadout),
      e('div', { style: { height: '22px', marginTop: '2px' } },
        out.autoCasting ? e('p', { style: { fontSize: '12px', color: '#676d82', letterSpacing: '0.14em', margin: 0 } }, '投げています…')
          : out.showTapHint ? e('p', { style: { fontSize: '12px', color: '#706b63', letterSpacing: '0.1em', margin: 0, animation: 'kz-fade .8s ease both' } }, 'タップで1回 ／ 長押しで続けて投げる') : null
      ),
      e('div', { style: { height: '64px', marginTop: '16px', display: 'flex', alignItems: 'center' } },
        out.castDone ? e('button', { onClick: this.goResult, style: { padding: '15px 44px', border: 'none', borderRadius: '16px', background: '#2f3a6e', color: '#ffffff', fontFamily: "'Zen Kaku Gothic New', sans-serif", fontSize: '15px', fontWeight: 500, letterSpacing: '0.14em', cursor: 'pointer', animation: 'kz-fade-up .7s ease both' } }, '結果を見る') : null
      )
    );
  }

  renderResult(out) {
    const para = (txt, i) => e('p', { key: i, style: { fontSize: '14.5px', lineHeight: 2.0, color: '#4a4640', margin: '0 0 16px', textWrap: 'pretty' } }, txt);
    return e('div', { key: 'result', style: { padding: '30px 26px 48px', animation: 'kz-fade-up .6s ease both' } },
      e('div', { style: { fontSize: '11px', letterSpacing: '0.3em', color: '#2f3a6e', textTransform: 'uppercase', marginBottom: '16px', textAlign: 'center' } }, out.kicker),
      out.hasQuestion ? e('p', { style: { fontFamily: "'Shippori Mincho', serif", fontSize: '15px', lineHeight: 1.85, color: '#706b63', margin: '0 0 28px', textAlign: 'center', padding: '0 8px' } }, '「' + out.question + '」') : null,
      e('div', { style: { marginBottom: '30px' } }, out.resultTriple),
      e('div', { style: { height: '1px', background: '#f1efe9', margin: '8px 2px 26px' } }),
      e('h3', { style: { fontFamily: "'Shippori Mincho', serif", fontWeight: 500, fontSize: '19px', color: '#2b2823', margin: '0 0 16px', letterSpacing: '0.03em' } }, '考え方・捉え方'),
      para(out.para1, 'p1'), para(out.para2, 'p2'), para(out.transitionText, 'pt'),
      e('p', { style: { fontSize: '13.5px', lineHeight: 1.95, color: '#706b63', margin: 0, textWrap: 'pretty' } }, out.closing),
      // 動いた爻の爻辞（本卦が中央のときのみ。爻辞データのある卦・変爻ありのときだけ中身が出る）
      out.isPresentFocus ? this.renderYaoSection(out.present) : null,
      // AI area (hidden when re-viewing a past reading from history)
      (out.isPresentFocus && !out.viewing) ? e('div', { style: { marginTop: '30px', border: '1px solid #e7e9f0', borderRadius: '20px', padding: '22px 20px', background: '#fafbfd' } },
        e('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '14px' } },
          e('div', { style: { display: 'flex', alignItems: 'center', gap: '9px' } },
            e('span', { style: { width: '7px', height: '7px', borderRadius: '50%', background: '#2f3a6e', display: 'inline-block' } }),
            e('span', { style: { fontFamily: "'Shippori Mincho', serif", fontSize: '15px', color: '#2b2823', letterSpacing: '0.04em' } }, 'AI による読み解き')
          ),
          e('span', { style: { fontSize: '10.5px', letterSpacing: '0.1em', color: '#676d82' } }, out.aiChip)
        ),

  onSheetKey = (ev) => {
    if (ev.key === 'Escape') { ev.preventDefault(); this.closeTopSheet(); return; }

    const items = Array.from(this._sheetNode.querySelectorAll('button:not([disabled]), input:not([disabled]), [href], [tabindex]:not([tabindex="-1"])'));
    if (!items.length) { ev.preventDefault(); return; }
    const first = items[0], last = items[items.length - 1];
    if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
    else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
  };

  // ---- reference: browsable 64 hexagrams ----
  renderReference(out) {
    const rawQuery = (this.state.refQuery || '').trim();
    const q = rawQuery.normalize('NFKC').toLowerCase();
    const items = [];
    for (let n = 1; n <= 64; n++) {
      const h = this.hexContent(n);
      if (q) {
        const hay = `${n} 第${n}卦 ${h.name || ''} ${h.reading || ''} ${(h.keywords || []).join(' ')}`.normalize('NFKC').toLowerCase();
        if (hay.indexOf(q) === -1) continue;
      }
      items.push(n);
    }
    const cell = (n) => {
      const h = this.hexContent(n);
      const hexEl = this.renderHexagram((LINES_FOR[n] || []).map((v) => ({ v })), { style: CONFIG.HEX_STYLE, w: 46 });
      return e('button', { key: n, onClick: () => this.go('detail', { detailNum: n }), style: { display: 'flex', flexDirection: 'column', alignItems: 'center', textAlign: 'center', border: '1px solid #efece6', borderRadius: '16px', background: '#fcfbf9', padding: '16px 8px 14px', cursor: 'pointer' } },

        e('div', { style: { fontFamily: "'Shippori Mincho', serif", fontSize: '14px', color: '#2b2823', marginTop: '12px', letterSpacing: '0.04em' } }, h.name),
        e('div', { style: { fontSize: '10px', color: '#706b63', marginTop: '4px', letterSpacing: '0.08em' } }, '第' + n + '卦')
      );
    };
    return e('div', { key: 'ref', style: { padding: '24px 22px 48px', animation: 'kz-fade-up .6s ease both' } },
      e('div', { style: { fontSize: '11px', letterSpacing: '0.3em', color: '#2f3a6e', textTransform: 'uppercase', marginBottom: '14px' } }, '64卦をみる'),
      e('h1', { style: { fontFamily: "'Shippori Mincho', serif", fontWeight: 500, fontSize: '25px', lineHeight: 1.5, color: '#2b2823', margin: '0 0 18px' } }, '六十四卦'),
      e('label', { htmlFor: 'kz-hex-search', style: { display: 'block', fontSize: '12px', letterSpacing: '0.08em', color: '#706b63', margin: '0 2px 8px' } }, '卦名・読み・キーワードで検索'),
      e('input', { id: 'kz-hex-search', type: 'search', className: 'kz-ta', value: this.state.refQuery, onChange: this.setRefQuery, placeholder: '例：乾、けん、前進', style: { width: '100%', border: '1px solid #d8d3c8', borderRadius: '14px', padding: '12px 15px', fontFamily: "'Zen Kaku Gothic New', sans-serif", fontSize: '14px', color: '#2b2823', background: '#fcfbf9', outline: 'none', marginBottom: '8px' } }),
      e('div', { role: 'status', 'aria-live': 'polite', style: { fontSize: '11.5px', color: '#706b63', textAlign: 'right', margin: '0 2px 14px' } }, items.length + '件'),
      items.length ? e('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' } }, items.map(cell))
                   : e('p', { style: { fontSize: '13.5px', color: '#706b63', textAlign: 'center', padding: '30px 0' } }, '「' + rawQuery + '」に該当する卦は見つかりませんでした。')
    );
  }

  // ---- detail: a single hexagram ----
  renderDetail(out) {
    const n = out.detailNum;
    const h = this.hexContent(n);
    const lines = LINES_FOR[n] || [0,0,0,0,0,0];
    const hx = this.hexFromLines(lines);
    const hexEl = this.renderHexagram(lines.map((v) => ({ v })), { style: CONFIG.HEX_STYLE, w: 104 });
    const chip = (t) => e('span', { key: t, style: { fontSize: '11.5px', color: '#5a6184', background: '#eef0f6', borderRadius: '999px', padding: '5px 12px', letterSpacing: '0.06em' } }, t);
    const tri = (label, t) => e('div', { style: { display: 'flex', alignItems: 'baseline', gap: '10px' } },
      e('span', { style: { fontSize: '10.5px', color: '#706b63', letterSpacing: '0.14em', width: '38px', flex: 'none' } }, label),
      e('span', { style: { fontFamily: "'Shippori Mincho', serif", fontSize: '15px', color: '#2b2823', flex: 'none' } }, t.k + '（' + t.reading + '）'),
      e('span', { style: { fontSize: '12px', color: '#706b63' } }, t.e + ' ・ ' + t.gloss)
    );
    return e('div', { key: 'detail-' + n, style: { padding: '24px 28px 48px', animation: 'kz-fade-up .6s ease both' } },
      e('div', { style: { fontSize: '11px', letterSpacing: '0.3em', color: '#2f3a6e', textTransform: 'uppercase', marginBottom: '8px', textAlign: 'center' } }, '第' + n + '卦'),
      e('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'center', minHeight: '150px' } }, hexEl),
      e('h1', { style: { fontFamily: "'Shippori Mincho', serif", fontWeight: 500, fontSize: '26px', color: '#2b2823', margin: '16px 0 4px', textAlign: 'center', letterSpacing: '0.05em' } }, h.name),
      h.reading ? e('div', { style: { fontSize: '12px', color: '#706b63', textAlign: 'center', letterSpacing: '0.14em', marginBottom: '16px' } }, h.reading) : null,
      e('div', { style: { display: 'flex', flexWrap: 'wrap', gap: '8px', justifyContent: 'center', marginBottom: '24px' } }, (h.keywords || []).map(chip)),
      h.judgment ? e('div', { style: { background: '#faf9f6', border: '1px solid #f1efe9', borderRadius: '16px', padding: '16px 18px', marginBottom: '20px' } },
        e('div', { style: { fontSize: '10.5px', letterSpacing: '0.18em', color: '#706b63', marginBottom: '12px' } }, '卦辞'),
        e('p', { style: { fontFamily: "'Shippori Mincho', serif", fontSize: '16px', lineHeight: 2.3, color: '#3a352e', margin: 0 } }, this.annotateClassical(h.judgment)),
        e('div', { style: { fontSize: '10.5px', color: '#706b63', marginTop: '12px', letterSpacing: '0.06em' } }, '点線の語をタップすると、読みと意味が出ます。')
      ) : null,
      h.summary ? e('p', { style: { fontSize: '14.5px', lineHeight: 2.0, color: '#4a4640', margin: '0 0 22px', textWrap: 'pretty' } }, h.summary) : null,
      e('div', { style: { display: 'flex', flexDirection: 'column', gap: '10px', padding: '16px 0', borderTop: '1px solid #f1efe9', borderBottom: '1px solid #f1efe9', marginBottom: '22px' } },
        tri('上卦', hx.upper),
        tri('下卦', hx.lower),
        h.image ? e('div', { style: { fontSize: '12.5px', lineHeight: 2.0, color: '#706b63', marginTop: '4px', letterSpacing: '0.04em' } }, '象 — ', this.annotateClassical(h.image)) : null
      ),
      h.advice ? e(React.Fragment, null,
        e('h3', { style: { fontFamily: "'Shippori Mincho', serif", fontWeight: 500, fontSize: '16px', color: '#2b2823', margin: '0 0 12px', letterSpacing: '0.03em' } }, '読み方・心がけ'),
        e('p', { style: { fontSize: '14.5px', lineHeight: 2.0, color: '#4a4640', margin: 0, textWrap: 'pretty' } }, h.advice)
      ) : null,
      // 六爻 — 爻辞（データのある卦のみ。下から上へ全6本＋必要なら用九／用六）
      h.lines ? e('div', { style: { marginTop: '30px', paddingTop: '22px', borderTop: '1px solid #f1efe9' } },
        e('h3', { style: { fontFamily: "'Shippori Mincho', serif", fontWeight: 500, fontSize: '16px', color: '#2b2823', margin: '0 0 4px', letterSpacing: '0.03em' } }, '六爻'),
        e('p', { style: { fontSize: '11.5px', lineHeight: 1.8, color: '#706b63', margin: '0 0 16px' } }, '下から上へ、状況の段階を表す六本の言葉。'),
        lines.map((v, i) => {
          const yao = h.lines[i]; if (!yao) return null;
          return e('div', { key: i, style: { padding: '12px 0', borderTop: i ? '1px solid #f4f2ec' : 'none' } },
            e('div', { style: { display: 'flex', alignItems: 'baseline', gap: '12px', marginBottom: '6px' } },
              e('span', { style: { fontFamily: "'Shippori Mincho', serif", fontSize: '13px', color: '#5a6184', flex: 'none', width: '40px' } }, this.yaoName(i, v)),
              e('span', { style: { fontFamily: "'Shippori Mincho', serif", fontSize: '14.5px', color: '#2b2823', lineHeight: 1.75, letterSpacing: '0.02em' } }, yao.text)
            ),
            yao.meaning ? e('p', { style: { fontSize: '13px', lineHeight: 1.9, color: '#6b665e', margin: '0 0 0 52px', textWrap: 'pretty' } }, yao.meaning) : null
          );
        }),
        h.yong ? e('div', { style: { padding: '12px 0', borderTop: '1px solid #f4f2ec' } },
          e('div', { style: { display: 'flex', alignItems: 'baseline', gap: '12px', marginBottom: '6px' } },
            e('span', { style: { fontFamily: "'Shippori Mincho', serif", fontSize: '13px', color: '#5a6184', flex: 'none', width: '40px' } }, h.yong.name || (lines.every((v) => v === 1) ? '用九' : '用六')),
            e('span', { style: { fontFamily: "'Shippori Mincho', serif", fontSize: '14.5px', color: '#2b2823', lineHeight: 1.75, letterSpacing: '0.02em' } }, h.yong.text)
          ),
          h.yong.meaning ? e('p', { style: { fontSize: '13px', lineHeight: 1.9, color: '#6b665e', margin: '0 0 0 52px', textWrap: 'pretty' } }, h.yong.meaning) : null
        ) : null
      ) : null,
      e('div', { style: { marginTop: '32px', paddingTop: '22px', borderTop: '1px solid #f1efe9', display: 'flex', gap: '12px', justifyContent: 'center' } },
        e('button', { onClick: () => this.go('reference'), className: 'kz-ghost', style: { padding: '13px 26px', border: '1px solid #e3e0d9', borderRadius: '16px', background: '#ffffff', color: '#6b665e', fontFamily: "'Zen Kaku Gothic New', sans-serif", fontSize: '13.5px', letterSpacing: '0.08em', cursor: 'pointer' } }, '一覧へ'),
        e('button', { onClick: this.again, className: 'kz-cta', style: { padding: '13px 26px', border: 'none', borderRadius: '16px', background: '#2f3a6e', color: '#ffffff', fontFamily: "'Zen Kaku Gothic New', sans-serif", fontSize: '13.5px', fontWeight: 500, letterSpacing: '0.08em', cursor: 'pointer' } }, '占う')
      )
    );
  }

  render() {
    const out = this.renderVals();
    const header = e('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: 'calc(22px + env(safe-area-inset-top)) 22px 14px', flex: 'none' } },
      e('div', { style: { width: '44px', display: 'flex', alignItems: 'center' } },
        out.notAsk ? e('button', { onClick: this.onBack, className: 'kz-icon-button', 'aria-label': 'もどる', style: { border: 'none', background: 'none', padding: 0, cursor: 'pointer', color: '#706b63', fontSize: '20px', lineHeight: 1 } }, '←') : null
      ),
      e('button', { type: 'button', onClick: this.goHome, 'aria-label': 'ホームへ', style: { display: 'flex', alignItems: 'baseline', gap: '8px', cursor: 'pointer', border: 'none', background: 'none', padding: '8px' } },
        e('span', { style: { fontFamily: "'Shippori Mincho', serif", fontSize: '21px', color: '#2b2823', letterSpacing: '0.08em' } }, '兆'),
        e('span', { style: { fontSize: '10px', letterSpacing: '0.32em', color: '#706b63', textTransform: 'uppercase' } }, 'kizashi')
      ),
      e('div', { style: { width: '44px', display: 'flex', justifyContent: 'flex-end' } },
        e('button', { onClick: this.toggleMenu, className: 'kz-icon-button', 'aria-label': 'メニュー', 'aria-expanded': out.menuOpen, style: { border: 'none', background: 'none', padding: 0, cursor: 'pointer', color: '#706b63', fontSize: '19px', lineHeight: 1 } }, '☰')
      )
    );

    let body = null;
    if (out.isAsk) body = this.renderAsk(out);
    else if (out.isCast) body = this.renderCast(out);
    else if (out.isResult) body = this.renderResult(out);
    else if (out.isAbout) body = this.renderAbout(out);
    else if (out.isHistory) body = this.renderHistory(out);
    else if (out.isReference) body = this.renderReference(out);
    else if (out.isDetail) body = this.renderDetail(out);

    const scroll = e('div', { className: 'kz-scroll', style: { paddingBottom: 'env(safe-area-inset-bottom)' } }, body);

    const toast = out.toast ? e('div', { role: 'status', 'aria-live': 'polite', style: { position: 'absolute', left: '50%', bottom: 'calc(28px + env(safe-area-inset-bottom))', transform: 'translateX(-50%)', zIndex: 80, background: 'rgba(43,40,35,0.94)', color: '#fff', fontSize: '13px', letterSpacing: '0.06em', padding: this.state.deletedReading ? '8px 10px 8px 18px' : '11px 20px', borderRadius: '999px', animation: 'kz-fade .25s ease both', whiteSpace: 'nowrap', display: 'flex', alignItems: 'center', gap: '8px' } },
      out.toast,
      this.state.deletedReading ? e('button', { onClick: this.undoDeleteReading, style: { border: '1px solid rgba(255,255,255,.42)', borderRadius: '999px', background: 'transparent', color: '#fff', padding: '7px 11px', cursor: 'pointer', fontSize: '12px' } }, '元に戻す') : null
    ) : null;

    return e('div', { className: 'kz-wrap' }, e('div', { className: 'kz-card' }, header, scroll,
      out.menuOpen ? this.renderMenu(out) : null,
      this.state.glossTerm ? this.renderGloss() : null,
      this.state.aiConsentOpen ? this.renderAIConsent() : null,
      this.state.shareOpen ? this.renderShareOptions() : null,
      this.state.confirmClearOpen ? this.renderClearConfirmation() : null,
      toast));
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App));
</script>
</body>
</html>
