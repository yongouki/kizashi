<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body { background: #e6e3dd; }
  @keyframes kz-fade-up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes kz-fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes kz-ripple { from { opacity: .5; transform: translate(-50%,-50%) scale(.4); } to { opacity: 0; transform: translate(-50%,-50%) scale(2.4); } }
  @keyframes kz-line-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  /* layout: mobile-first full-screen, desktop = phone mock frame */
  .kz-wrap { min-height: 100vh; min-height: 100dvh; width: 100%; display: flex; align-items: flex-start; justify-content: center; background: #ffffff; font-family: 'Zen Kaku Gothic New', sans-serif; }
  /* fixed viewport height so the scroll lives in .kz-scroll (app shell) — keeps the
     menu/toast overlays anchored to the viewport instead of a content-tall card */
  .kz-card { position: relative; width: 100%; height: 100vh; height: 100dvh; background: #ffffff; overflow: hidden; display: flex; flex-direction: column; }
  @media (min-width: 480px) {
    .kz-wrap { background: #e6e3dd; padding: 24px; align-items: center; }
    .kz-card { width: 408px; max-width: 408px; height: 858px; min-height: 0; max-height: calc(100dvh - 48px); border-radius: 46px; box-shadow: 0 30px 70px rgba(50,44,36,0.20), 0 4px 14px rgba(50,44,36,0.08); }
  }

  .kz-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
  .kz-scroll::-webkit-scrollbar { width: 0; height: 0; }

  /* focus / active states (were style-focus / style-active in DC) */
  .kz-ta { transition: border-color .2s ease, background .2s ease; }
  .kz-ta:focus { border-color: #2f3a6e; background: #ffffff; }
  .kz-cta:active { opacity: .88; }
  .kz-ghost:active { background: #faf9f7; }
  .kz-ai:active { background: #f3f4f8; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
    outline: 3px solid rgba(47, 58, 110, .38);
    outline-offset: 3px;
  }
  .kz-icon-button { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; }
  .kz-sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; }
    .kz-coin { transition: none !important; }
  }

  /* water surface: fixed full-viewport, behind the app UI */
  #kz-water { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; display: block; }
  /* when water is active, let the page background show the canvas rather than a flat fill */
  body.kz-water-on { background: #e6e3dd; }
  .kz-wrap { position: relative; z-index: 1; }
  /* fallback / reduced-motion: no canvas, unchanged flat look */
  body.kz-water-off #kz-water { display: none; }
  @keyframes kz-yao-rise {
    0%   { opacity: 0; transform: translate(-50%, 0) scaleX(.4); filter: blur(1px); }
    30%  { opacity: .95; transform: translate(-50%, -8px) scaleX(1); filter: blur(0); }
    100% { opacity: 0; transform: translate(-50%, -120px) scaleX(.9); filter: blur(.5px); }
  }

  /* --- translucent "washi on water" panels (only when the water layer is live) --- */
  body.kz-water-on .kz-card {
    background: rgba(255, 255, 255, 0.82);
    backdrop-filter: blur(9px) saturate(1.03);
    -webkit-backdrop-filter: blur(9px) saturate(1.03);
  }
  @media (min-width: 480px) {
    /* desktop: the phone frame floats on the pond; keep the outer margin transparent to the canvas */
    body.kz-water-on .kz-wrap { background: transparent; }
  }
  /* bottom sheets: keep them readable but let a hint of water through */
  body.kz-water-on [role="dialog"] {
    background: rgba(244, 242, 236, 0.92) !important;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  /* when backdrop-filter is unsupported, fall back to a more opaque tint so text stays legible */
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    body.kz-water-on .kz-card { background: rgba(255, 255, 255, 0.93); }
    body.kz-water-on [role="dialog"] { background: rgba(244, 242, 236, 0.97) !important; }
  }
</style>

          { text:'或いは之に鞶帯を錫う。朝を終うるまでに、三たび之を褫わる。', meaning:'争って得た栄誉も、一朝のうちに何度も剥ぎ取られる。勝っても続かない段階。', advice:'争って勝ち取った地位は長持ちしません。力ずくの勝利に固執しないことです。' },

  7:  { num:7,  name:'地水師', reading:'ちすいし',
        judgment:'師は貞し。丈人なれば吉にして咎なし。',
        summary:'軍隊を動かすとき。多くを率いるには、正しさと信頼ある指導者が要る。',
        keywords:['統率','規律','大義'],
        image:'地の中に水あるは師なり。',
        advice:'大義と規律を整え、信頼できる人に任せる。私心で動かせば乱れます。',
        lines:[
          { text:'師は律を以て出づ。否らざれば臧きも凶なり。', meaning:'軍は規律をもって動き出す。秩序を欠けば、結果が良くても凶という出発の段階。', advice:'何事も最初にルールと筋を。規律なく始めれば、うまくいっても危うさが残ります。' },
          { text:'師に在りて中す。吉にして咎无し。王三たび命を錫う。', meaning:'軍の中心にあって偏らず指揮する。信頼を得て重ねて任される、要となる段階。', advice:'中心にいるほど、偏らず公平に。誠実な働きが、さらなる信頼を呼びます。' },
          { text:'師、或いは尸を輿す。凶なり。', meaning:'統率が乱れ、屍を車に乗せて帰るような敗れ。力不足の者が前に出て破れる段階。', advice:'力量を超えた指揮や、烏合の前進は禍のもと。任せる人と進退を見直しましょう。' },

          { text:'田に禽有り。言を執るに利ろし。咎无し。長子は師を帥い、弟子は尸を輿す。貞なれども凶なり。', meaning:'害をなす相手には大義をもって当たる。任せるは経験ある者、未熟に委ねれば凶の段階。', advice:'動くなら大義を明らかに。そして任せる相手を誤らないこと。人選が成否を分けます。' },
          { text:'大君、命有り。国を開き家を承く。小人は用うる勿れ。', meaning:'戦いが収まり、功に応じて報いる論功行賞のとき。徳なき者を用いてはならない段階。', advice:'事を成した後の処遇こそ大事。功は正しく報い、器でない人を要職に就けないこと。' },
        ] },
  8:  { num:8,  name:'水地比', reading:'すいちひ',
        judgment:'比は吉なり。原筮して元永貞なれば咎なし。',
        summary:'親しみ、寄り添うとき。心から結ばれる相手を見極めれば吉。',
        keywords:['親和','結束','信頼'],
        image:'地の上に水あるは比なり。',
        advice:'誰と手を結ぶかを丁寧に選ぶ。遅れて加わる者には縁が薄い。早めに誠で結びましょう。',
        lines:[
          { text:'孚有りて之に比す。咎无し。孚有りて缶に盈つ。終には来たりて他の吉有り。', meaning:'誠をもって人と親しみ寄り添う。真心が器に満ちるように、思わぬ吉が訪れる始まりの段階。', advice:'損得でなく、まごころで結ばれること。飾らぬ誠実さが、やがて良縁を呼びます。' },
          { text:'之に比するに内よりす。貞しくして吉なり。', meaning:'内側から、心から進んで親しむ。へつらいでなく自分の芯から結ぶ、正しく吉の段階。', advice:'媚びてすり寄るのでなく、内から進んで信じること。自分を保った親しみが吉です。' },
          { text:'之に比するに人に匪ず。', meaning:'親しむべきでない相手と結んでしまう。人選を誤り、寄る辺を失いかねない段階。', advice:'誰と結ぶかを見極めること。合わない相手に深入りする前に、距離を整えましょう。' },
          { text:'外よりして之に比す。貞しくして吉なり。', meaning:'外に向かって、賢明な相手に進んで従い親しむ。正しく結べば吉となる段階。', advice:'良いと見込んだ相手には、素直に従い寄り添うこと。表立っての協力が実ります。' },
          { text:'比を顕かにす。王、三駆して前の禽を失う。邑人誡めず。吉なり。', meaning:'親しみを公明正大に示す。去る者は追わず来る者は強いない、寛やかな中心の段階。', advice:'人を縛りつけず、来る者を迎え去る者は追わないこと。おおらかさが人を集めます。' },
          { text:'之に比するに首无し。凶なり。', meaning:'親しみに肝心の始まり・芯がない。出遅れ、より所を欠いて結べない凶の段階。', advice:'寄る相手も芯もないまま流されないこと。手遅れになる前に、結びの軸を定めましょう。' },
        ] },
  9:  { num:9,  name:'風天小畜', reading:'ふうてんしょうちく',
        judgment:'小畜は亨る。密雲あれども雨ふらず、我が西郊よりす。',
        summary:'小さくとどめ、蓄えるとき。大きな力をいったん柔らかく押さえる段階。',
        keywords:['小さな蓄え','抑制','準備'],
        image:'風、天の上を行くは小畜なり。',
        advice:'今は一気に進めず、文徳を養い小さく積む。雨が降る前の蓄えのときです。',
        lines:[
          { text:'復りて道よりす。何の咎あらん。吉なり。', meaning:'行きすぎず、自分の本来の道に立ち返る。咎なく吉の、いちばん下の段階。', advice:'無理に進まず、自分の筋に戻ること。素直に引き返せば、それが吉になります。' },
          { text:'牽かれて復る。吉なり。', meaning:'仲間に促され、ともに本道へ戻る。独走せず連れ立って退く、吉の段階。', advice:'周りの声に引かれて戻るのも良いこと。意地を張らず歩調を合わせれば吉です。' },
          { text:'輿、輻を説く。夫妻反目す。', meaning:'車の輻が外れて進めない。身近な間でも食い違いが生じる、止められる段階。', advice:'強引に進めば足元から崩れます。身近な不和を放置せず、いったん立ち止まりましょう。' },
          { text:'孚有り。血去り惕れ出づ。咎无し。', meaning:'誠を尽くすことで、危うさも恐れも遠ざかる。和をもって難を解く、咎なき段階。', advice:'力でなく、まごころで向き合うこと。誠実さが、危険も不安も静かに退けます。' },
          { text:'孚有りて攣如たり。富を以て其の隣とす。', meaning:'誠でしっかり手を取り合い、富を分かち合う。信頼で人を引き寄せる、充実の段階。', advice:'得たものを独り占めせず、分かち合うこと。誠と分配が、強い結びをつくります。' },
          { text:'既に雨ふり既に処る。徳を尚びて載つ。婦は貞なれば厲うし。月、望に幾し。君子征けば凶なり。', meaning:'蓄えが満ちて雨が降り、ひとまず収まる。満月寸前、これ以上進めば凶という極まりの段階。', advice:'満ちたら、それ以上を求めないこと。いまは止まって保つとき。さらに進むのは禍のもとです。' },
        ] },
  10: { num:10, name:'天澤履', reading:'てんたくり',
        judgment:'履は虎の尾を履む。人を咥わず。亨る。',
        summary:'虎の尾を踏むような危うい道を、礼をもって歩むとき。慎めば噛まれない。',

        image:'上は天、下は澤なるは履なり。',
        advice:'危ない場面ほど礼節と慎みを。身の程をわきまえて踏めば、虎も噛みません。',
        lines:[
          { text:'素もて履み往く。咎无し。', meaning:'飾らず、ありのままの素朴さで進む。分を守って歩む、咎なき始まりの段階。', advice:'背伸びせず、ふだんのままで進むこと。素直な一歩は、危なげなく道になります。' },
          { text:'履むこと坦坦たり。幽人は貞にして吉なり。', meaning:'道は平らかで歩みやすい。人目を求めず静かに正しくある者が吉の段階。', advice:'焦らず、平らな心で淡々と。目立とうとせず内を保つことが、いまは吉です。' },
          { text:'眇にして能く視、跛にして能く履む。虎の尾を履む。人を咥う。凶なり。武人、大君と為る。', meaning:'わずかな力で大を望み、虎の尾を踏んで噛まれる。分不相応に逸る、危うい凶の段階。', advice:'力量を過信しないこと。身の丈を超えて押し通せば、思わぬ反撃を招きます。' },
          { text:'虎の尾を履む。愬愬たれば、終には吉なり。', meaning:'虎の尾を踏むほどの危地でも、おそれ慎めば最後は吉となる段階。', advice:'危ういと自覚し、用心を重ねること。びくびくするほどの慎重さが、身を守ります。' },
          { text:'夬として履む。貞なれども厲うし。', meaning:'決然と踏み切って進む。正しくとも独断は危うさを伴う、強さゆえの段階。', advice:'決断は良いが、独りよがりは禁物。正しさを過信せず、危うさも見ておきましょう。' },
          { text:'履むを視て祥を考う。其の旋ること元なれば、吉なり。', meaning:'これまでの歩みを振り返り、吉凶を見定める。一巡りが全うされていれば大吉の段階。', advice:'立ち止まって来し方を顧みること。歩んできた筋がよければ、最後は実りに変わります。' },
        ] },
  11: { num:11, name:'地天泰', reading:'ちてんたい',
        judgment:'泰は小往き大來る。吉にして亨る。',
        summary:'天地が交わり、よく通じる泰平のとき。陽が伸び、物事が和合する。',
        keywords:['安泰','調和','繁栄'],
        image:'天地交わるは泰なり。',
        advice:'流れが良いときこそ、驕らず備える。和を保ち、過信せず巡りを整えましょう。',
        lines:[
          { text:'茅を抜くに茹たり。其の彙と以にす。征けば吉なり。', meaning:'茅を引けば根がつながって抜けるように、仲間と連れ立って進む。動いて吉の始まりの段階。', advice:'独りでなく、志を同じくする者と動くとき。連れ立って踏み出せば吉になります。' },
          { text:'荒を包ね、馮河を用い、遐きを遺れず、朋亡う。中行に尚う。', meaning:'荒れた者をも包み、果敢に川を渉り、遠きも見捨てず、徒党に偏らない。中庸を尊ぶ要の段階。', advice:'度量を大きく、えこひいきなく。偏らず中道を行くことが、泰平を保ちます。' },
          { text:'平らかにして陂かざる无く、往きて復らざる无し。艱んじて貞なれば咎无し。其の孚を恤うる勿れ。食に福有り。', meaning:'平らなものはやがて傾き、行ったものは必ず還る。盛りに転機の影が差す、心しておく段階。', advice:'良い時こそ、これが続かないと知っておくこと。動じず正しさを保てば、咎はありません。' },
          { text:'翩翩たり。富まずして其の隣と以にす。戒めずして孚あり。', meaning:'ひらひらと下り、富をひけらかさず隣人と連なる。誠で自然に集まる、和らぐ段階。', advice:'地位や富で人を動かそうとしないこと。飾らぬ誠実さが、おのずと人を寄せます。' },
          { text:'帝乙、妹を帰がしむ。以て祉い、元いに吉なり。', meaning:'高貴な者がへりくだって縁を結ぶ。身分を誇らず和合する、大いに吉の段階。', advice:'立場が上でも、へりくだって歩み寄ること。謙虚な結びが、大きな幸いを招きます。' },
          { text:'城、隍に復る。師を用うる勿れ。邑より命を告ぐ。貞なれども吝なり。', meaning:'城壁が崩れて堀に還る、泰平が傾くとき。力で抗わず、身近を整えるしかない段階。', advice:'流れが変わるときは、無理に戦わないこと。手の届く範囲を静かに整え、退くのが賢明です。' },
        ] },
  12: { num:12, name:'天地否', reading:'てんちひ',

        advice:'通じない時は無理に押さない。身を退いて徳を守り、塞がりが解けるのを待ちましょう。',
        lines:[
          { text:'茅を抜くに茹たり。其の彙と以にす。貞しくして吉。亨る。', meaning:'仲間と連なって退く。塞がりの始まりに、同じ志の者と身を慎み正しくあれば吉の段階。', advice:'通じない時こそ、信頼できる仲間と身を引くこと。退いて正しさを守れば道は通じます。' },
          { text:'包承す。小人は吉、大人は否なり。亨る。', meaning:'上に取り入りへつらう小人は通るが、大人はその流れに乗らず塞がりを保つ段階。', advice:'周りが調子よく取り入る時でも、安易に同調しないこと。流されない方が筋が通ります。' },
          { text:'包羞す。', meaning:'不相応な企てを内に抱え、やがて恥を招く。分を超えて無理をする危うい段階。', advice:'身の丈に合わない策をめぐらせないこと。恥になる前に、欲を引っ込めましょう。' },
          { text:'命有れば咎无し。疇、祉に離く。', meaning:'塞がりが転じ始める。天の時を得て動けば咎なく、仲間とともに福を分かつ段階。', advice:'流れが変わる兆しを捉えるとき。独りでなく、仲間とともに動けば福が広がります。' },
          { text:'否を休む。大人は吉なり。其れ亡びなん其れ亡びなんと、苞桑に繋ぐ。', meaning:'塞がりを収めにかかる充実の段階。なお滅びぬかと用心し、根に繋ぎ留めて安んじる。', advice:'良い方へ向かう時こそ、最悪を忘れないこと。用心を根に結びつけておけば崩れません。' },
          { text:'否を傾く。先には否がり後には喜ぶ。', meaning:'塞がりがついに覆り、通じる方へ転じる。苦しみが終わり喜びに変わる極まりの段階。', advice:'行き詰まりは永遠ではありません。あと少し。傾いて開ける時が、もう来ています。' },
        ] },
  13: { num:13, name:'天火同人', reading:'てんかどうじん',
        judgment:'同人は野に于いてす。亨る。大川を渉るに利ろし。',

        image:'天と火と同じきは同人なり。',
        advice:'身内びいきを捨て、開かれた心で仲間を募る。私を去れば大きな事も成せます。',
        lines:[
          { text:'人に同じくするに門に于いてす。咎无し。', meaning:'門を出てすぐ、広く開かれた場で人と志を同じくする。私心なく公平な、始まりの段階。', advice:'仲間は身内に限らず、広く開いて求めること。公平に交われば、咎はありません。' },

          { text:'戎を莽に伏せ、其の高陵に升る。三歳まで興らず。', meaning:'疑心から兵を伏せ、高みに登って様子をうかがう。打って出られず長く膠着する段階。', advice:'疑いから身構えても、事は動きません。力で奪おうとせず、対立を長引かせないこと。' },
          { text:'其の墉に乗る。攻むるに克たず。吉なり。', meaning:'攻めようと城壁に乗るが、攻めきれず思いとどまる。引き返すことで吉に転じる段階。', advice:'攻めかけても、無理と悟ったら退くこと。意地を捨てて引き返せるなら、それが吉です。' },
          { text:'人に同じくするに、先には號咷して後に笑う。大師克ちて相い遇う。', meaning:'隔てられて泣き叫ぶが、ついに障害を破って結ばれ笑う。試練を越えて再会する段階。', advice:'今は隔たって苦しくとも、誠で結ばれた縁は必ず巡り合います。諦めず障害を越えること。' },
          { text:'人に同じくするに郊に于いてす。悔い无し。', meaning:'人里離れた郊外で結ぶ。広い交わりには至らないが、悔いのない静かな終わりの段階。', advice:'大きな結束には届かずとも、無理に求めないこと。静かな付き合いにも、悔いはありません。' },
        ] },
  14: { num:14, name:'火天大有', reading:'かてんたいゆう',
        judgment:'大有は、元いに亨る。',

        keywords:['豊かさ','所有','寛容'],
        image:'火、天上に在るは大有なり。',
        advice:'手にしているものを抱え込まず、惜しみなく分かち合う。寛さが繁栄を長持ちさせます。',
        lines:[
          { text:'害に交わること无し。咎に匪ず。艱めば則ち咎无し。', meaning:'豊かさの始まり。まだ害に触れていない。驕らず難を思えば咎のない、いちばん下の段階。', advice:'恵まれた出だしほど、油断を戒めること。苦労を忘れずにいれば、過ちは生じません。' },
          { text:'大車以て載す。往く攸有り。咎无し。', meaning:'大きな車に荷を満載するように、十分な力で物事を担える。進んで事を成せる段階。', advice:'受け止める力が十分にあるとき。任を引き受け、思いきって前へ進んで構いません。' },
          { text:'公、用て天子に亨す。小人は克わず。', meaning:'豊かさを公のために天子へ捧げる。器の大きい者は通じ、私する小人には及ばない段階。', advice:'得たものを独占せず、公のために差し出すこと。私利に走る心では、この豊かさは保てません。' },
          { text:'其の彭たること匪ず。咎无し。', meaning:'豊かさを誇示せず、出すぎを抑える。盛りの傍らで身を慎めば咎のない段階。', advice:'豊かなときほど、ひけらかさないこと。控えめに振る舞えば、妬みも災いも遠ざかります。' },
          { text:'厥の孚、交如たり。威如たれば吉なり。', meaning:'誠が上下に通い合う中心の段階。柔らかな誠に加え、適度な威厳を保てば吉となる。', advice:'真心で人と通い合うこと。ただ柔和なだけでなく、芯の威厳も保てば、慕われて吉です。' },
          { text:'天よりこれを祐く。吉にして利ろしからざる无し。', meaning:'天が助ける、大有の極み。誠と謙を保つ者に、天の助けが満ちる最良の段階。', advice:'誠実とへりくだりを尽くす者には、天の助けが添います。おごらず徳を全うしましょう。' },

  15: { num:15, name:'地山謙', reading:'ちざんけん',

        summary:'高い山が地の下にある、へりくだりのとき。謙虚な者は最後まで通る。',
        keywords:['謙虚','控えめ','徳'],
        image:'地の中に山あるは謙なり。',
        advice:'力や成果を誇らず、低く構える。へりくだりこそ、長く実りを得る道です。',
        lines:[
          { text:'謙謙たる君子。用て大川を渉る。吉なり。', meaning:'どこまでもへりくだる君子。謙虚さを携えれば、大きな困難も渡れる、始まりの段階。', advice:'へりくだりを身につければ、難所も越えられます。低く構えることが、いちばんの力です。' },
          { text:'謙を鳴らす。貞しくして吉。', meaning:'内なる謙虚さが自然と外に表れる。飾りでなく身についた謙が、正しく吉となる段階。', advice:'謙虚さは、にじみ出るもの。装わずとも内に保てば、おのずと信頼が集まります。' },
          { text:'労謙す。君子は終わり有り。吉なり。', meaning:'功があってもなお謙る。働き者でへりくだる君子は、よい終わりを全うする中心の段階。', advice:'手柄を立てても、誇らず低くあること。働きと謙虚さを兼ねれば、最後まで実りを得ます。' },
          { text:'利ろしからざる无し。謙を撝ぐ。', meaning:'すべてに利あり。へりくだりを発揮し、上を敬い下を導く。釣り合いの取れた段階。', advice:'どんな場面でも謙虚を働かせること。立てるべきを立て、下を支えれば、すべて巡ります。' },
          { text:'富まずして其の隣を以う。用て侵伐するに利ろし。利ろしからざる无し。', meaning:'富を誇らずとも人がついてくる。必要なら毅然と正す。謙の中に芯を持つ段階。', advice:'へりくだりは弱さではありません。譲れぬところは毅然と。柔らかさと芯を併せ持つこと。' },
          { text:'謙を鳴らす。用て師を行り、邑国を征するに利ろし。', meaning:'謙の極み。なお内に治めきれぬものがあり、まず自らの足元を正すべき段階。', advice:'謙虚であっても、正すべきはまず身近・自分自身から。外へ向ける前に足元を整えましょう。' },
        ] },
  16: { num:16, name:'雷地豫', reading:'らいちよ',
        judgment:'豫は侯を建て師を行るに利ろし。',
        summary:'雷が地から出る、よろこびと勢いのとき。備えと和があれば動きが通る。',
        keywords:['悦び','勢い','備え'],
        image:'雷、地に出ずるは豫なり。',
        advice:'楽しさに流されず、先々への備えを忘れない。和やかさを力に変えて動きましょう。',
        lines:[
          { text:'豫を鳴らす。凶なり。', meaning:'喜びや勢いを得意げに鳴らし立てる。浮かれて自ら吹聴し、災いを招く、いちばん下の段階。', advice:'嬉しさや好調を、得意げに言いふらさないこと。浮かれは足元をすくいます。' },
          { text:'石よりも介し。日を終えず。貞しくして吉。', meaning:'石のように固く節を守り、機を見れば即座に動く。浮かれに流されず正しく吉の段階。', advice:'楽しい時も、流されず筋を固く保つこと。潮目を察したら、ためらわず動きましょう。' },
          { text:'盱して豫しむ。悔ゆ。遅ければ悔い有り。', meaning:'上を見上げて取り入り楽しむ。自立を欠き、ぐずぐずすれば悔いを重ねる段階。', advice:'人の顔色をうかがって楽をしないこと。気づいたら早く改める。遅れるほど悔いが増します。' },
          { text:'豫に由る。大いに得る有り。疑う勿れ。朋盍ち簪まる。', meaning:'喜びと勢いの源となる中心の段階。疑わず誠を尽くせば、仲間が集まり大きく得る。', advice:'あなたが場の要のとき。自分を疑わず、まっすぐに動くこと。誠が仲間を引き寄せます。' },
          { text:'貞しけれど疾あり。恒に死せず。', meaning:'安逸に押されて力を振るえず、持病のように停滞する。それでも保てば滅びない段階。', advice:'楽な流れに押されて動けなくとも、芯を手放さないこと。保ち続ければ、崩れはしません。' },
          { text:'冥豫す。成りて渝ること有り。咎无し。', meaning:'喜びに溺れ、分別を失う極み。だが過ちに気づいて改めれば、咎を免れる段階。', advice:'楽しみに溺れていると気づいたら、すぐ改めること。改心できるなら、咎にはなりません。' },
        ] },
  17: { num:17, name:'澤雷随', reading:'たくらいずい',
        judgment:'随は元いに亨る。貞しきに利ろし。咎なし。',
        summary:'時に随い、人に従うとき。正しく従えば大いに通り、咎はない。',
        keywords:['随順','適応','信頼'],
        image:'澤の中に雷あるは随なり。',
        advice:'自我を張らず、良い流れや人に素直に随う。ただ随う相手と道理は見極めて。',
        lines:[
          { text:'官に渝ること有り。貞しくして吉。門を出でて交われば功有り。', meaning:'立場や考えを改めて新しい流れに従う。内に閉じず外と交われば功のある、始まりの段階。', advice:'こだわりを改め、外へ出て広く交わること。固執せず開けば、思わぬ成果が生まれます。' },
          { text:'小子に係る。丈夫を失う。', meaning:'目先の小さなものに執着し、本当に頼るべき相手を失う。随う相手を誤る段階。', advice:'手近で楽な相手に流されないこと。何に随うかを誤れば、大事なものを取り逃します。' },
          { text:'丈夫に係る。小子を失う。随いて求めて得る有り。貞に居るに利ろし。', meaning:'頼るべき相手を選び、小さな執着を手放す。正しく随えば求めて得られる段階。', advice:'何に従うかを定めたら、小さな未練は捨てること。正しい相手に随えば、望みは叶います。' },
          { text:'随いて獲ること有り。貞なれども凶なり。孚有りて道に在り、以て明らかなれば、何の咎あらん。', meaning:'従われ慕われて得るものが多い段階。だが私すれば凶。誠と道理を明らかに保てば咎なし。', advice:'人望や利を得ても、私物化しないこと。誠と筋を明らかにしていれば、咎められません。' },
          { text:'嘉きに孚あり。吉なり。', meaning:'善きもの・善き人を心から信じて従う、充実の中心の段階。誠が嘉に通じて吉となる。', advice:'善いと信じたものに、まごころで従うこと。誠が良きものと結べば、大きな吉になります。' },
          { text:'之を拘係し、乃ち従いて之を維ぐ。王、用て西山に亨す。', meaning:'固く結ばれ、離れがたく随い従う随の極み。誠が神明にまで通じる段階。', advice:'心から結ばれた縁は、固く保つこと。誠を尽くし切れば、その結びは天にも通じます。' },
        ] },
  18: { num:18, name:'山風蠱', reading:'さんぷうこ',

        lines:[

          { text:'母の蠱を幹む。貞にすべからず。', meaning:'柔らかな相手の乱れを正すとき。強引に押し通さず、加減して整えるべき段階。', advice:'正すにも、相手によっては強引は禁物。角を立てず、柔らかく粘り強く改めましょう。' },
          { text:'父の蠱を幹む。小しく悔い有れど、大いなる咎无し。', meaning:'改革に勢いがやや過ぎ、小さな悔いは残る。それでも大過には至らない中間の段階。', advice:'立て直しに少し力みすぎても、大事には至りません。多少の悔いは恐れず、進めてよいとき。' },
          { text:'父の蠱を裕にす。往けば吝を見る。', meaning:'乱れを正さず、なあなあに見過ごす。手をこまねくほど後で悔いる段階。', advice:'問題を先延ばしにして甘く見ないこと。放置して進めば、いずれ行き詰まります。' },
          { text:'父の蠱を幹む。用て誉れあり。', meaning:'受け継いだ乱れを立派に正し、誉れを得る中心の段階。徳をもって改革を成す。', advice:'古い澱みを正しく改めれば、評価が伴います。私心なく立て直せば、名も実も得られます。' },
          { text:'王侯に事えず。其の事を高尚にす。', meaning:'世の役職を離れ、志を高く保つ蠱の極み。立て直しを終え、自らの道を尊ぶ段階。', advice:'一区切りついたら、地位や名声から離れてよいとき。自分の信じる道を、高く保ちましょう。' },
        ] },
  19: { num:19, name:'地澤臨', reading:'ちたくりん',

          { text:'咸じて臨む。吉にして利ろしからざる无し。', meaning:'誠の感応で人に臨み、勢いに乗って進む。何をしても通じる、充実した段階。', advice:'心を通わせて臨めば、すべてが順調に運びます。勢いを誠で支え、堂々と進みましょう。' },

          { text:'至りて臨む。咎无し。', meaning:'真心を尽くしてぴたりと寄り添い臨む。上にありながら下と親しく交わる、咎なき段階。', advice:'立場に隔てを置かず、心から寄り添うこと。下と親しく交われば、過ちは生じません。' },
          { text:'知をもって臨む。大君の宜しきなり。吉なり。', meaning:'知恵をもって人に臨み、適材に任せる中心の段階。賢明な大君の振る舞いで吉となる。', advice:'何でも自分でせず、知恵をもって人に任せること。適した人を用いる度量が、吉を呼びます。' },
          { text:'敦くして臨む。吉にして咎无し。', meaning:'手厚い真心で人に臨む臨の極み。驕らず篤実に下を遇する、吉にして咎なき段階。', advice:'最後まで篤い真心で人に接すること。手厚く誠実であれば、吉であり過ちもありません。' },
        ] },
  20: { num:20, name:'風地観', reading:'ふうちかん',

          { text:'我が生を観る。君子なれば咎无し。', meaning:'上に立つ者として、自らの生き方を観て省みる中心の段階。徳を保てば咎なし。', advice:'人を導く立場ほど、わが身を省みること。自分の生き方が手本になっていれば、咎はありません。' },

  22: { num:22, name:'山火賁', reading:'さんかひ',

        lines:[

          { text:'牀を剝するに足を以てす。貞を蔑にして凶なり。', meaning:'寝台の脚から削られ始める。崩壊が足元から忍び寄る、いちばん下の凶の段階。', advice:'ほころびは足元から始まります。小さな崩れを軽く見ず、正しさの土台を守ること。' },
          { text:'牀を剝するに辨を以てす。貞を蔑にして凶なり。', meaning:'削りが寝台の枠まで及ぶ。崩れが進み、より所を失っていく凶の段階。', advice:'崩れがじわじわ迫る時。孤立しないこと。支えを失う前に、身を寄せる先を確かめましょう。' },
          { text:'之を剝す。咎无し。', meaning:'崩れの流れの中にありながら、上の正しき者に応じて身を保つ。剥落の中で咎を免れる段階。', advice:'周りが崩れていく中でも、信じる正しいものに付くこと。流れに抗わずとも、身は守れます。' },
          { text:'牀を剝するに膚を以てす。凶なり。', meaning:'削りがついに身に及ぶ。災いが我が身に直接迫る、避けがたい凶の段階。', advice:'危機が身に迫る時。もはや小手先では防げません。被害を最小にする備えに専念すること。' },
          { text:'魚を貫く。宮人の寵を以てす。利ろしからざる无し。', meaning:'魚を一列に貫くように陰を統べ、上の一陽に従い率いる。崩れが転じ、利を得る段階。', advice:'ばらばらな力をまとめ、上の正しさに従わせること。秩序を取り戻せば、すべて好転します。' },
          { text:'碩果は食らわれず。君子は輿を得、小人は廬を剝す。', meaning:'食べ残された大きな果実=最後の一陽。崩れ尽きて再生の種が残る剝の極み。', advice:'どん底でも、最後の希望は残されています。徳を守る者は再び立て、私利に走る者は足場を失います。' },
        ] },
  24: { num:24, name:'地雷復', reading:'ちらいふく',
        judgment:'復は亨る。出入疾なし。朋來りて咎なし。',
        summary:'一陽が地の底に還る、回復と再出発のとき。冬至のように光が戻り始める。',
        keywords:['回復','再起','還る'],
        image:'雷、地中に在るは復なり。',
        advice:'小さな兆しを大切に育てる。あせらず、戻ってきた力を静かに伸ばしましょう。',
        lines:[
          { text:'遠からずして復る。悔いに祗ること无し。元いに吉なり。', meaning:'遠くまで行かぬうちに、すぐ本道へ立ち返る。過ちを早く正す、大いに吉の始まりの段階。', advice:'道を踏み外しかけても、遠くへ行かぬうちに戻ること。早い立ち返りは、最良の吉です。' },
          { text:'休く復る。吉なり。', meaning:'心穏やかに、善き人に倣ってよく立ち返る。素直に復る、吉の段階。', advice:'よき手本に倣って素直に戻ること。へりくだって人に学べば、気持ちよく立ち返れます。' },
          { text:'頻りに復る。厲うけれど咎无し。', meaning:'行きつ戻りつ、何度も立ち返る。危うさはあるが、改める限り咎のない段階。', advice:'何度しくじっても、その都度戻ればよいのです。繰り返しても、改め続ければ咎にはなりません。' },
          { text:'中行して独り復る。', meaning:'周りが迷う中、ただ独り正しい道へ立ち返る。流されず本道に帰る段階。', advice:'みなが流れても、独りでも正しい道へ戻る勇気を。同調より、自分の筋を選ぶときです。' },
          { text:'敦く復る。悔い无し。', meaning:'篤い真心をもって、しっかりと立ち返る中心の段階。深く省みて改め、悔いを残さない。', advice:'立ち返るなら、心を込めて深く。中途半端でなく篤実に改めれば、悔いは残りません。' },
          { text:'復るに迷う。凶なり。災眚あり。用て師を行れば、終に大敗あり。其の国君に凶ぶ。十年に至るまで征する克わず。', meaning:'帰るべき時を見失い、迷って戻れない復の極み。過ちを正せず、長く災いを引きずる凶の段階。', advice:'戻る機会を逃し続けないこと。意地で突き進めば大きく崩れます。今こそ引き返す最後の時です。' },
        ] },
  25: { num:25, name:'天雷无妄', reading:'てんらいむぼう',
        judgment:'无妄は元いに亨る。貞しきに利ろし。其れ正しからざれば眚あり。',
        summary:'偽りなく、天のままにあるとき。作為を捨てれば通る。よこしまには災い。',
        keywords:['誠実','自然','無心'],
        image:'天の下に雷行くは无妄なり。',
        advice:'下心や打算を手放し、ありのままに行う。結果を計らず、誠を尽くすことが吉です。',
        lines:[
          { text:'无妄なり。往きて吉なり。', meaning:'偽りなく、まっすぐな心のままに動く。誠で踏み出せば吉となる、始まりの段階。', advice:'下心を持たず、素直な心のままに進むこと。誠で動けば、その一歩は吉になります。' },
          { text:'耕さずして穫り、菑かずして畬る。則ち往く攸有るに利ろし。', meaning:'見返りを当てにせず、なすべきを淡々と行う。結果を計らぬから、進んで利のある段階。', advice:'成果を先に皮算用しないこと。目の前の務めを誠実に果たせば、おのずと道がひらけます。' },
          { text:'无妄の災。或いは之が牛を繋ぐ。行人の得るは、邑人の災なり。', meaning:'落ち度なく降りかかる災い。繋いだ牛を旅人が奪い、里人が疑われるような、理不尽な段階。', advice:'身に覚えのない災いに遭うこともあります。取り乱さず、潔白を保って静かにやり過ごすこと。' },
          { text:'貞にすべし。咎无し。', meaning:'正しさを固く守りさえすればよい段階。誠を保ち動かずにいれば、咎は生じない。', advice:'余計なことをせず、正しさを固く保つこと。誠を守って動じなければ、過ちはありません。' },
          { text:'无妄の疾。薬する勿れ。喜び有り。', meaning:'誠を尽くしてなお起こる、いわれのない不調。下手に手を加えず待てば、自ずと癒える段階。', advice:'理由のない不調は、あれこれ手を出さず待つこと。誠を保てば、おのずと良い方へ向かいます。' },
          { text:'无妄なるも行けば眚あり。利ろしき攸无し。', meaning:'誠であっても、時を弁えず動けば災いを招く无妄の極み。今は進むべきでない段階。', advice:'たとえ正しくても、時でなければ動かないこと。機をわきまえ、いまは静かに留まりましょう。' },
        ] },
  26: { num:26, name:'山天大畜', reading:'さんてんたいちく',
        judgment:'大畜は貞しきに利ろし。家食せずして吉。大川を渉るに利ろし。',
        summary:'大いに蓄え、力をためるとき。徳と実力を養えば、大事も渡れる。',
        keywords:['大きな蓄え','鍛錬','登用'],
        image:'天、山中に在るは大畜なり。',
        advice:'内にこもらず、養った力を世に出す。日々の研鑽が、やがて大きく実ります。',
        lines:[
          { text:'厲うきこと有り。已むに利ろし。', meaning:'進めば危うい。蓄えの始め、無理に動かず止まるのが利のある、いちばん下の段階。', advice:'危ういと感じたら、進まず止まること。逸る気持ちを抑え、いまは力を蓄えましょう。' },
          { text:'輿、輹を説く。', meaning:'車軸の留めを自ら外し、進むのをやめる。抑えられて止まるが、損なわれぬ段階。', advice:'進めないのは、止まるべき時だから。無理に動かず、自分から立ち止まる賢さを持つこと。' },
          { text:'良馬逐う。艱貞に利ろし。日に輿衛を閑えば、往く攸有るに利ろし。', meaning:'良馬が並んで駆けるように、蓄えが解けて進める段階。日々鍛え備えれば、前へ出て利あり。', advice:'進める時が来たら、駆け出してよいとき。ただし日頃の備えと鍛錬を怠らないことが条件です。' },
          { text:'童牛の牿なり。元いに吉なり。', meaning:'角の生え初めの子牛に横木をあてるように、勢いを早めに穏やかに抑える。大いに吉の段階。', advice:'荒い力は、暴れる前に穏やかに抑えること。早めに手を打てば、大きな成果につながります。' },
          { text:'豶豕の牙なり。吉なり。', meaning:'去勢した猪の牙のように、猛々しさの根を和らげて制する中心の段階。要を押さえて吉。', advice:'荒ぶる力は、正面から抑え込むより、根を和らげること。要点を押さえれば穏やかに治まります。' },
          { text:'何ぞ天の衢なる。亨る。', meaning:'蓄えが満ち、天の大道がからりと開ける大畜の極み。力が世に通じ、大いに通る段階。', advice:'蓄えきった力が、いま世に通じるとき。出し惜しまず、開けた大道を堂々と進みましょう。' },
        ] },
  27: { num:27, name:'山雷頤', reading:'さんらいい',
        judgment:'頤は貞しくして吉。頤を観て、自ら口実を求む。',
        summary:'あごの形。養う・養われるとき。何を口にし、何で心身を養うかが問われる。',
        keywords:['養生','言葉','節制'],
        image:'山の下に雷あるは頤なり。',
        advice:'口に入れる物も、口から出す言葉も慎む。正しく養うものを自分で選びましょう。',
        lines:[
          { text:'爾の霊亀を舍てて、我を観て頤を朶る。凶なり。', meaning:'自分の中の貴い糧を捨て、人の食を羨んで口を垂らす。自立を失う、凶の始まりの段階。', advice:'自分の中の宝を手放して、人を羨まないこと。よそを欲しがるより、己の糧を養いましょう。' },
          { text:'頤に顛る。経に拂る。丘に于いて頤われんとす。征けば凶なり。', meaning:'養う上下が逆さになり、筋に背いて高きに食を求める。道を外れて動けば凶の段階。', advice:'頼る筋道を取り違えないこと。本来養うべき者に背いて高望みすれば、つまずきます。' },
          { text:'頤に拂る。貞なれども凶なり。十年用うる勿れ。利ろしき攸无し。', meaning:'養いの道に真っ向から背く。欲のままに養われ、長く立ち行かない凶の段階。', advice:'節度を失った求め方は、長く身を損ないます。欲に任せた養いを断ち、いったん退くこと。' },
          { text:'頤に顛る。吉なり。虎の視ること眈眈、其の欲うこと逐逐たれば、咎无し。', meaning:'下に養いを求めるが、虎のように真剣に見据え、絶えず誠を尽くせば咎のない段階。', advice:'人の力を借りて養うときも、真剣さと誠を絶やさないこと。本気で求めれば、咎にはなりません。' },
          { text:'経に拂る。貞に居れば吉。大川を渉るべからず。', meaning:'自ら養う力が足りず常道に背くが、正しく身を処し賢に頼れば吉。大事には進めぬ段階。', advice:'力不足のときは、正しさを守り、優れた人に頼ること。大冒険は避け、堅実に構えましょう。' },
          { text:'頤に由る。厲うけれど吉なり。大川を渉るに利ろし。', meaning:'万人を養う源となる頤の極み。責任は重く危ういが、よく担えば吉、大事も渡れる段階。', advice:'多くを養い導く立場にあるとき。重責に身を引き締めれば、大きな困難も越えて吉となります。' },
        ] },
  28: { num:28, name:'澤風大過', reading:'たくふうたいか',
        judgment:'大過は棟撓む。往く攸あるに利ろし。亨る。',
        summary:'棟木がしなうほど、負荷が過大なとき。常を越える非常時。',
        keywords:['過重','非常','果断'],
        image:'澤、木を滅するは大過なり。',
        advice:'平時の手は通じない。独り立つ覚悟で、思いきった一手を。ただし支えの確保を忘れずに。',
        lines:[
          { text:'藉くに白茅を用う。咎无し。', meaning:'供え物の下に白い茅を敷くように、非常時のはじめを慎重に丁寧に扱う。咎なき段階。', advice:'大事の入り口こそ、ていねいに慎重に。下に敷く一枚を惜しまぬ心遣いが、過ちを防ぎます。' },
          { text:'枯楊、稊を生ず。老夫、其の女妻を得。利ろしからざる无し。', meaning:'枯れた柳が新芽を吹き、老人が若い妻を得るように、衰えに新たな生気が通う。利のある段階。', advice:'衰えたものにも、思いがけぬ再生の力が宿ります。年や立場の差を越えた結びも、今は実ります。' },
          { text:'棟撓む。凶なり。', meaning:'屋根の棟木がしなりたわむ。負荷に対し剛が過ぎて支えきれず、折れかける凶の段階。', advice:'力みすぎ、独断が過ぎると、屋台骨が傾きます。我を張らず、人の支えを受け入れること。' },
          { text:'棟隆んなり。吉なり。它有れば吝なり。', meaning:'棟木がしっかり持ち上がり、重みを支えられる吉の段階。ただ他に心を移せば悔いが残る。', advice:'重責を支えられる力があるとき。よそ見や下心を持たず、一筋に務めれば吉を保てます。' },
          { text:'枯楊、華を生ず。老婦、其の士夫を得。咎も无く誉れも无し。', meaning:'枯れ柳が花を咲かせるが実は結ばぬように、見栄えはあれど長続きしない、可もなく不可もない段階。', advice:'一時の華やかさに、確かな実りまで期待しないこと。咎はないが、長続きは望みにくいときです。' },
          { text:'過ぎて渉る。頂を滅す。凶なれど、咎无し。', meaning:'川を渡りきろうと進みすぎ、頭まで水に没する大過の極み。身を捨てても志を貫く段階。', advice:'大義のためとはいえ、命取りの深みには踏み込まぬこと。引けない覚悟ほど、退き際を見極めて。' },
        ] },
  29: { num:29, name:'坎為水', reading:'かんいすい',
        judgment:'習坎は孚あり。維れ心亨る。行けば尚ばるることあり。',
        summary:'水が重なる、繰り返す険難のとき。誠の心を保てば、難の中でも通る。',
        keywords:['険難','試練','誠'],
        image:'水洊りに至るは習坎なり。',
        advice:'危険から逃げず、水のように低きに従い流れる。芯の誠さえあれば抜けられます。',
        lines:[
          { text:'習坎なり。坎の窞に入る。凶なり。', meaning:'険難が重なり、穴の中のさらに深い穴に落ち込む。危地に慣れて沈む、凶の始まりの段階。', advice:'危うい流れに身を委ねないこと。慣れて深みにはまる前に、抜け出す意志を持ちましょう。' },
          { text:'坎に険有り。求めて小しく得。', meaning:'険難のただ中で身動きが取りにくい。多くは望めず、わずかに求めて得られる段階。', advice:'苦境では、一足飛びの解決を求めないこと。小さく確実に手にできるものから掴みましょう。' },
          { text:'来るも之くも坎坎たり。険にして且つ枕む。坎の窞に入る。用うる勿れ。', meaning:'進んでも退いても険難ばかり。危地に深く入り込み、動けば沈む。動くべきでない段階。', advice:'どちらに動いても危ういとき。無理に動かず、深みでは身を低くしてやり過ごすこと。' },
          { text:'樽酒、簋弐、用うるに缶を以てす。約を牖より納る。終に咎无し。', meaning:'飾らぬ酒と食を素焼きの器で差し出し、誠を率直に通わせる。質素な真心で難を凌ぐ段階。', advice:'苦しい時の付き合いは、飾らぬ誠で十分。素朴でも心の通うやり取りが、危機を救います。' },
          { text:'坎盈たず。既に平らかなるに祗る。咎无し。', meaning:'険難の水がまだ溢れず、ようやく平らになりかける中心の段階。中庸を保てば咎なし。', advice:'危機が収まりかける時こそ、行き過ぎないこと。ほどよきところで止め、平らかさを保ちましょう。' },
          { text:'徽纆を係け、叢棘に寘く。三歳まで得ず。凶なり。', meaning:'縄で縛られ、いばらの中に置かれて長く抜け出せない坎の極み。険難に囚われきった凶の段階。', advice:'危地が極まり囚われた時は、もがくほど絡みます。長期戦と覚悟し、まず縛めを解く一点に集中を。' },
        ] },
  30: { num:30, name:'離為火', reading:'りいか',
        judgment:'離は貞しきに利ろし。亨る。牝牛を畜えば吉。',
        summary:'火が重なり明るく照らすとき。何かに付き、明らかにする。正しさに依れば通る。',
        keywords:['明智','付着','情熱'],
        image:'明、両つながら作るは離なり。',
        advice:'明るさを正しい対象に向ける。燃え立つ勢いを、柔順さで支えれば長く照らせます。',
        lines:[
          { text:'履むこと錯然たり。之を敬すれば咎无し。', meaning:'明るさの出だしで足取りが乱れ交錯する。慎んで敬えば咎を免れる、いちばん下の段階。', advice:'物事の始まりは、とかく乱れがち。あわてず、ひとつひとつ慎んで踏めば、過ちは防げます。' },
          { text:'黄離なり。元いに吉なり。', meaning:'中庸を表す黄の輝きに付く。明るさが過不足なく整う、大いに吉の中心の段階。', advice:'明るさも、行き過ぎず控えめが最良。中庸を保ってほどよく照らせば、大きな吉になります。' },
          { text:'日昃くの離なり。缶を鼓して歌わざれば、則ち大耋の嗟あり。凶なり。', meaning:'日が傾く頃の明るさ。盛りの過ぎゆくを受け入れて楽しめず、老いを嘆けば凶の段階。', advice:'盛りは必ず傾きます。それを嘆くより、淡々と受け入れて楽しむこと。執着は禍を招きます。' },
          { text:'突如として其れ来如たり。焚如たり、死如たり、棄如たり。', meaning:'燃え盛る火が突然襲うように、勢いが激しすぎて自らを焼き尽くす。急激に破れる段階。', advice:'勢いに任せて燃え上がりすぎないこと。急に激すれば、自分も周りも焼いてしまいます。' },
          { text:'涕を出すこと沱若たり。戚うること嗟若たり。吉なり。', meaning:'涙を流し憂え嘆く中心の段階。柔弱な身を憂え慎むからこそ、かえって吉に転じる。', advice:'不安に涙する弱さも、悪いことではありません。我が身を憂えて慎めば、かえって救われます。' },
          { text:'王、用て出征す。嘉き有り。首を折き、獲るは其の醜に匪ず。咎无し。', meaning:'明知を世に向け、悪の首魁だけを討って従う者は赦す離の極み。けじめをつけて咎なき段階。', advice:'正すべきは、元凶だけに絞ること。巻き添えを広げず要点を断てば、けじめがついて咎なしです。' },
        ] },
  31: { num:31, name:'澤山咸', reading:'たくざんかん',
        judgment:'咸は亨る。貞しきに利ろし。女を取れば吉。',
        summary:'山の上に澤、感じ合うとき。心が通い、互いに応じる。出会いと感応。',
        keywords:['感応','共鳴','縁'],
        image:'山の上に澤あるは咸なり。',
        advice:'頭で測る前に、素直に感じ合う。心を空しくして応じれば、良い縁が結ばれます。',
        lines:[
          { text:'其の拇に咸ず。', meaning:'感応がまだ足の親指にとどまる。心が動き始めたばかりで、表に出ない、いちばん下の段階。', advice:'心が動いても、まだ兆しの段階。あせって表に出さず、その感覚を静かに育てましょう。' },
          { text:'其の腓に咸ず。凶なり。居れば吉。', meaning:'感応がふくらはぎに及び、思わず動き出しそうになる。先走れば凶、留まれば吉の段階。', advice:'気持ちが急いても、軽々しく動かないこと。逸る足を止めて待てば、かえって吉になります。' },
          { text:'其の股に咸ず。其の随うを執る。往けば吝なり。', meaning:'感応が股に及び、人に引きずられて動く。自分を持たず付き従えば、悔いる段階。', advice:'人の動きに流されて、つい一緒に動かないこと。主体を失った同調は、後悔のもとです。' },
          { text:'貞しくして吉。悔い亡ぶ。憧憧として往来すれば、朋、爾の思いに従う。', meaning:'心の感応の要となる段階。正しく構えれば吉。落ち着かず私情で往き来すれば、狭い縁しか応じぬ。', advice:'誠で正しく感じ合えば吉です。あれこれ思い惑って動き回ると、通じ合える相手も狭まります。' },
          { text:'其の脢に咸ず。悔い无し。', meaning:'感応が背に及ぶ。私情に流されず、動じない位置で誠を保つ中心の段階。悔いなし。', advice:'表面の感情に揺さぶられず、芯で受けとめること。動じない誠を保てば、悔いは残りません。' },
          { text:'其の輔・頬・舌に咸ず。', meaning:'感応が口先・頬・舌にとどまる咸の極み。口先だけで心が伴わない、上滑りの段階。', advice:'言葉だけで人を動かそうとしないこと。口先の調子よさより、心の伴った誠が人に届きます。' },
        ] },
  32: { num:32, name:'雷風恒', reading:'らいふうこう',
        judgment:'恒は亨る。咎なし。貞しきに利ろし。往く攸あるに利ろし。',
        summary:'雷と風、変わらず続く常のとき。久しきを保てば通る。持続の徳。',
        keywords:['持続','恒常','継続'],
        image:'雷風あるは恒なり。',
        advice:'目移りせず、続けるべき道を続ける。変わらぬ姿勢こそが、長い実りを生みます。',
        lines:[
          { text:'浚き恒なり。貞なれども凶なり。利ろしき攸无し。', meaning:'はじめから深く求めすぎる恒。常を急いで掘り下げ、無理を通せば凶という、いちばん下の段階。', advice:'続けることを、初めから深く求めすぎないこと。焦って根を張ろうとすると、かえって続きません。' },
          { text:'悔い亡ぶ。', meaning:'中庸を得て、行き過ぎを正す。常を保つ力が定まり、悔いが消えていく段階。', advice:'行き過ぎを引き戻し、ほどよさを保つこと。中庸に立てば、迷いも悔いも薄れていきます。' },
          { text:'其の徳を恒にせず。或いは之が羞を承く。貞なれども吝なり。', meaning:'徳を一定に保てず、心がぐらつく。節操なく揺れて恥を受ける、悔いの残る段階。', advice:'態度や信念をころころ変えないこと。ぶれ続ければ、いずれ恥をかきます。腰を据えましょう。' },
          { text:'田して禽无し。', meaning:'畑違いの場所で獲物を狙うように、いるべき所を外して努める。実りの得られない段階。', advice:'努力の方向がずれていないか確かめること。場違いな所で続けても、成果は上がりません。' },
          { text:'其の徳を恒にす。貞し。婦人は吉、夫子は凶なり。', meaning:'一つの徳を守り通す段階。従い支える立場には吉だが、自ら決すべき立場には凶となる。', advice:'一筋に守るのが吉な時と、自ら判断すべき時がある。立場をわきまえて、貫き方を選ぶこと。' },
          { text:'恒を振う。凶なり。', meaning:'落ち着かず常を揺り動かす恒の極み。終わりまで定まらず、ぐらつき続けて凶の段階。', advice:'最後まで腰が定まらないと、すべてが崩れます。じたばたせず、どっしり構えること。' },
        ] },
  33: { num:33, name:'天山遯', reading:'てんざんとん',
        judgment:'遯は亨る。小しく貞しきに利ろし。',
        summary:'退き、身を遠ざけるとき。陰が伸びる前に、潔く引けば通る。',
        keywords:['退避','引き際','保身'],
        image:'天の下に山あるは遯なり。',
        advice:'執着せず、良い頃合いで退く。逃げではなく、次のための賢い距離の取り方です。',
        lines:[
          { text:'遯の尾なり。厲うし。往く攸有るに用うる勿れ。', meaning:'退くのに出遅れ、しんがりになる。逃げ遅れて危うい、いちばん下の段階。', advice:'引くなら早く。出遅れて殿になると危険です。今は無理に動かず、じっと身を潜めましょう。' },
          { text:'之を執うるに黄牛の革を用う。説くべきこと莫し。', meaning:'黄牛の革で固く縛るように、堅い意志で結びを保つ。誰にもほどけぬ堅固な段階。', advice:'守ると決めたら、固く意志を結ぶこと。黄牛の革のような堅さがあれば、揺るがされません。' },
          { text:'係れる遯なり。疾有りて厲うし。臣妾を畜うに吉なり。', meaning:'未練に絡まれて退ききれない。煩いがあって危ういが、身近を養うには吉という段階。', advice:'退きたくとも情に絡まれる時。大事は退いて、身近な小事の世話に徹すれば穏やかです。' },
          { text:'好める遯なり。君子は吉、小人は否なり。', meaning:'好むものを抱えながらも、潔く退く。未練を断てる君子は吉、断てぬ小人は凶の段階。', advice:'惜しいものでも、退くべき時は退くこと。執着を断ち切れるなら、それが吉になります。' },
          { text:'嘉き遯なり。貞しくして吉。', meaning:'時宜にかなった、美しく潔い退き。中正を保って引ける、正しく吉の中心の段階。', advice:'引き際が見事であれば、それは最良の進退です。未練を残さず、正しく退きましょう。' },
          { text:'肥かなる遯なり。利ろしからざる无し。', meaning:'何の絡みもなく、ゆとりをもって悠々と退く遯の極み。心軽く身を引く、利のある段階。', advice:'しがらみを離れ、ゆったりと身を引くとき。執着がなければ、退くことがすべて益になります。' },
        ] },
  34: { num:34, name:'雷天大壮', reading:'らいてんたいそう',
        judgment:'大壮は貞しきに利ろし。',
        summary:'雷が天に轟く、勢い盛んなとき。力は強いが、正しさを欠けば暴走する。',
        keywords:['強盛','勢い','自制'],
        image:'雷、天上に在るは大壮なり。',
        advice:'力にまかせて突き進まない。礼にかなわぬことはせず、勢いを正道で御しましょう。',
        lines:[
          { text:'趾に壮んなり。征けば凶なり。孚有り。', meaning:'足元から勢いづいて突き進もうとする。力任せに進めば凶という、いちばん下の段階。', advice:'勢いがあっても、足元から逸らないこと。力任せに踏み出せば、必ずつまずきます。' },
          { text:'貞しくして吉。', meaning:'強さを内に抑え、中庸を保つ。勢いを正しく御して吉となる段階。', advice:'強さを誇示せず、ほどよく抑えること。中庸を保てば、その力は正しく吉に働きます。' },
          { text:'小人は壮を用い、君子は罔を用う。貞なれども厲うし。羝羊藩に触れ、其の角を羸る。', meaning:'小人は力を振るい、君子は用いない。垣根に角を突っ込んだ雄羊のように、力みが身を縛る段階。', advice:'力で押し通そうとしないこと。猪突すれば、垣に絡む羊の角のように、かえって動けなくなります。' },
          { text:'貞しくして吉。悔い亡ぶ。藩決けて羸れず。壮んなること大輿の輹に于いてす。', meaning:'正しく構えれば吉、悔いも消える。垣根が開けて角は絡まず、大車の心棒のように力強く進む段階。', advice:'正しさを保てば、障害は自ずと開けます。力を軸にまっすぐ据えれば、堂々と前へ進めます。' },
          { text:'羊を易に喪う。悔い无し。', meaning:'荒ぶる羊（強さ）を、和らげる場所で穏やかに手放す。剛を緩め、悔いの残らぬ段階。', advice:'力みを、こだわりなく手放すこと。意地を張り続けるより、すっと緩めれば悔いは残りません。' },
          { text:'羝羊藩に触れ、退くこと能わず遂ぐること能わず。利ろしき攸无し。艱めば則ち吉なり。', meaning:'垣に角を突っ込んだ雄羊が進退きわまる大壮の極み。突っ張った末に動けなくなる段階。', advice:'突き進んで身動きが取れなくなったら、もがかないこと。難局と認めて慎めば、活路が開けます。' },
        ] },
  35: { num:35, name:'火地晋', reading:'かちしん',
        judgment:'晋は康侯馬を錫うこと蕃庶、昼日三たび接す。',
        summary:'太陽が地上に昇る、進み栄えるとき。明るく前に出て、認められる。',
        keywords:['前進','昇進','栄達'],
        image:'明、地上に出ずるは晋なり。',
        advice:'明るさを保って進み出る。功を焦らず誠を示せば、自然と引き立てられます。',
        lines:[
          { text:'晋如たり摧如たり。貞しくして吉。孚とせられざるも、裕なれば咎无し。', meaning:'進もうとして阻まれる、昇り始めの段階。まだ信を得られずとも、ゆとりを保てば咎なし。', advice:'進もうとして退けられても、焦らないこと。すぐ信用されなくとも、ゆったり構えれば咎なしです。' },
          { text:'晋如たり愁如たり。貞しくして吉。茲の介福を其の王母に于いて受く。', meaning:'進みたいのに憂え悩む段階。だが正しさを保てば、やがて上から大きな幸いを受ける。', advice:'思うように進めず憂えても、正しさを手放さないこと。耐えていれば、大きな引き立てが訪れます。' },
          { text:'衆允ふ。悔い亡ぶ。', meaning:'周りの人々が心を合わせて従う。皆の信を得て進む、悔いの消える段階。', advice:'独りで進むより、周りの賛同を得ること。皆が心を合わせれば、迷いも悔いも消えていきます。' },
          { text:'晋如たること鼫鼠のごとし。貞なれども厲うし。', meaning:'むささびのように欲深く昇ろうとする。地位に貪欲で、危うさをはらむ段階。', advice:'欲を出して地位に貪らないこと。分不相応に高みを狙えば、足をすくわれます。慎みを。' },
          { text:'悔い亡ぶ。失得恤うる勿れ。往けば吉にして利ろしからざる无し。', meaning:'中心に進み出て、明るく上に立つ段階。損得にこだわらず進めば、すべて吉となる。', advice:'細かな損得を気にしないこと。明るく大らかに進み出れば、何をしてもうまく運びます。' },
          { text:'其の角に晋む。維れ用て邑を伐つ。厲うけれど吉にして咎无し。貞なれども吝なり。', meaning:'角の先まで突き進む晋の極み。行き過ぎだが、まず我が身内を正すなら、危うくも咎なき段階。', advice:'進みすぎたら、矛先をまず自分の足元へ。身近の乱れを正すぶんには、危うくても咎なしです。' },
        ] },
  36: { num:36, name:'地火明夷', reading:'ちかめいい',
        judgment:'明夷は艱貞に利ろし。',
        summary:'明るさが地に没し、傷つくとき。才を隠し、苦難の中で正しさを守る。',
        keywords:['韜晦','受難','忍耐'],
        image:'明、地中に入るは明夷なり。',
        advice:'光を内に隠し、目立たず身を守る。困難な時こそ、ひそかに志を堅く保ちましょう。',
        lines:[
          { text:'明夷、飛ぶに于いて其の翼を垂る。君子行きて、三日食らわず。往く攸有れば、主人言有り。', meaning:'傷つく時、飛ぶ鳥が翼を垂れるように志を隠して去る。苦難の始まり、誤解も受ける段階。', advice:'危うい時は、目立たず身を引くこと。当座は誤解や困窮もあるが、志を伏せて切り抜けましょう。' },
          { text:'明夷、左股を夷る。用て拯うこと馬壮んなれば吉なり。', meaning:'左の股を傷つけられるが、致命傷ではない段階。すばやく助けに動けば、難を逃れて吉。', advice:'傷を負っても、致命にはなりません。早めに手を打ち、力ある助けを得れば、切り抜けられます。' },
          { text:'明夷、南狩に于いてし、其の大首を得たり。疾く貞にすべからず。', meaning:'暗さの根源（首魁）を討ち取る段階。大本を正せるが、急ぎ過ぎて性急に正してはならない。', advice:'元凶を正す好機でも、性急に事を運ばないこと。大本を断つほど、じっくり構えるのが肝要です。' },
          { text:'左腹に入り、明夷の心を獲、于て門庭を出づ。', meaning:'内側深くに入り込み、暗さの実情を見抜いて、危地を抜け出す段階。早めに離れる。', advice:'内情を見極めたら、深入りせず立ち去ること。危うい場と悟ったら、早めに身を引きましょう。' },
          { text:'箕子の明夷なり。貞しきに利ろし。', meaning:'箕子のように、暗君の傍らで才を隠し正気を守る段階。狂を装ってでも志を保てば利あり。', advice:'暗い状況のただ中でも、内なる正しさは消さないこと。表は控えても、芯を堅く守りましょう。' },
          { text:'明らかならずして晦し。初めには天に登り、後には地に入る。', meaning:'明るさが尽き、闇に落ちる明夷の極み。高みから一転、地に墜ちる暗君の末路の段階。', advice:'明を失って驕り高ぶれば、高みから一気に転落します。光を失わぬよう、最後まで慎むこと。' },
        ] },
  37: { num:37, name:'風火家人', reading:'ふうかかじん',
        judgment:'家人は女の貞に利ろし。',
        summary:'火から風が生まれる、家庭・身内を治めるとき。各々が分を守れば調う。',
        keywords:['家庭','役割','秩序'],
        image:'風、火より出ずるは家人なり。',
        advice:'まず足元の身近な場を整える。それぞれが役割と誠を守ることが、外への力になります。',
        lines:[
          { text:'家を閑ぐ。悔い亡ぶ。', meaning:'家の始めに、けじめと垣根を設けて防ぐ。最初に秩序を立て、悔いを未然に防ぐ段階。', advice:'物事は、始めにきちんと枠組みを作ること。最初にけじめを定めておけば、後の悔いを防げます。' },
          { text:'遂ぐる攸无し。中饋に在り。貞しくして吉。', meaning:'我を張って事を成そうとせず、内を整え養うことに徹する段階。控えめに支えて吉。', advice:'自分の手柄を立てようとせず、内を整え支えること。陰の働きに徹すれば、正しく吉です。' },
          { text:'家人嗃嗃たり。厲を悔ゆれど吉なり。婦子嘻嘻たれば、終には吝なり。', meaning:'厳しすぎる家。とがめは残るが秩序は保たれ吉。逆に締まりなく緩めば、最後は乱れる段階。', advice:'厳しすぎても、けじめがある方がまし。だらしなく甘やかすより、節度を保つ方が結局は良いのです。' },
          { text:'家を富ます。大いに吉なり。', meaning:'家を豊かに富ませる段階。分をわきまえ、内をよく治めて栄えさせる、大いに吉。', advice:'内をよく治めれば、おのずと豊かになります。分を守って足元を固めることが、大きな実りに。' },
          { text:'王、有家に假る。恤うる勿れ。吉なり。', meaning:'王が誠をもって家に臨むように、徳で身近を感化する中心の段階。憂えずとも吉。', advice:'力で従わせず、誠と徳で身近を感化すること。あれこれ心配せずとも、自然と治まり吉です。' },
          { text:'孚有りて威如たれば、終には吉なり。', meaning:'誠を備え、おのずから備わる威厳で締める家人の極み。まず我が身を正して終に吉の段階。', advice:'人を正す前に、まず自分を正すこと。誠から生まれる威厳があれば、最後まで秩序は保たれます。' },
        ] },
  38: { num:38, name:'火澤睽', reading:'かたくけい',
        judgment:'睽は小事に吉。',
        summary:'火は上り澤は下る、そむき合い行き違うとき。大事は難しく、小事なら通る。',
        keywords:['不和','相違','歩み寄り'],
        image:'上は火、下は澤なるは睽なり。',
        advice:'対立を無理に正そうとしない。違いを認めつつ、小さな共通点から歩み寄りましょう。',
        lines:[
          { text:'悔い亡ぶ。馬を喪うも逐う勿れ、自ら復る。悪人を見るも、咎无し。', meaning:'背き合いの始め。逃げた馬は追わずとも自ら戻る。気の合わぬ相手も拒まねば咎なき段階。', advice:'離れたものを無理に追わないこと。縁あるものは自ずと戻ります。合わぬ相手も拒まず接すれば咎なし。' },
          { text:'主に巷に遇う。咎无し。', meaning:'背き合う中、思いがけず路地で味方に出会う段階。略式でも心が通えば、咎はない。', advice:'行き違う時は、格式にこだわらず歩み寄ること。ふとした場で心が通えば、わだかまりは解けます。' },
          { text:'輿の曳かるるを見る。其の牛掣かる。其の人、天られ且つ劓らる。初め无くして終わり有り。', meaning:'車は引き止められ牛も阻まれ、人も傷つく、行き違い極まる段階。始めは苦しいが終わりは結ばれる。', advice:'初めは妨げと誤解ばかりでも、諦めないこと。誠を貫けば、こじれた縁も最後には結ばれます。' },
          { text:'睽れて孤なり。元夫に遇う。交孚す。厲うけれど咎无し。', meaning:'背き合って孤立するが、信ずべき同志に出会い誠を交わす段階。危ういが咎を免れる。', advice:'孤立しても、心を許せる相手は必ずいます。誠を交わせる人と結べば、危うさも越えられます。' },
          { text:'悔い亡ぶ。厥の宗、膚を噬む。往くも何の咎あらん。', meaning:'行き違いが解けていく中心の段階。同志と深く噛み合い結ばれる。進んで何の咎もない。', advice:'心を許せる相手とは、深くまで結べるとき。ためらわず歩み寄れば、わだかまりは消えていきます。' },
          { text:'睽れて孤なり。豕の塗を負い、鬼を一車に載するを見る。先には之が弧を張り、後には之が弧を説く。寇に匪ず、婚媾せんとす。往きて雨に遇えば則ち吉なり。', meaning:'疑心が極まり、泥豚や鬼を見るような妄想に陥る段階。だが誤解が解け、和合の雨に至れば吉。', advice:'疑い出すと、ありもしない敵が見えてきます。相手は寇ではなく縁者。疑いを解けば、和して吉です。' },
        ] },
  39: { num:39, name:'水山蹇', reading:'すいざんけん',
        judgment:'蹇は西南に利ろし。東北に利ろしからず。大人を見るに利ろし。貞しくして吉。',
        summary:'山の上に水、足を引きずる難渋のとき。進めば険しい。助けを得て止まる。',
        keywords:['難渋','障害','助力'],
        image:'山の上に水あるは蹇なり。',
        advice:'独力で押し進まず、いったん退いて賢者の助けを求める。我が身を省みることも大切です。',
        lines:[
          { text:'往けば蹇み、来たれば誉れあり。', meaning:'進めば難渋にはまり、退いて待てば誉れを得る、いちばん下の段階。', advice:'進めば行き詰まる時。無理に前に出ず、いったん退いて時を待つことが、かえって評価されます。' },
          { text:'王臣蹇蹇たり。躬の故に匪ず。', meaning:'王の臣として、我が身の利でなく大義のために難中を尽くす段階。私心なく苦難に当たる。', advice:'困難の中でも、自分の損得でなく為すべき務めのために動くこと。私を捨てた働きは報われます。' },
          { text:'往けば蹇み、来たりて反る。', meaning:'進めば険難、退けば内の味方が喜び迎える段階。下の者の支えとなり踏みとどまる。', advice:'無理に進めば険しいだけ。引き返して、頼ってくる身近な人々を守る方が筋に合います。' },
          { text:'往けば蹇み、来たりて連なる。', meaning:'単独で進めば難渋。退いて同志と連帯し、力を合わせて難に備える段階。', advice:'独りで突破しようとしないこと。いったん退き、信頼できる仲間と手を結んで備えましょう。' },
          { text:'大いに蹇む。朋来たる。', meaning:'難渋の極みにある中心の段階。だがその誠に応じて、助けの友がやって来る。', advice:'大きな困難の只中でも、誠を保てば味方が集まります。独りで抱えず、助けを受け入れること。' },
          { text:'往けば蹇み、来たりて碩いなり。吉なり。大人を見るに利ろし。', meaning:'なお進めば難渋だが、退いて大いに成す蹇の極み。賢者を頼れば吉となる段階。', advice:'最後まで、進むより退いて実を取ること。優れた人の力を借りれば、難局も大きく好転します。' },
        ] },
  40: { num:40, name:'雷水解', reading:'らいすいかい',
        judgment:'解は西南に利ろし。往く攸なければ、其れ來り復って吉。往く攸あれば、夙くして吉。',
        summary:'雷雨が過ぎ、こわばりが解けるとき。問題が緩み、解放へ向かう。',
        keywords:['解放','緩和','赦し'],
        image:'雷雨作るは解なり。',
        advice:'過去の咎は水に流し、こだわりを解く。やるべきことは早めに、寛い心で片づけましょう。',
        lines:[
          { text:'咎无し。', meaning:'険難がほどけ始めるはじめ。柔と剛が応じ合い、静かに身を保てば咎のない段階。', advice:'危機が解け始めた時は、騒がず静かに構えること。穏やかに身を処せば、過ちは生じません。' },
          { text:'田して三狐を獲、黄矢を得たり。貞しくして吉。', meaning:'狩りで三匹の狐を捕らえ黄の矢を得るように、惑わす邪を除き中庸を得る段階。正しく吉。', advice:'物事を惑わす元を、きっぱり取り除くこと。中正を保って邪を払えば、正しく吉になります。' },
          { text:'負い且つ乗る。寇の至るを致す。貞なれども吝なり。', meaning:'荷を背負う身で車に乗る、分不相応な段階。身の程を超えて目立てば、盗賊を招き悔いる。', advice:'分不相応な地位や持ち物は、人の妬みや害を招きます。身の丈に合わぬ振る舞いは控えること。' },
          { text:'而の拇を解く。朋至りて斯に孚あり。', meaning:'足の親指（まとわりつく小人）を切り離す段階。悪縁を解いてこそ、真の友が来て信じ合う。', advice:'馴れ合った悪縁は、思いきって断つこと。離れるべきを離せば、信じ合える仲間が訪れます。' },
          { text:'君子維れ解く有り。吉なり。小人に孚あり。', meaning:'君子が自ら結び目を解く中心の段階。けじめをつければ吉、小人もそれを見て退き改める。', advice:'けじめをつけて、つまらぬ縁を解くこと。あなたが筋を通せば、まわりの者も自ずと退きます。' },
          { text:'公、用て隼を高墉の上に射る。之を獲て、利ろしからざる无し。', meaning:'高い城壁の上の隼を射落とすように、害をなす者を機を見て一挙に除く解の極み。', advice:'害をなす元を、機を逃さず一挙に断つこと。準備を整えて放てば、すべてが好転します。' },
        ] },
  41: { num:41, name:'山澤損', reading:'さんたくそん',
        judgment:'損は孚あれば元いに吉。咎なし。貞しくすべし。往く攸あるに利ろし。',
        summary:'下を減らして上に益す、損なうとき。誠があれば、減らすことが吉となる。',
        keywords:['節減','献身','取捨'],
        image:'山の下に澤あるは損なり。',
        advice:'惜しんで抱えず、いま手放すべきを手放す。怒りを抑え欲を減らすことが、後の益になります。',
        lines:[
          { text:'事を已めて遄かに往く。咎无し。酌んで之を損す。', meaning:'自分の務めを切り上げ、速やかに上を助けに行く段階。減らす度合いをよく量れば咎なし。', advice:'人を助けるなら、潔く早く動くこと。ただし、自分を損なう加減は見極めて、ほどよく。' },
          { text:'貞しきに利ろし。征けば凶なり。損せずして之に益す。', meaning:'正しさを守るのが利、進めば凶。自分を無理に減らさずとも、あるがままで上を益せる段階。', advice:'むやみに自分を削って尽くさないこと。正しさを保ったままでも、人の役には立てます。' },
          { text:'三人行けば則ち一人を損す。一人行けば則ち其の友を得。', meaning:'三人で行けば一人減り、一人で行けば友を得る。多すぎれば割れ、専一なら結ばれる段階。', advice:'関わる相手は、多ければよいわけではありません。心を一つに絞るほど、確かな縁が結ばれます。' },
          { text:'其の疾を損す。遄かにせしむれば喜び有り。咎无し。', meaning:'自分の欠点・わずらいを減らす段階。速やかに改めれば喜びがあり、咎はない。', advice:'直すべき癖や欠点は、早く減らすこと。ぐずぐずせず改めれば、喜ばしい変化が訪れます。' },
          { text:'或いは之を益す。十朋の亀も違うこと克わず。元いに吉なり。', meaning:'思いがけず大いに益される中心の段階。占っても外れぬほどの幸運に恵まれ、大いに吉。', advice:'誠と謙を保てば、思わぬ助けや幸いが集まります。素直に受け取れば、大きな吉になります。' },
          { text:'損せずして之に益す。咎无し。貞しくして吉。往く攸有るに利ろし。臣を得ること家无し。', meaning:'自らを損なわず、かえって広く人を益す損の極み。私を超えて多くに尽くし、人望を得る段階。', advice:'もはや自分を削らずとも、人を潤せるとき。私心を超えて広く尽くせば、垣根なく人が慕います。' },
        ] },
  42: { num:42, name:'風雷益', reading:'ふうらいえき',
        judgment:'益は往く攸あるに利ろし。大川を渉るに利ろし。',
        summary:'上を減らして下に益す、増し加えるとき。動いて事を進めるに利あり。',
        keywords:['増益','成長','善行'],
        image:'風雷あるは益なり。',
        advice:'良いと見たら速やかに行い、過ちは速やかに改める。人を益すれば、めぐって自分も豊かに。',
        lines:[
          { text:'用て大いに作すに利ろし。元いに吉にして咎无し。', meaning:'上から益され、大いに事を起こすにふさわしい始めの段階。大きな成果を上げて咎なし。', advice:'力を貸されているとき。思いきって大きな事に取りかかってよい時です。誠を尽くせば実ります。' },
          { text:'或いは之を益す。十朋の亀も違うこと克わず。永貞なれば吉。王、用て帝に享す。吉なり。', meaning:'思いがけぬ大きな益を受ける段階。占っても外れぬ幸運。長く正しさを保てば吉。', advice:'大きな恵みを受ける時こそ、誠を長く保つこと。謙虚に正しくあれば、その幸運は続きます。' },
          { text:'之を益すに凶事を用う。咎无し。孚ありて中行し、公に告ぐるに圭を用う。', meaning:'凶事・困難の中でこそ益される段階。誠をもって中道を行き、まごころを示せば咎なし。', advice:'苦境さえ、誠実に当たれば糧になります。中道を踏みはずさず、真心を尽くして臨みましょう。' },
          { text:'中行すれば、公に告げて従わる。用て依り遷すに利ろし。', meaning:'中道を歩む者として上に進言し、聞き入れられる段階。大きな移し替えにも頼られる。', advice:'偏らず中道を保てば、あなたの言葉は信用されます。誠実な仲立ちとして、大事を動かせます。' },
          { text:'孚ありて恵む心あり。問うこと勿れ、元いに吉なり。孚ありて我が徳を恵む。', meaning:'まごころから人を恵もうとする中心の段階。問うまでもなく大吉。その誠は人からも返される。', advice:'見返りを問わず、真心から人に与えること。惜しまず恵めば、その徳は巡ってあなたに返ります。' },
          { text:'之を益すこと莫し。或いは之を撃つ。心を立つること恒なし。凶なり。', meaning:'益を求めるばかりで人に与えぬ益の極み。心が定まらず、ついに攻撃を招く凶の段階。', advice:'受け取るばかりで人に与えないと、やがて反発を招きます。心を据え、与える側に回ること。' },
        ] },
  43: { num:43, name:'澤天夬', reading:'たくてんかい',
        judgment:'夬は王庭に揚ぐ。孚ありて号び、厲うきことあり。',
        summary:'澤が天に上り決壊する、決断し断ち切るとき。最後の一陰を退ける危うさを伴う。',
        keywords:['決断','排除','明示'],
        image:'澤、天上に在るは夬なり。',
        advice:'断つべきものは公然と明らかにして断つ。力押しは避け、危うさを心得て慎重に運びましょう。',
        lines:[
          { text:'前趾に壮んなり。往きて勝たざれば、咎と為る。', meaning:'足先から勢いづいて進み出る始め。勝算なく突き進み、しくじれば咎となる段階。', advice:'勢いだけで先走らないこと。勝てる見込みもなく動けば、失敗が責めになります。備えてから。' },
          { text:'惕れて号ぶ。莫夜に戎有るも、恤うる勿れ。', meaning:'警戒を怠らず呼びかける段階。夜に敵が来ても、用心を保っていれば憂えずに済む。', advice:'油断せず、常に備えておくこと。用心を続けていれば、不意の事態にも慌てずに済みます。' },
          { text:'頄に壮んなり。凶有り。君子は夬夬たり。独り行きて雨に遇い、濡るるがごとくにして慍るところ有り。咎无し。', meaning:'顔に怒りを表すほど気負う段階。だが君子は断つべきを断つ。誤解され濡れても、貫けば咎なし。', advice:'気負いを顔に出すと危うい。それでも断つべきは断つこと。一時誤解され孤立しても、咎にはなりません。' },
          { text:'臀に膚无し。其の行くこと次且たり。羊を牽けば悔い亡ぶ。言を聞くも信ぜず。', meaning:'尻の皮がむけ、進むに進めずためらう段階。人に従い引かれれば悔いは消えるが、忠告を聞かぬ。', advice:'焦って進めずもがく時。意地を張らず人に従えば、悔いは消えます。聞く耳を持つことです。' },
          { text:'莧陸夬夬たり。中行すれば咎无し。', meaning:'やわらかな草を断つように、残る邪を毅然と除く中心の段階。中道を保てば咎なし。', advice:'断つべき悪縁は、情に流されず毅然と。ただし行き過ぎず、中道を保てば過ちになりません。' },
          { text:'号ぶこと无し。終に凶有り。', meaning:'助けを呼ぶ声も届かず、最後の一陰が除かれる夬の極み。孤立して終わる凶の段階。', advice:'退くべき時に意地を張れば、誰も助けてくれません。孤立して終わる前に、潔く身を引くこと。' },
        ] },
  44: { num:44, name:'天風姤', reading:'てんぷうこう',
        judgment:'姤は女壮んなり。女を取るに用うる勿れ。',
        summary:'天の下に風、思いがけず出会うとき。一陰が忍び寄る。勢いある誘いには用心。',
        keywords:['遭遇','誘惑','警戒'],
        image:'天の下に風あるは姤なり。',
        advice:'突然の出会いや誘いには、近づきすぎない。小さな兆しのうちに見極め、深入りを避けましょう。',
        lines:[
          { text:'金柅に繋ぐ。貞しくして吉。往く攸有れば、凶を見る。羸豕、孚として蹢躅す。', meaning:'忍び寄る一陰を金の楔で押さえ止める始め。早く食い止めれば吉、放てば凶という段階。', advice:'悪い兆しは、芽のうちに押さえ込むこと。放っておけば広がります。早めに歯止めをかけましょう。' },
          { text:'包に魚有り。咎无し。賓に利ろしからず。', meaning:'包みの中に魚を収め、ひそかに抑え込む段階。自分の手元で制すれば咎なし。広く及ぼすのは不利。', advice:'危うい相手は、自分の手の届く範囲で抑えること。むやみに広げず、内々に収めるのが安全です。' },
          { text:'臀に膚无し。其の行くこと次且たり。厲うけれど、大いなる咎无し。', meaning:'尻の皮がむけて落ち着かず、進みあぐねる段階。危ういが、慎んで動かねば大過には至らぬ。', advice:'落ち着かず焦るときは、無理に動かないこと。じれても踏みとどまれば、大きな失敗は避けられます。' },
          { text:'包に魚无し。凶を起こす。', meaning:'包みから魚が失われる段階。手元の人心が離れ去り、それが災いを引き起こす。', advice:'人を遠ざけ、身近な支えを失わないこと。心が離れていくのを放置すれば、災いの元になります。' },
          { text:'杞を以て瓜を包む。章を含む。天より隕つること有り。', meaning:'高い杞の木で瓜を包むように、徳を内に秘めて下を覆い守る中心の段階。天与の幸いが下る。', advice:'力を誇らず、徳を内に秘めて下を包むこと。誠を尽くして待てば、思わぬ幸いが天から下ります。' },
          { text:'其の角に姤う。吝なり。咎无し。', meaning:'角の先で出会う、よそよそしく高ぶった姤の極み。人と打ち解けられず悔いるが、咎はない段階。', advice:'高慢に構えると、人と通じ合えません。悔いは残っても、害を及ぼさぬよう身を退けば咎なしです。' },
        ] },
  45: { num:45, name:'澤地萃', reading:'たくちすい',
        judgment:'萃は亨る。王有廟に假る。大人を見るに利ろし。亨る。貞しきに利ろし。',
        summary:'澤が地に集まる、人や物が集うとき。中心と誠があれば、よく集まり通る。',
        keywords:['集合','団結','求心'],
        image:'澤、地上に在るは萃なり。',
        advice:'人が集まるときこそ、不測に備える。正しい中心のもとに、誠をもって結束しましょう。',
        lines:[
          { text:'孚有れども終わらず。乃ち乱れ乃ち萃まる。号べば、一握りに笑いと為る。恤うる勿れ。往きて咎无し。', meaning:'集まろうとする誠が揺らぎ、迷い乱れる始め。心を定めて呼びかければ、笑いに変わる段階。', advice:'集う心が揺らいでも、迷わず本来の相手に呼びかけること。一度心を決めれば、わだかまりは解けます。' },
          { text:'引かれて吉。咎无し。孚なれば乃ち禴を用うるに利ろし。', meaning:'誠ある相手に引かれて、自然に集い結ばれる段階。質素な真心の供えでも通じ、吉。', advice:'信ずる相手に素直に引かれて結ぶこと。飾らずとも、まごころさえあれば、十分に通じ合えます。' },
          { text:'萃如たり嗟如たり。利ろしき攸无し。往けば咎无し。小しく吝なり。', meaning:'集まりたいのに応じる相手がなく、嘆く段階。当ては外れるが、上に進み結べば咎は小さい。', advice:'仲間に入れず嘆くこともあります。それでも、進んで上の人に近づけば道は開けます。少しの悔いで済みます。' },
          { text:'大いに吉にして咎无し。', meaning:'多くの人を集めまとめる要の段階。私心なく公のために尽くせば、大いに吉で咎もない。', advice:'人を集める立場では、私利を捨てること。公のためにまとめれば、大いにうまく運びます。' },
          { text:'萃まるに位有り。咎无し。孚とせられず。元永貞なれば、悔い亡ぶ。', meaning:'正しい地位のもとに人を集める中心の段階。まだ信を得きらぬ者には、長く誠を保てば悔い消ゆ。', advice:'地位だけでは人の心は集まりません。長く変わらぬ誠を示し続ければ、疑う者も従い、悔いは消えます。' },
          { text:'齎咨涕洟す。咎无し。', meaning:'集いに加われず、嘆き涙する萃の極み。孤立を憂え深く反省すれば、咎を免れる段階。', advice:'仲間に入れず心細い時もあります。嘆くだけで終えず、わが身を省みて改めれば、咎にはなりません。' },
        ] },
  46: { num:46, name:'地風升', reading:'ちふうしょう',
        judgment:'升は元いに亨る。大人を見るに用う。恤うる勿れ。南征すれば吉。',
        summary:'地中から木が伸びる、昇り進むとき。順を追って上れば、大いに通る。',
        keywords:['上昇','成長','着実'],
        image:'地の中に木生ずるは升なり。',
        advice:'一足飛びを狙わず、一歩ずつ積み上げる。恐れず、信頼できる人を頼って進みましょう。',
        lines:[
          { text:'允かに升る。大いに吉なり。', meaning:'下にありながら、上に信じられて素直に昇り始める段階。信を得て伸びる、大いに吉。', advice:'出だしは、信頼に素直に従って昇ること。背伸びせず、引き上げてくれる人に応えれば大吉です。' },
          { text:'孚なれば乃ち禴を用うるに利ろし。咎无し。', meaning:'質素でも誠さえあれば通じる段階。飾らぬ真心で上と結べば、咎のない昇りの段階。', advice:'立派な体裁より、まごころ。飾らずとも誠実であれば上に通じ、咎なく進んでいけます。' },
          { text:'虚邑に升る。', meaning:'人のいない邑に入るように、障りなくすらすらと昇り進む段階。妨げなく上がっていく。', advice:'流れが妨げなく開けるとき。勢いに乗って進んでよい時ですが、空虚に流されぬよう中身も保って。' },
          { text:'王、用て岐山に亨す。吉にして咎无し。', meaning:'王が聖山に誠を捧げるように、へりくだって上に従い順う段階。吉にして咎なし。', advice:'昇っても、驕らず上に誠を尽くすこと。へりくだって順う姿勢を保てば、吉であり過ちもありません。' },
          { text:'貞しくして吉。階を升る。', meaning:'正しさを保ち、階段を一段ずつ着実に昇る中心の段階。順を踏んで高みに至り吉。', advice:'一気に飛ばず、段を一つずつ昇ること。正しい順序を守って進めば、確かに高みに届きます。' },
          { text:'冥升なり。息まざるの貞に利ろし。', meaning:'暗がりをなお昇り続ける升の極み。止め時を失う危うさだが、内なる修養に向ければ利ある段階。', advice:'いつまでも上を求め続けないこと。外への上昇は止め時を。力を内なる研鑽に向ければ、なお益があります。' },
        ] },
  47: { num:47, name:'澤水困', reading:'たくすいこん',
        judgment:'困は亨る。貞しくして大人は吉。咎なし。言ありて信ぜられず。',
        summary:'澤の水が漏れ尽きる、行き詰まり苦しむとき。言葉が通じにくい。耐えて通す。',
        keywords:['困窮','逆境','節操'],
        image:'澤に水なきは困なり。',
        advice:'弁解しても伝わりにくい時。言葉より行いで示し、志を曲げずに苦境を耐えましょう。',
        lines:[
          { text:'臀、株木に困しむ。幽谷に入り、三歳まで覿えず。', meaning:'切り株に腰かけて苦しむように、出口の見えぬ谷に入り込む、困窮の始まりの段階。', advice:'行き詰まりの底にいる時。あがいても深みにはまるだけ。今は身を潜め、時が変わるのを待つこと。' },
          { text:'酒食に困しむ。朱紱方に来たる。用て享祀するに利ろし。征けば凶なり。咎无し。', meaning:'酒食に不自由する困窮の中、上からの招き（朱紱）が来かける段階。動けば凶、誠を保てば咎なし。', advice:'苦しい時に、好機の兆しが訪れることもあります。焦って動かず、誠を尽くして待てば咎なしです。' },
          { text:'石に困しみ、蒺藜に拠る。其の宮に入りて、其の妻を見ず。凶なり。', meaning:'石に阻まれ茨に拠る、進退きわまる段階。帰っても頼る妻に会えぬ、寄る辺なき凶。', advice:'進めば固い壁、退けば茨。無理に動けばどこにも安らげません。身動きの取れぬ時は、じっと耐えること。' },
          { text:'来たること徐徐たり。金車に困しむ。吝なれど、終わり有り。', meaning:'助けに向かうのが遅れ、金の車（地位ある障り）に阻まれる段階。悔いはあるが、終には結ばれる。', advice:'助けたい相手のもとへ進むのが遅れても、諦めないこと。妨げに手こずっても、最後にはつながります。' },
          { text:'劓られ刖らる。赤紱に困しむ。乃ち徐ろに説び有り。用て祭祀するに利ろし。', meaning:'上下から傷つけられ、高位ゆえに苦しむ中心の段階。やがて徐々に救いが来る。誠を尽くせば吉。', advice:'高い立場ゆえの苦しみもあります。焦らず誠を尽くしていれば、救いはゆっくりと訪れます。' },
          { text:'葛藟に困しみ、臲卼たり。動けば悔い有りと曰う。悔ゆる有れば、征きて吉なり。', meaning:'蔓草に絡まれ、ぐらつき揺れる困の極み。動けば悔いると思い込むが、悔い改めて動けば吉の段階。', advice:'もう動けないと思い込まないこと。絡まりも、改める覚悟で踏み出せば解けます。困窮を抜ける時です。' },
        ] },
  48: { num:48, name:'水風井', reading:'すいふうせい',
        judgment:'井は邑を改めて井を改めず。喪なく得なし。往來井井たり。',
        summary:'井戸のように、変わらず人を養うとき。場所は変われど、井戸の徳は変わらない。',
        keywords:['不変の徳','供給','養い'],
        image:'木の上に水あるは井なり。',
        advice:'変わらず人の役に立つ働きを保つ。私を満たすより、誰かを潤す泉であろうとしましょう。',
        lines:[
          { text:'井泥みて食らわれず。旧井に禽无し。', meaning:'井戸の底が泥み、飲めず、古井戸には鳥も寄らぬ段階。荒れて用をなさない、いちばん下。', advice:'自分を荒れたままにしないこと。手入れを怠れば、人も寄りません。まず己を澄ませることから。' },
          { text:'井、谷ぎて鮒に射ぐ。甕敝れて漏る。', meaning:'澄んだ水が下の小魚にしか及ばず、汲む甕も壊れて漏れる段階。徳はあれど活かされぬ。', advice:'良い力があっても、用いる手立てがなければ漏れていきます。小さく使い捨てず、活かす器を整えること。' },
          { text:'井渫えども食らわれず。我が心の惻みと為す。用て汲むべし。王明らかなれば、並びに其の福を受く。', meaning:'井戸を浚っても汲まれない段階。澄んだ才が用いられず惜しまれる。上が明なら共に福を受ける。', advice:'力を磨いても、まだ認められないことがあります。腐らず澄んでいれば、見る目ある人に必ず汲まれます。' },
          { text:'井甃む。咎无し。', meaning:'井戸の内壁を石で整え修める段階。今は人を潤さずとも、自らを整えるに専心して咎なし。', advice:'動けない時期は、自分の土台を整えること。内を修めておけば、いずれ人を潤す力になります。咎なし。' },
          { text:'井冽くして寒泉食らわる。', meaning:'井戸の水が清く澄み、冷たい泉として皆に飲まれる中心の段階。徳が広く人に行き渡る。', advice:'澄んだ力は、おのずと人に求められます。私を満たすより、惜しみなく人を潤す泉であること。' },
          { text:'井収めて幕う勿れ。孚有りて元いに吉なり。', meaning:'汲み上げた井戸に蓋をせず、誰にでも開く井の極み。誠をもって広く施し、大いに吉の段階。', advice:'得たものに蓋をしないこと。誰にでも開いて惜しみなく分かち合えば、誠が通じて大きな吉となります。' },
        ] },
  49: { num:49, name:'澤火革', reading:'たくかかく',
        judgment:'革は已の日にして乃ち孚あり。元いに亨る。貞しきに利ろし。悔い亡ぶ。',
        summary:'澤と火が相せめぐ、革まり改めるとき。時が満ちて信を得れば、悔いは消える。',
        keywords:['変革','刷新','改める'],
        image:'澤の中に火あるは革なり。',
        advice:'機が熟すのを待ってから改める。私情でなく道理で変えれば、人は信じ、悔いは残りません。',
        lines:[
          { text:'鞏むるに黄牛の革を用う。', meaning:'黄牛の革で固く縛るように、まだ動かず堅く守る改革の始め。時が来ていない段階。', advice:'変えたくとも、まだその時ではありません。軽々しく動かず、固く身を守って機を待つこと。' },
          { text:'已の日にして乃ち之を革む。征けば吉にして咎无し。', meaning:'時が満ちて、いよいよ改める段階。機が熟してから動けば、進んで吉、咎もない。', advice:'機が熟したと見極めたら、思いきって改めること。時を待って動けば、進んで吉になります。' },
          { text:'征けば凶なり。貞なれども厲うし。革言三たび就れば、孚あり。', meaning:'急いで改めれば凶、危うい段階。変革の議論を三度重ね、衆議が定まってこそ信を得る。', advice:'焦って変えれば失敗します。何度も議を尽くし、周りの納得が固まってから動くこと。拙速は禁物です。' },
          { text:'悔い亡ぶ。孚有りて命を改む。吉なり。', meaning:'悔いの消える段階。誠が満ち、信を得て根本（命）を改める。時宜にかなった変革で吉。', advice:'周りの信を得てから、根本を変えること。誠が伴った改革は人に受け入れられ、吉となります。' },
          { text:'大人虎変す。未だ占わずして孚あり。', meaning:'大人が虎の毛が美しく変わるように、鮮やかに改める中心の段階。占うまでもなく信を得る。', advice:'改めるなら、虎の毛変わりのように堂々と鮮やかに。筋の通った変革は、誰の目にも明らかに信を得ます。' },
          { text:'君子豹変す。小人は面を革む。征けば凶なり。居て貞なれば吉。', meaning:'君子は豹の斑のように細部まで改め、小人は顔つきだけ従う革の極み。なお進めば凶、留まれば吉。', advice:'大きな変革の後は、これ以上を求めないこと。表面だけの追従に深追いせず、落ち着いて保てば吉です。' },
        ] },
  50: { num:50, name:'火風鼎', reading:'かふうてい',
        judgment:'鼎は元いに吉、亨る。',
        summary:'食をととのえる鼎の象。新しきを煮て養い、立て直すとき。大いに吉。',
        keywords:['革新','滋養','安定'],
        image:'木の上に火あるは鼎なり。',
        advice:'古いものを革めた後は、丁寧に新しい形を整え養う。賢い人を養い用いるのが吉です。',
        lines:[
          { text:'鼎、趾を顛にす。否を出すに利ろし。妾を得て其の子を以にす。咎无し。', meaning:'鼎をひっくり返して古い澱を出すように、まず汚れを払う始めの段階。下のものでも用いて咎なし。', advice:'新しく始める前に、まず古い澱みを出すこと。低い所のものでも、役立つなら用いれば過ちなしです。' },
          { text:'鼎、実有り。我が仇に疾有り。我に即くこと能わず。吉なり。', meaning:'鼎に中身が満ちる充実の段階。妬む相手も近づけず、中身を守り通せて吉。', advice:'中身が充実している時。妬みや横やりには近づけさせず、慎んで実を守れば、吉を保てます。' },
          { text:'鼎、耳革まり、其の行塞がる。雉の膏食らわれず。方に雨ふりて悔いを虧き、終には吉なり。', meaning:'鼎の耳が変わり持ち運べず、ごちそうが食べられぬ段階。だが時が和し、終には用いられて吉。', advice:'良いものを持ちながら、当面用いられないことも。腐らず待てば、わだかまりは雨のように晴れ、終に吉です。' },
          { text:'鼎、足を折る。公の餗を覆す。其の形渥たり。凶なり。', meaning:'鼎の足が折れて中身をぶちまける段階。荷に耐えぬ者が重任を担い、大失敗する凶。', advice:'力量を超えた重荷を、無理に引き受けないこと。支えきれぬ任を負えば、台無しにしてしまいます。' },
          { text:'鼎、黄耳金鉉なり。貞しきに利ろし。', meaning:'鼎に黄金の耳と取っ手が備わる中心の段階。中庸と剛健を兼ね、よく中身を担い動かせる。', advice:'中庸を保ちつつ、頼れる支え（人や手立て）を備えること。柔と剛がそろえば、大事をよく担えます。' },
          { text:'鼎、玉鉉なり。大いに吉にして利ろしからざる无し。', meaning:'鼎に玉の取っ手が備わる鼎の極み。剛と温潤を兼ね、調和の極まる、大いに吉の段階。', advice:'強さに温かさを兼ねるとき、すべてが整います。剛さを玉のように和らげれば、何事もうまく運びます。' },
        ] },
  51: { num:51, name:'震為雷', reading:'しんいらい',
        judgment:'震は亨る。震來りて虩虩たり。笑言啞啞たり。震百里を驚かす。',
        summary:'雷が重なり轟く、衝撃と発奮のとき。驚いても動じず保てば通る。',
        keywords:['衝撃','発奮','畏れ'],
        image:'洊雷は震なり。',
        advice:'突然の衝撃に慌てない。畏れを己を省みる機とし、肝心の物を取り落とさず構えましょう。',
        lines:[
          { text:'震來りて虩虩たり。後に笑言啞啞たり。吉なり。', meaning:'雷鳴に驚き怖れるが、慎みを学んで後に和らぎ笑える段階。畏れを糧にできる、吉の始め。', advice:'突然の衝撃に、まず身を慎むこと。畏れを学びに変えられれば、後で笑って振り返れます。' },
          { text:'震來りて厲うし。億ばくの貝を喪う。九陵に躋る。逐う勿れ、七日にして得ん。', meaning:'激しい衝撃で大事な財を失う段階。高みに逃れ、追わずに待てば、やがて自ずと取り戻せる。', advice:'急変で失っても、慌てて追わないこと。身の安全をまず確保し、時を待てば、失せ物は戻ってきます。' },
          { text:'震蘇蘇たり。震うて行けば眚无し。', meaning:'雷に脅えて落ち着かぬ段階。だがその畏れに促されて慎んで動けば、災いを免れる。', advice:'不安でそわそわする時。脅えを戒めに変え、慎重に動くこと。畏れを糧にすれば、災いは避けられます。' },
          { text:'震、遂に泥む。', meaning:'衝撃の中で泥にはまり込み、奮い立てず沈滞する段階。剛が陰に挟まれ動けない。', advice:'衝撃に飲まれて動けなくなる時。泥に沈むように停滞しがち。まず足場を抜くことに力を注ぐこと。' },
          { text:'震、往來すること厲うし。億ばくに喪うこと无し。事有り。', meaning:'衝撃が行き来して危うい中心の段階。だが中を守れば失うものはなく、為すべき務めは保てる。', advice:'上下に揺さぶられて危うくとも、中心を失わないこと。芯を保てば失うものはなく、務めは果たせます。' },
          { text:'震、索索たり。視ること矍矍たり。征けば凶なり。震、其の躬に于いてせずして、其の隣に于いてす。咎无し。婚媾に言有り。', meaning:'衝撃に怯えきり、目をきょろつかせる震の極み。動けば凶。だが他人の災いを見て早く戒めれば咎なし。', advice:'恐れに我を失う時は、動かないこと。人の身に起きた異変を見て、早めに自ら戒めれば、難は免れます。' },
        ] },
  52: { num:52, name:'艮為山', reading:'ごんいさん',
        judgment:'艮は其の背に艮まる。其の身を獲ず。其の庭に行きて其の人を見ず。咎なし。',
        summary:'山が重なり動かぬ、止まるとき。止まるべきところに止まれば、咎はない。',
        keywords:['静止','抑制','安定'],
        image:'兼山は艮なり。',
        advice:'動くべきでない時は、きっぱり止まる。雑念に揺れず、いまここに心を静めましょう。',
        lines:[
          { text:'其の趾に艮まる。咎无し。永貞に利ろし。', meaning:'足の段階で早くも止まる。動き出す前に踏みとどまれば、咎なき止まりの始め。', advice:'動き出す前に止まれるなら、過ちは生じません。最初の一歩を慎み、長く正しさを保つこと。' },
          { text:'其の腓に艮まる。其の随うを拯わず。其の心快からず。', meaning:'ふくらはぎで止まる段階。上に従って動かざるを得ず、思うように救えず、心が晴れない。', advice:'自分の意に反して止められ、もどかしい時。逆らえぬ流れもあります。心が晴れずとも、今は従うこと。' },
          { text:'其の限に艮まる。其の夤を列く。厲うくして心を薫く。', meaning:'腰で無理に断ち止める段階。上下を裂くように強いて止め、危うく心を焦がす。', advice:'無理やり断ち切ろうとすると、かえって身を引き裂きます。力ずくの抑制は危険。自然な止め方を探ること。' },
          { text:'其の身に艮まる。咎无し。', meaning:'我が身全体を静かに止める段階。私欲を抑え、おのれを安んじて保てば、咎はない。', advice:'まず自分自身を静めること。心と身を落ち着けて止まれば、波風は立たず、過ちもありません。' },
          { text:'其の輔に艮まる。言、序有り。悔い亡ぶ。', meaning:'あご（口）を慎んで止める中心の段階。言葉に筋目を保てば、口の過ちが消えていく。', advice:'言葉を慎み、筋道立てて話すこと。軽々しい一言を止めれば、後の悔いはなくなります。' },
          { text:'敦く艮まる。吉なり。', meaning:'手厚く誠実に、終わりまで止まるべきに止まる艮の極み。静止を全うして吉の段階。', advice:'最後まで、止まるべき所にしっかり止まること。篤実に踏みとどまる落ち着きが、吉を呼びます。' },
        ] },
  53: { num:53, name:'風山漸', reading:'ふうざんぜん',
        judgment:'漸は女の帰ぐに吉。貞しきに利ろし。',
        summary:'山の上に木、少しずつ進むとき。順序を踏んで漸進すれば吉。',
        keywords:['漸進','順序','着実'],
        image:'山の上に木あるは漸なり。',
        advice:'近道や飛躍を狙わず、段階を踏む。正しい手順を守って進めば、確かに実ります。',
        lines:[
          { text:'鴻、干に漸む。小子厲うし。言有れど、咎无し。', meaning:'渡り鳥が水際に進み着く始め。未熟な身には危うく、とがめの声もあるが、咎には至らぬ段階。', advice:'物事の入り口では、危うさも陰口もつきもの。慎んで一歩ずつ進めば、責められても咎にはなりません。' },
          { text:'鴻、磐に漸む。飲食衎衎たり。吉なり。', meaning:'鳥が安らかな岩場に進む段階。落ち着いて飲食を楽しむ、安定した進みの吉。', advice:'足場が定まったら、安んじて英気を養うこと。仲間と和やかに過ごせる、穏やかで吉な時です。' },
          { text:'鴻、陸に漸む。夫征けば復らず。婦孕めども育てず。凶なり。寇を禦ぐに利ろし。', meaning:'高地に進みすぎる段階。順序を外れて突出すれば、夫は帰らず妻は育てぬような凶。守りには利あり。', advice:'順序を飛ばして突出すると、孤立して危うい。攻めるより守りを固め、仲間との和を保つこと。' },
          { text:'鴻、木に漸む。或いは其の桷を得。咎无し。', meaning:'水鳥が止まりにくい木に進む段階。だが平らな枝を得るように、危うい中で安住を見出し咎なし。', advice:'居心地の悪い場でも、落ち着ける足場を探すこと。柔順に身を処せば、不慣れな所でも咎なく過ごせます。' },
          { text:'鴻、陵に漸む。婦三歳まで孕まず。終に之に勝つこと莫し。吉なり。', meaning:'鳥が高い丘に進む中心の段階。隔てられて久しく結ばれずとも、誰にも妨げられず終に結ばれ吉。', advice:'妨げや行き違いで時がかかっても、正しい縁は誰にも崩せません。順を踏んで待てば、必ず結ばれます。' },
          { text:'鴻、陸に漸む。其の羽、用て儀と為すべし。吉なり。', meaning:'鳥が高みに進み着き、その羽が手本・飾りとなる漸の極み。順を全うし、人の模範となる吉の段階。', advice:'順序を踏んで高みに至れば、その姿が人の手本になります。最後まで筋を通せば、徳が形に表れ吉です。' },
        ] },
  54: { num:54, name:'雷澤帰妹', reading:'らいたくきまい',
        judgment:'帰妹は征けば凶。利ろしき攸なし。',
        summary:'澤の上に雷、順を外れて嫁ぐ象。情に任せて進めば凶。立場をわきまえるとき。',
        keywords:['不正規','分を守る','慎み'],
        image:'澤の上に雷あるは帰妹なり。',
        advice:'勢いや情だけで踏み込まない。終わりの乱れを見越し、自分の立場と節度を守りましょう。',
        lines:[
          { text:'妹を帰がしむに娣を以てす。跛にして能く履む。征けば吉なり。', meaning:'正妻でなく添い添えとして嫁ぐ始め。低い立場でも、分を守って務めれば進んで吉の段階。', advice:'主役でなく脇の立場でも、分をわきまえて尽くすこと。控えめに役割を果たせば、進んで吉です。' },
          { text:'眇にして能く視る。幽人の貞に利ろし。', meaning:'片目でもよく見るように、不遇でも内に明を保つ段階。人目につかず静かに正しくあれば利あり。', advice:'恵まれぬ立場でも、見るべきを見失わないこと。表に出ず、静かに正しさを守るのが今は利になります。' },
          { text:'妹を帰がしむに須ちて、反りて娣を以てす。', meaning:'高望みして時を待つうち、かえって添い添えに格下げされる段階。分を超えた望みがしぼむ。', advice:'高望みして時機を逃さないこと。身の丈を超えた望みに固執すると、かえって立場を落とします。' },
          { text:'妹を帰がしむに期を愆る。帰ぐを遅らするに時有り。', meaning:'嫁ぐ時期を過ぎても、あえて待つ段階。安売りせず、ふさわしい時と相手を待てば、なお時は来る。', advice:'焦って妥協しないこと。良い時・良い縁を待つために遅れるのは、むしろ賢い選択です。' },
          { text:'帝乙、妹を帰がしむ。其の君の袂は、其の娣の袂の良きに如かず。月、望に幾ければ吉なり。', meaning:'高貴な身でありながら、装いを誇らず質素に嫁ぐ中心の段階。満月手前のように、控えめさで吉。', advice:'立場が上でも、飾りを誇らず内実を尊ぶこと。へりくだった慎ましさが、満ちすぎぬ吉を保ちます。' },
          { text:'女、筐を承くるも実无し。士、羊を刲くも血无し。利ろしき攸无し。', meaning:'中身のない筐を捧げ、血の出ぬ羊を割く、形だけの帰妹の極み。実を欠き、何の益もない段階。', advice:'形式や見せかけだけで事を運ばないこと。中身の伴わない約束や儀礼は、何も実を結びません。' },
        ] },
  55: { num:55, name:'雷火豊', reading:'らいかほう',
        judgment:'豊は亨る。王之に假る。憂うる勿れ。日中に宜し。',
        summary:'雷と火が盛んな、豊かさの極みのとき。盛りは美しいが、やがて傾く。',
        keywords:['隆盛','充実','陰り'],
        image:'雷電みな至るは豊なり。',
        advice:'満ちた今を楽しみつつ、傾きを恐れず手を打つ。日中の盛りのうちに、実を収めましょう。',
        lines:[
          { text:'其の配主に遇う。旬なれども咎无し。往けば尚ばるること有り。', meaning:'豊かさの始め、対等の相手に出会う。互いに均しく釣り合い、咎なく、進めば称えられる段階。', advice:'対等に補い合える相手を得たら、ともに進むこと。釣り合う者と手を結べば、咎なく称えられます。' },
          { text:'其の蔀を豊かにす。日中に斗を見る。往けば疑疾を得。孚有りて発若たれば吉なり。', meaning:'覆いが厚く、真昼に北斗が見えるほど暗む段階。進めば疑われるが、誠で心を開けば吉。', advice:'才を覆い隠され、誤解される時。動いて疑いを買うより、まごころを尽くして信を通わせれば吉です。' },
          { text:'其の沛を豊かにす。日中に沫を見る。其の右肱を折る。咎无し。', meaning:'覆いがさらに厚く、真昼に小星が見える段階。右腕を折るように頼りを失うが、無理せねば咎なし。', advice:'頼みの支えを失い、力を出せない時。大事を成そうと無理をしないこと。控えていれば、咎にはなりません。' },
          { text:'其の蔀を豊かにす。日中に斗を見る。其の夷主に遇う。吉なり。', meaning:'なお暗さの中だが、対等の同志に巡り合う段階。覆いを破る助けを得て、吉に転じる。', advice:'暗がりの中でも、対等に結べる相手は現れます。心を合わせられる人と組めば、道が開けて吉です。' },
          { text:'章を来たす。慶誉有り。吉なり。', meaning:'隠れていた才ある者を招き寄せる中心の段階。賢を用いて明を取り戻し、慶びと誉れを得て吉。', advice:'優れた人を招き、その才を用いること。明るい力を集めれば、慶びと評判が伴い、吉になります。' },
          { text:'其の屋を豊かにす。其の家を蔀う。其の戸を闚えば、闃として其れ人无し。三歳まで覿えず。凶なり。', meaning:'家を立派にしすぎて覆い隠し、人気が絶える豊の極み。盛りに驕り孤立する、凶の段階。', advice:'豊かさを誇って囲い込めば、人が離れていきます。驕りで孤立する前に、開いて分かち合うこと。' },
        ] },
  56: { num:56, name:'火山旅', reading:'かざんりょ',
        judgment:'旅は小しく亨る。旅は貞しくして吉。',
        summary:'山の上に火、留まらず移ろう旅のとき。寄る辺なき身。慎めば小さく通る。',
        keywords:['旅','不安定','慎み'],
        image:'山の上に火あるは旅なり。',
        advice:'よそ者の自覚をもち、控えめに振る舞う。出過ぎず、信用を一つずつ積みましょう。',
        lines:[
          { text:'旅、瑣瑣たり。斯れ其の災を取る所なり。', meaning:'旅の身でつまらぬ事にこせつく始め。卑屈に小利を求め、自ら災いを招く段階。', advice:'不慣れな場で、せこく振る舞わないこと。小さな利にこだわると、かえって災いを引き寄せます。' },
          { text:'旅、次に即く。其の資を懐にし、童僕の貞を得たり。', meaning:'旅で落ち着ける宿を得て、路銀を持ち、忠実な従者にも恵まれる段階。寄る辺を得て安らぐ。', advice:'慎ましく身を処せば、よそでも落ち着き先と支えが得られます。誠実さが、信頼できる味方を呼びます。' },
          { text:'旅、其の次を焚く。其の童僕の貞を喪う。厲うし。', meaning:'旅先で宿を焼き、忠実な従者まで失う段階。高ぶり過ぎて寄る辺と信を失う、危うい段階。', advice:'よその地で、出過ぎたり高ぶったりしないこと。傲慢は居場所も味方も失わせます。控えめが身を守ります。' },
          { text:'旅、于に処る。其の資斧を得たり。我が心快からず。', meaning:'仮の落ち着き先と路銀・斧（手立て）を得る段階。一応安んじるが、本拠でなく心は晴れない。', advice:'当座の足場と手立ては得ても、仮住まいと心得ること。安住しきらず、まだ気を緩めないことです。' },
          { text:'雉を射て一矢にして亡う。終に以て誉れあり命あり。', meaning:'雉を射て一矢は失うが獲物は得る中心の段階。小さな代償で信を得、ついに誉れと地位を得る。', advice:'多少の持ち出しを惜しまず、誠と才を示すこと。小さな犠牲が、よその地での評判と引き立てを呼びます。' },
          { text:'鳥、其の巣を焚く。旅人、先には笑い、後には號咷す。牛を易に喪う。凶なり。', meaning:'鳥が巣を焼かれるように、高みで驕った旅の極み。先に笑い後に泣き、柔順さを失って凶の段階。', advice:'よその地で高みに登り、驕り高ぶらないこと。先の笑いが後の涙に。柔らかさを失えば、寄る辺を焼きます。' },
        ] },
  57: { num:57, name:'巽為風', reading:'そんいふう',
        judgment:'巽は小しく亨る。往く攸あるに利ろし。大人を見るに利ろし。',
        summary:'風が重なり、すみずみに入り込むとき。へりくだり従えば、小さく通る。',
        keywords:['浸透','柔順','順応'],
        image:'隨風は巽なり。',
        advice:'押さず、風のようにじわり浸透させる。低く入り込み、信頼できる人に従って進めましょう。',
        lines:[
          { text:'進退す。武人の貞に利ろし。', meaning:'風のように、進むか退くか定まらず迷う始め。優柔の段階。武人のような決断と正しさが要る。', advice:'柔順も過ぎれば、ぐらつき迷いになります。へりくだりつつも、芯の決断は持つこと。' },
          { text:'牀下に巽う。史巫を用うること紛若たれば、吉にして咎无し。', meaning:'寝台の下までへりくだり伏す段階。度を越えた卑下だが、誠を尽くして祈るほどに通じれば吉。', advice:'へりくだりすぎるほどでも、誠を込めれば通じます。低く出ても、真心を尽くせば吉で咎なしです。' },
          { text:'頻りに巽う。吝なり。', meaning:'何度もためらい従い直す段階。決めきれず、しぶしぶ繰り返し従って悔いる。', advice:'いやいや従い直すのを繰り返さないこと。決断できず迷い続けると、悔いだけが残ります。' },
          { text:'悔い亡ぶ。田して三品を獲。', meaning:'悔いの消える段階。柔順に従いつつ功を立て、狩りで三種の獲物を得るように、よく成果を上げる。', advice:'へりくだりと働きを兼ねれば、悔いは消えます。低く構えつつ実を上げれば、十分な成果が得られます。' },
          { text:'貞しくして吉。悔い亡ぶ。利ろしからざる无し。初め无くして終わり有り。庚に先だつこと三日、庚に後るること三日なれば吉なり。', meaning:'正しさを保ち、よく改め命じる中心の段階。始めは整わずとも終には成る。前後をよく慮れば吉。', advice:'物事を改め命じるなら、前後をよく考え、念入りに。始め手間取っても、丁寧に運べば終に吉です。' },
          { text:'牀下に巽う。其の資斧を喪う。貞なれども凶なり。', meaning:'寝台の下まで卑下しきり、断つべき力（斧）まで失う巽の極み。へつらい過ぎて自立を失う凶の段階。', advice:'へりくだりも度を越せば、決断力と元手まで失います。従うばかりで芯を失わないこと。' },
        ] },
  58: { num:58, name:'兌為澤', reading:'だいたく',
        judgment:'兌は亨る。貞しきに利ろし。',
        summary:'澤が連なり、よろこび語らうとき。和やかさで通るが、正しさを失わぬこと。',
        keywords:['悦び','交流','和'],
        image:'麗澤は兌なり。',
        advice:'人と和み、励まし合う。ただし口先のおもねりに流れず、誠あるよろこびを保ちましょう。',
        lines:[
          { text:'和らぎて兌ぶ。吉なり。', meaning:'私心なく、和やかに人と喜び合う始め。誰にもおもねらず、穏やかに通じ合って吉の段階。', advice:'飾らず、和やかに人と接すること。へつらいもなく素直に喜び合えば、それがそのまま吉です。' },
          { text:'孚ありて兌ぶ。吉なり。悔い亡ぶ。', meaning:'まことをもって喜び合う段階。誠が伴うから、悦びに溺れず、悔いも消えて吉。', advice:'喜びは、誠を土台にすること。まごころのある楽しみなら、流されず、悔いも残りません。' },
          { text:'来たり兌ぶ。凶なり。', meaning:'こちらから取り入り、媚びて喜ばせようとする段階。誠を欠いたおもねりは凶を招く。', advice:'喜ばれたくて、媚びへつらわないこと。中身のない愛想は、かえって信を失います。' },
          { text:'商り兌ぶ。未だ寧からず。介疾なれば喜び有り。', meaning:'どちらの悦びに付くか思案して定まらぬ段階。きっぱり邪を退け善に付けば、喜びが来る。', advice:'心地よい誘いと正道の間で迷う時。きっぱり害となる方を断てば、迷いが晴れて喜びが訪れます。' },
          { text:'剝に孚あり。厲うきこと有り。', meaning:'削り取ろうとする小人を信じてしまう中心の段階。甘い相手を信じすぎれば、危うさが潜む。', advice:'心地よく取り入る相手ほど、警戒すること。甘い言葉に気を許しすぎると、足をすくわれます。' },
          { text:'引きて兌ぶ。', meaning:'人を引き込んで悦びにふけろうとする兌の極み。果てなく快を求め、定まりを欠く段階。', advice:'楽しみを際限なく引き延ばさないこと。快に人を巻き込み溺れる前に、けじめをつけましょう。' },
        ] },
  59: { num:59, name:'風水渙', reading:'ふうすいかん',
        judgment:'渙は亨る。王有廟に假る。大川を渉るに利ろし。貞しきに利ろし。',
        summary:'風が水を散らす、こわばりが解け散るとき。滞りをほどき、人心を集め直す。',
        keywords:['発散','離散','再結集'],
        image:'風、水上を行くは渙なり。',
        advice:'凝り固まったものをいったんほどく。散らした後は、大義のもとに人心を結び直しましょう。',
        lines:[
          { text:'用て拯うに馬壮んなれば吉なり。', meaning:'散り始めの初め。力ある助け（壮んな馬）を頼り、早めに手を打てば、離散を防げて吉の段階。', advice:'ほどけ始めの兆しは、早く手当てすること。力ある助けを借りて初動を押さえれば、吉になります。' },
          { text:'渙るとき其の机に奔る。悔い亡ぶ。', meaning:'散り散る時、寄るべき拠り所（机）に駆け寄る段階。頼れる支えに身を寄せれば、悔いが消える。', advice:'バラバラになりかける時は、頼れる足場へ身を寄せること。拠り所を得れば、悔いは消えていきます。' },
          { text:'其の躬を渙らす。悔い无し。', meaning:'わが身へのこだわり（私心）を散らし去る段階。自分を捨てて大事に向かえば、悔いはない。', advice:'自分の都合や保身を、思いきって手放すこと。私心を散らして公に向かえば、悔いは残りません。' },
          { text:'其の羣を渙らす。元いに吉なり。渙るとき丘有り。夷の思う所に匪ず。', meaning:'私的な徒党を散らし、より大きく結び直す段階。偏った群れを解いて大吉。', advice:'身内の小集団を解き、より広い大義のもとに集め直すこと。私的なつながりを越えれば、大いに吉です。' },
          { text:'渙るとき其の大号を汗のごとくにす。渙るとき王居す。咎无し。', meaning:'汗のように行き渡る大号令を発し、散じた人心をまとめ直す中心の段階。中心が定まり咎なし。', advice:'散った人心は、汗のように染み渡る明確な呼びかけでまとめること。中心を立て直せば、咎なく収まります。' },
          { text:'其の血を渙らす。去り逖く出づれば、咎无し。', meaning:'傷つけ合う危うさ（血）を散らし去る渙の極み。害から遠く離れ出れば、咎を免れる段階。', advice:'傷つけ合う恐れは、遠ざけて断つこと。危うい間柄や場から離れ出れば、害なく済みます。' },
        ] },
  60: { num:60, name:'水澤節', reading:'すいたくせつ',
        judgment:'節は亨る。苦節は貞しくすべからず。',
        summary:'澤の上に水、ほどよく区切る節度のとき。度を保てば通る。苦しい節制は続かない。',
        keywords:['節度','区切り','適度'],
        image:'澤の上に水あるは節なり。',
        advice:'けじめと限度を設ける。ただし締めつけすぎは禁物。無理なく続く程よさを探りましょう。',
        lines:[
          { text:'戸庭を出でず。咎无し。', meaning:'戸口の庭からも出ず、慎んで控える始め。出るべきでない時を見極めて止まれば、咎なし。', advice:'動くべきでない時は、出口で止まること。慎んで控えれば、過ちは生じません。今は内を守る時。' },
          { text:'門庭を出でず。凶なり。', meaning:'出るべき時なのに門の庭からも出ず、機を逸する段階。度を越えた引きこもりは凶を招く。', advice:'控えるのも、度を越せば好機を逃します。出るべき時を見誤らないこと。引きすぎは禁物です。' },
          { text:'節せざれば、則ち嗟若たり。咎无し。', meaning:'節度を保てず、後で嘆くことになる段階。だが自ら招いたと悟れば、人を恨まず咎を免れる。', advice:'度を越せば、後で嘆くのは自分です。けじめのなさを悔やんだら、人のせいにせず改めること。' },
          { text:'節に安んず。亨る。', meaning:'無理なく、自然に節度に安んじる段階。身の丈に合った限度を守り、すらすら通る。', advice:'我慢でなく、自然に守れる程よさを身につけること。無理のないけじめは、長く続いてうまく運びます。' },
          { text:'甘んじて節す。吉なり。往きて尚ばるること有り。', meaning:'進んで心地よく節度を守る中心の段階。自らも喜び人にも及ぼす、模範となる吉。', advice:'けじめを、嫌々でなく心地よく守ること。自ら進んで節度を保てば吉、人にも尊ばれます。' },
          { text:'苦節す。貞なれば凶なり。悔い亡ぶ。', meaning:'苦しいほど厳しく締めつける節の極み。それを貫けば凶。だが行き過ぎを悔い改めれば悔い消ゆ。', advice:'締めつけすぎは、続かず害になります。苦しい節制を意地で貫かず、緩めるべきは緩めること。' },
        ] },
  61: { num:61, name:'風澤中孚', reading:'ふうたくちゅうふ',
        judgment:'中孚は豚魚も吉。大川を渉るに利ろし。貞しきに利ろし。',
        summary:'内に誠が満ちるとき。まことは魚や豚にまで及ぶ。信があれば大事も渡れる。',
        keywords:['誠','信頼','真心'],
        image:'澤の上に風あるは中孚なり。',
        advice:'まず自分の心を誠で満たす。うわべでなく真心で接すれば、相手の心にも必ず届きます。',
        lines:[
          { text:'虞れば吉なり。它有れば燕からず。', meaning:'誠を交わす初め、相手をよく見定めれば吉。心が他へ移れば、安らげない段階。', advice:'誠で結ぶ相手は、初めによく見極めること。心を定めれば吉。よそ見をすると、落ち着けません。' },
          { text:'鳴く鶴陰に在り。其の子之に和す。我に好爵有り。吾れ爾と之を靡くせん。', meaning:'陰で鳴く鶴に子が和すように、誠が見えぬ所でも響き合う段階。真心は、隔てなく通じ分かち合える。', advice:'まごころは、人目につかぬ所でも必ず伝わり、響き合います。誠を尽くせば、良きものを分かち合えます。' },
          { text:'敵を得たり。或いは鼓し或いは罷め、或いは泣き或いは歌う。', meaning:'頼る相手次第で、進んだり止まったり泣いたり歌ったり、心が定まらぬ段階。誠が外に振り回される。', advice:'相手に振り回されて、一喜一憂しないこと。誠の軸を自分の内に置けば、感情に揺さぶられずに済みます。' },
